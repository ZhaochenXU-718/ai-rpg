<svg width="920" height="720" viewBox="0 0 920 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AIRPG 叙事优先架构</title>
<desc>玩家自由输入或采用行动卡。主体感知供 Director、NPC 与旁白生成散文，模型抽取无权限事实，再由确定性铁律检查器校验并原子提交，冲突最多重写一次；成功后更新记忆、剧情锚点与状态时间线。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#57606a" stroke-width="1.5"/>
  </marker>
  <style>
    .title { font: 600 20px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; }
    .th { font: 600 14px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2328; }
    .ts { font: 400 12px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #57606a; }
    .engine { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 1.2; }
    .llm { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.2; }
    .author { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.2; }
    .state { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.2; }
    .future { fill: #fff1e5; stroke: #fb8f44; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .arr { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .leader { stroke: #8c959f; stroke-width: 1.1; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow); }
  </style>
</defs>

<rect x="0" y="0" width="920" height="720" fill="#ffffff"/>
<text class="title" x="460" y="34" text-anchor="middle">AIRPG：生成在前，事实校验在后</text>

<!-- Player -->
<rect class="engine" x="32" y="78" width="154" height="112" rx="10"/>
<text class="th" x="109" y="104" text-anchor="middle">玩家</text>
<text class="ts" x="109" y="128" text-anchor="middle">任意自然语言</text>
<text class="ts" x="109" y="148" text-anchor="middle">或可编辑行动卡</text>
<text class="ts" x="109" y="170" text-anchor="middle">继续 · 撤回 · 分支</text>

<!-- Runtime main loop -->
<rect class="engine" x="232" y="70" width="210" height="58" rx="9"/>
<text class="th" x="337" y="94" text-anchor="middle">主体感知墙</text>
<text class="ts" x="337" y="114" text-anchor="middle">player / npc / director 快照隔离</text>

<rect class="llm" x="232" y="158" width="210" height="88" rx="9"/>
<text class="th" x="337" y="182" text-anchor="middle">Director · NPC · 旁白</text>
<text class="ts" x="337" y="204" text-anchor="middle">编排 · 扮演 · 生成本回合散文</text>
<text class="ts" x="337" y="226" text-anchor="middle">输出都不是权威事实</text>

<rect class="llm" x="232" y="276" width="210" height="70" rx="9"/>
<text class="th" x="337" y="301" text-anchor="middle">事实抽取</text>
<text class="ts" x="337" y="323" text-anchor="middle">散文 → FactExtraction</text>

<rect class="engine" x="232" y="376" width="210" height="70" rx="9"/>
<text class="th" x="337" y="401" text-anchor="middle">铁律检查</text>
<text class="ts" x="337" y="423" text-anchor="middle">位置 · 物品 · 披露 · 承诺 · 边界</text>

<rect class="state" x="232" y="476" width="210" height="70" rx="9"/>
<text class="th" x="337" y="501" text-anchor="middle">原子提交 · 事实账本</text>
<text class="ts" x="337" y="523" text-anchor="middle">通过才增长 revision / checkpoint</text>

<rect class="engine" x="232" y="576" width="210" height="70" rx="9"/>
<text class="th" x="337" y="601" text-anchor="middle">锚点 · 结局 · 记忆更新</text>
<text class="ts" x="337" y="623" text-anchor="middle">订阅已提交事实，兑现关键因果</text>

<!-- Main arrows -->
<line class="arr" x1="186" y1="134" x2="228" y2="99"/>
<line class="arr" x1="337" y1="128" x2="337" y2="154"/>
<line class="arr" x1="337" y1="246" x2="337" y2="272"/>
<line class="arr" x1="337" y1="346" x2="337" y2="372"/>
<line class="arr" x1="337" y1="446" x2="337" y2="472"/>
<line class="arr" x1="337" y1="546" x2="337" y2="572"/>
<path class="arr" d="M 232 611 C 150 611, 109 420, 109 194"/>
<text class="ts" x="74" y="414" transform="rotate(-90 74 414)">叙事 + 事实回执</text>
<path class="arr" d="M 442 411 C 478 411, 478 311, 446 311"/>
<text class="ts" x="485" y="365">冲突反馈 · 有限重生成</text>

<!-- Author assets -->
<text class="th" x="742" y="64" text-anchor="middle">作者立法</text>
<rect class="author" x="622" y="82" width="240" height="70" rx="9"/>
<text class="th" x="742" y="107" text-anchor="middle">世界与风格</text>
<text class="ts" x="742" y="129" text-anchor="middle">边界 · 空间图 · 风格圣经</text>

<rect class="author" x="622" y="182" width="240" height="70" rx="9"/>
<text class="th" x="742" y="207" text-anchor="middle">核心人物与铁律</text>
<text class="ts" x="742" y="229" text-anchor="middle">动机 · 声音 · 秘密 · 位置 · 物品</text>

<rect class="author" x="622" y="282" width="240" height="70" rx="9"/>
<text class="th" x="742" y="307" text-anchor="middle">锚点与结局</text>
<text class="ts" x="742" y="329" text-anchor="middle">after_world 事实订阅</text>

<rect class="author" x="622" y="382" width="240" height="70" rx="9"/>
<text class="th" x="742" y="407" text-anchor="middle">Local Canon 边界</text>
<text class="ts" x="742" y="429" text-anchor="middle">原型 · 预算 · 生命周期</text>

<rect class="engine" x="622" y="512" width="240" height="96" rx="9"/>
<text class="th" x="742" y="537" text-anchor="middle">创作与质量工具</text>
<text class="ts" x="742" y="559" text-anchor="middle">内容校验 · 场景回归 · CLI 冒烟</text>
<text class="ts" x="742" y="581" text-anchor="middle">trace · checkpoint · 分支审计</text>

<!-- Author connections -->
<path class="leader" d="M 622 117 L 446 183"/>
<path class="leader" d="M 622 217 L 446 309"/>
<path class="leader" d="M 622 317 L 446 602"/>
<path class="leader" d="M 622 417 L 446 511"/>
<path class="leader" d="M 622 560 L 446 530"/>

<!-- Cross-cutting state -->
<rect class="state" x="72" y="672" width="776" height="30" rx="8"/>
<text class="ts" x="460" y="692" text-anchor="middle">状态时间线贯穿全局：权威 state · revision · checkpoint · undo · retained branches · trace</text>

<!-- Legend -->
<rect class="llm" x="484" y="630" width="12" height="12" rx="3"/>
<text class="ts" x="502" y="641">LLM 生成</text>
<rect class="engine" x="570" y="630" width="12" height="12" rx="3"/>
<text class="ts" x="588" y="641">确定性设施</text>
<rect class="state" x="674" y="630" width="12" height="12" rx="3"/>
<text class="ts" x="692" y="641">权威状态</text>
</svg>
