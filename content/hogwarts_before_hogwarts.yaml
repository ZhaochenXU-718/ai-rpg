    escalation: "三人必须分别说清自己自愿承担的责任，并接受海瑞将永久失去独占完整远古力量的资格。"
    resolution: "四巨头封印被改造成共同誓言媒介；复校之夜到来时，隐藏的第三个选择可以出现。"
    fallback: "任何一人若并非真正自愿，准备便立即停止；隐藏路线保持关闭，不以感情或责任逼迫同伴。"
