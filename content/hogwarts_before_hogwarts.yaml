    priority: high
    tags: [revelation, founders, final_truth]
    requires:
      - module: heirs_without_companions
        status: resolved

  prepare_shared_oath:
    category: aftermath
    title: "第三种誓言"
    purpose: "仅在玩家完成知识、关系与克制条件后，让主角团把隐藏路线从理论变成可在终局执行的准备。"
    hook: "莉迪亚把共同主语的译法、托比的名字见证和里德教授教给海瑞的中止边界结合起来，提出用四巨头封印容纳三个自愿守誓者。"
    trigger: |
      只在所有 requires 模块均已解决，而且此前叙事记忆表明海瑞珍惜同伴、没有把他人当作工具、
      曾主动停止扩大远古魔法时出现。不满足这些条件时，不得暗示这条路已经可行。
    involves:
