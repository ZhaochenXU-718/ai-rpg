    founders_seal: { type: carried_by, id: minerva_mcgonagall }


# ---------------------------------------------------------------------
# 九、剧情模块
# ---------------------------------------------------------------------

modules:

  first_rune_answers:
    category: main
    title: "符文回应"
    purpose: "以古代如尼文课上的异常正式接通海瑞血脉与遗迹，同时让核心同伴和威克利夫成为第一批见证者。"
    hook: |
      讲台石板中央的符号持续朝向海瑞。无论他伸手触碰还是试图避开，那道符号都会首先
      回应他的魔力：教室里所有魔杖同时转向他，墙壁浮现陌生门窗的轮廓，失传语言称他为“归誓者”。
    trigger: "故事开场或最初数回合内，海瑞、莉迪亚、托比与威克利夫在学术侧楼参加三年级古代如尼文课时出现。"
    involves:
      - player
      - lydia_hart
      - toby_beckett
      - helena_wycliffe
      - academic_wing
    escalation: "海瑞的无杖魔法本能回应符文，托比发现门外走廊尺寸改变，莉迪亚则注意到海瑞根本没有碰魔杖。"
    resolution: "异常暂时退去，但血脉与遗迹的联系已经重新接通；威克利夫终止课程并准备向麦格报告。"
    fallback: "若海瑞拒绝触碰，符文仍会在他离开时短暂发亮，以较弱的方式保留后续调查钩子。"
    repeatable: false
    min_turn: 1
    priority: high
    tags: [opening, ancient_runes, awakening]

  lydia_demands_truth:
    category: aftermath
    title: "没有挥动的魔杖"
    purpose: "把课堂事故转化为海瑞与莉迪亚之间的第一次重大信任选择，并为感情线建立真实矛盾。"
    hook: "课后，莉迪亚避开其他学生拦住海瑞，明确指出他施法时没有挥动魔杖，要求他不要再用‘什么也没发生’敷衍她。"
    trigger: "符文回应已经结束，莉迪亚与海瑞有机会在拉文克劳塔楼、空走廊或其他相对私密的地方交谈时出现。"
    involves:
      - player
      - lydia_hart
      - ravenclaw_tower
    escalation: "海瑞可以坦白、只透露部分事实、请求时间，或继续否认；莉迪亚会根据他的真实态度而非答案完整程度作出反应。"
    resolution: "双方对秘密的边界形成一次明确约定；真诚信任会拉近关系，持续欺骗则留下之后必须面对的裂痕。"
    fallback: "莉迪亚暂时停止追问，但开始独自记录海瑞周围的异常，不把这次回避当作事情已经结束。"
    repeatable: false
    min_turn: 2
    priority: high
    tags: [relationship, trust, romance]
    requires:
      - module: first_rune_answers
        status: offered

  crooked_corridor_map:
    category: character
    title: "多出来的走廊"
    purpose: "展示托比独特的空间智慧，让他成为调查中不可替代的伙伴，而不是只负责缓和气氛的人。"
    hook: "托比拿出自己凭记忆画下的城堡路线，指出活动楼梯附近凭空多出了一段不符合任何楼层尺寸的走廊。"
    trigger: "符文事件发生后，海瑞与托比位于主楼或拉文克劳塔楼，并且故事尚未正式找到古代壁画长廊时出现。"
    involves:
      - player
      - toby_beckett
      - main_castle
    escalation: "两人核对脚步、窗户和墙体厚度，发现异常空间只在海瑞接近时与现代城堡短暂重合。"
    resolution: "托比绘成第一张异常地图，确认遗迹正在改变霍格沃茨的空间结构。"
    fallback: "走廊在他们追上前消失，托比保留地图并决定下一次先用粉笔留下标记。"
    repeatable: false
    min_turn: 2
    priority: normal
    tags: [friendship, exploration, castle]
    requires:
      - module: first_rune_answers
        status: offered

  book_without_title:
    category: main
    title: "没有书名的书"
    purpose: "引入遗迹具有立场的知识来源，逐步解释远古魔法，同时保留它对继承代价的误导。"
    hook: "禁书区的登记册多出一行空白索引，铁栅后则出现一本昨天还不存在的厚重古书；海瑞靠近时，空白书页开始书写真名与誓言。"
    trigger: "符文回应已经发生，玩家主动调查古代文字、禁书区或学校历史，并来到学术侧楼时出现。"
    involves:
      - player
      - lydia_hart
      - helena_wycliffe
      - academic_wing
    escalation: "古书承认四位创始人之前存在另一所学院，却把继承者失去亲友描述为‘解除牵绊’，诱导海瑞继续阅读。"
    resolution: "主角团确认古书只对海瑞完整显字，并得到寻找孤身继承者壁画和湖底古塔的线索。"
    fallback: "古书合上并暂时恢复空白，留下一个只有海瑞能够看见的壁画坐标。"
    repeatable: false
    min_turn: 3
    priority: high
    tags: [mystery, forbidden_section, true_names]
    requires:
      - module: first_rune_answers
        status: offered

  forbidden_magic_rumor:
    category: pressure
    title: "禁术的传闻"
    purpose: "让海瑞隐藏力量的策略产生校园后果，并通过欧文与卢西安呈现恐惧和崇拜两种外部压力。"
    hook: "关于如尼文教室事故的说法已经传遍几个学院：欧文公开怀疑海瑞使用禁术，卢西安则意味深长地称那是被埋没的天赋。"
    trigger: "至少一次远古异常被学生目击，且故事已进入校园传闻能够扩散的阶段时出现。"
    involves:
      - player
      - owen_mercer
      - lucian_vane
      - main_castle
    escalation: "欧文要求海瑞在公开条件下证明自己，卢西安则试图把冲突引向‘现代规则是否有权限制天赋’。"
    resolution: "海瑞以解释、展示克制或拒绝表演的方式确立公开立场；无论结果如何，学生群体开始形成不同看法。"
    fallback: "传闻暂时被下一件校园新闻盖过，但欧文的怀疑和卢西安的兴趣都没有消失。"
    repeatable: false
    min_turn: 6
    priority: normal
    tags: [school_pressure, rivalry, temptation]
    requires:
      - module: first_rune_answers
        status: offered

  lake_searches_for_names:
    category: side
    title: "塔在寻找名字"
    purpose: "从黑湖生物与天文学两个角度证明湖底古塔真实存在，并建立继承仪式的时间压力。"
    hook: "罗文展示黑湖生物突然迁离深水区的记录；它们反复留下同一句含混警告：塔正在寻找能够称呼的名字。"
    trigger: "玩家调查黑湖、古塔或星象，来到黑湖岸或天文塔，并愿意认真听取非人类生物的警告时出现。"
    involves:
      - player
      - rowan_pike
      - aurora_sinistra
      - black_lake_grounds
      - astronomy_tower
    escalation: "辛尼斯塔通过重复观测确认塔影与特定星辰排列同步，下一次完整重合将成为遗迹全面复校的窗口。"
    resolution: "主角团获得可计算的星象期限，也确认古塔并非普通幻觉或水下废墟。"
    fallback: "云层遮住观测，罗文保留生物记录；塔影将在下一次晴夜再次出现。"
    repeatable: false
    min_turn: 5
    priority: normal
    tags: [black_lake, astronomy, world_texture]
    requires:
      - module: first_rune_answers
        status: offered

  heirs_without_companions:
    category: main
    title: "孤身的继承者"
    purpose: "通过古代壁画与誓言残片铺设选择二的核心代价，但不立即给出完整答案。"
    hook: "托比的异常地图与无题古书的坐标重合，活动楼梯短暂接上一条古代壁画长廊；每幅画都只有一名统治者，身边却留着不自然的空位。"
    trigger: "无题古书的线索已经取得，玩家继续追查继承者历史并来到主楼活动楼梯附近时出现。"
    involves:
      - player
      - toby_beckett
      - talia_croft
      - nell_whitby
      - oath_border_fragment
      - main_castle
    escalation: "内尔指出空位符合亲密人物的构图距离；塔莉娅承认家族残片能够补上其中一角，并要求以秘密、帮助或信任进行交换。"
    resolution: "残片证明壁画原本存在其他人物，但他们的脸、姓名和轮廓遭到同一种魔法抹除；具体原因仍待破解。"
    fallback: "壁画长廊开始退出现实，塔莉娅保留残片，但确认海瑞若想知道更多就必须再次找她。"
    repeatable: false
    min_turn: 6
    priority: high
    tags: [mystery, murals, erased_people]
    requires:
      - module: book_without_title
        status: engaged

  reed_lesson_in_stopping:
    category: character
    title: "停止，而不是释放"
    purpose: "让现代魔法的限制成为有价值的能力，为海瑞拒绝绝对控制及隐藏路线提供克制基础。"
    hook: "里德教授没有要求海瑞再次完成失败的标准咒语，而是让他在魔力形成的一瞬间主动停止，并指出停止本身也是施法。"
    trigger: "海瑞经历远古魔法失控或对自己的力量产生恐惧，且里德与海瑞在学术侧楼有训练机会时出现。"
    involves:
      - player
      - silas_reed
      - academic_wing
    escalation: "训练迫使海瑞面对一个事实：远古力量会把任何犹豫理解为需要被消除的阻力，而现代魔法允许修正和撤回。"
    resolution: "海瑞若愿意练习，便第一次掌握在命令完成前主动中止的方法；若拒绝，里德也明确说明失控不是天赋证明。"
    fallback: "里德结束训练并留下练习要求，等待海瑞愿意把克制当作力量的一部分。"
    repeatable: false
    min_turn: 4
    priority: normal
    tags: [mentor, restraint, modern_magic]
    requires:
      - module: first_rune_answers
        status: offered

  wycliffe_proves_erasure:
    category: character
    title: "被画面遗忘的人"
    purpose: "让威克利夫承认旧研究的错误，证明壁画中的空白来自现实抹除，并使成人盟友真正尊重学生的发现。"
    hook: "威克利夫把誓言残片与多年收集的壁画拓本叠在一起，发现每一处空白都精确对应亲人、朋友或伴侣本应站立的位置。"
    trigger: "孤身继承者壁画已被发现，玩家愿意把证据交给威克利夫或与她共同验证时出现。"
    involves:
      - player
      - lydia_hart
      - helena_wycliffe
      - oath_border_fragment
      - academic_wing
    escalation: "威克利夫必须承认自己过去把魔法删除误判为自然毁损，也意识到无题古书所谓‘解除牵绊’刻意省略了受害者。"
    resolution: "众人证明继承仪式会处理继承者的人际关系，却仍需四位创始人的记录才能确认被删除者遭遇了什么。"
    fallback: "威克利夫暂时封存资料，但把一份拓本留给学生继续寻找反例。"
    repeatable: false
    min_turn: 7
    priority: high
    tags: [mentor, evidence, erased_people]
    requires:
      - module: heirs_without_companions
        status: resolved

  inheritance_invitation:
    category: pressure
    title: "继承者的邀请"
    purpose: "让接受远古传承成为具有真实吸引力的立场，并通过卢西安挑战海瑞对现代魔法秩序的信任。"
    hook: "卢西安带来家族对孤身继承者的另一种解释：那些统治者不是受害者，而是摆脱软弱后终于能够按照意志重塑世界的人。"
    trigger: "海瑞已经接触无题古书或壁画，并因魔杖失败、教授约束或同学怀疑感到挫败时出现。"
    involves:
      - player
      - lucian_vane
      - main_castle
    escalation: "卢西安指出远古力量可以保存知识、阻止战争并让海瑞不再为天赋道歉，但刻意淡化壁画中消失的人。"
    resolution: "海瑞明确表达接受、拒绝或保留判断；卢西安由此调整之后是继续说服、保持距离还是帮助调查。"
    fallback: "卢西安不再追问，只留下一个问题：如果现代魔法真的足够好，四位创始人为何仍要借用远古封印？"
    repeatable: false
    min_turn: 8
    priority: normal
    tags: [temptation, ideology, inheritance]
    requires:
      - module: book_without_title
        status: engaged

  toby_refuses_sacrifice:
    category: character
    title: "最不重要的那个人"
    purpose: "解决托比对自身价值的怀疑，并确立隐藏路线所需的伦理核心：任何人都不能因看似不重要而成为代价。"
    hook: "面对壁画空位和两位朋友不断深入的研究，托比用玩笑问自己是不是三个人里最适合从记录中消失的那个。"
    trigger: "壁画代价已经显露，托比参与过异常地图调查，并在相对私密的关系场景中不再能用玩笑回避不安时出现。"
    involves:
      - player
      - toby_beckett
      - lydia_hart
      - ravenclaw_tower
    escalation: "海瑞与莉迪亚必须真正回应托比的价值，而不是用空泛保证带过；托比也会指出聪明、力量与可牺牲性之间没有合理等式。"
    resolution: "三人明确拒绝以任何一个伙伴作为预设代价，托比提出‘名字之所以存在，是因为有人愿意这样称呼你’的共同见证思路。"
    fallback: "托比重新戴上轻松表情，却开始在调查中主动后退，等待朋友用行动证明他没有被排除。"
    repeatable: false
    min_turn: 8
    priority: high
    tags: [friendship, self_worth, hidden_path]
    requires:
      - module: crooked_corridor_map
        status: engaged
      - module: heirs_without_companions
        status: engaged

  lydia_reads_conditional_oath:
    category: character
    title: "如果誓言不止一个主语"
    purpose: "推进海瑞与莉迪亚的信任及潜在感情，同时让她从语言结构中发现隐藏路线的理论可能。"
    hook: "莉迪亚发现誓言残片中的‘唯一’并非描述继承者，而是要求一个完整、不容异议的命令来源；如果多个自愿者共同构成一个主语，旧规则可能无法拒绝。"
    trigger: "莉迪亚与海瑞已经解决第一次隐瞒冲突，壁画抹除得到证明，二人有机会共同研究誓言时出现。"
    involves:
      - player
      - lydia_hart
      - oath_border_fragment
      - ravenclaw_tower
      - academic_wing
    escalation: "研究需要海瑞把对力量和失去她的恐惧说得足够坦诚；莉迪亚可以表达自己的在意，但不会要求海瑞回应感情作为合作条件。"
    resolution: "莉迪亚完成共同主语的初步译法，证明第三种誓言在语言上可能成立，但仍缺少封印媒介与自愿见证。"
    fallback: "译文停在关键代词上，莉迪亚收起笔记，说明信任问题若不解决，任何共同誓言都只是另一种强迫。"
    repeatable: false
    min_turn: 9
    priority: high
    tags: [romance, scholarship, hidden_path]
    requires:
      - module: lydia_demands_truth
        status: resolved
      - module: wycliffe_proves_erasure
        status: resolved

  castle_rehearses_reset:
    category: pressure
    title: "复校预演"
    purpose: "把遗迹威胁从私人谜团升级为全校危机，展示远古秩序会如何覆盖学院、规则与个体身份。"
    hook: "四个学院的旗帜同时褪色，盔甲朝海瑞所在方向跪下，画像忘记‘霍格沃茨’这个名字，活动楼梯开始把学生送往陌生的远古阶层。"
    trigger: "孤身继承者壁画已经发现，故事进入中后段且需要一次全校可见的升级事件时出现。"
    involves:
      - player
      - minerva_mcgonagall
      - owen_mercer
      - beatrice_doyle
      - nell_whitby
      - main_castle
    escalation: "麦格组织疏散，海瑞则必须选择以远古命令迅速压制异常、用里德教授的克制方法限制它，或依靠同伴协作救出被错置的学生。"
    resolution: "现代城堡暂时恢复，但所有人都知道异常真实存在；麦格决定取出四巨头封印徽记。"
    fallback: "复校波动自行退去却留下永久痕迹，学校进入更严格的夜间管制。"
    repeatable: false
    min_turn: 12
    priority: high
    tags: [escalation, school_crisis, ancient_order]
    requires:
      - module: heirs_without_companions
        status: engaged

  founders_last_record:
    category: main
    title: "四位创始人的最后记录"
    purpose: "在终局前完整揭示远古文明毁灭、继承代价和四巨头封印的真相，使玩家能够在知情情况下选择。"
    hook: "麦格带来四巨头封印徽记；它与无题古书及誓言残片接触后，释放四位创始人共同留下、从未写入校史的最后记录。"
    trigger: "壁画抹除已经得到证据，遗迹威胁足够明确，麦格相信继续隐瞒比公开真相更危险时出现。"
    involves:
      - player
      - minerva_mcgonagall
      - helena_wycliffe
      - lydia_hart
      - toby_beckett
      - founders_seal
      - oath_border_fragment
    escalation: "记录揭示远古文明毁于绝对命令；每次完整继承都会将继承者最重要的人从现实中抹除，只让继承者保留记忆。"
    resolution: "两个基础终局及其代价被明确：封闭遗迹并放弃大部分力量，或接受传承并失去最重要的人；星象期限也进入最后阶段。"
    fallback: "记录因材料未能稳定共鸣而中断，但已显露足以促使众人重新准备的一段牺牲真相。"
