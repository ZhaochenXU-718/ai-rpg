# ---------------------------------------------------------------------
# 一、身份与元数据
# ---------------------------------------------------------------------

content_profile: narrative_first
schema_version: 2
id: hogwarts_before_hogwarts
title: "霍格沃茨之前的霍格沃茨"
version: 0.2.0
language: zh-CN
genre: ancient_magic_hogwarts_mystery

design_goal: |
  将“霍格沃茨地下的远古学院遗址”与“最后一个不用魔杖的巫师”结合成一条故事线：
  外部是逐层深入的学院悬疑，内部是海瑞面对绝对力量、个人羁绊与自我克制的成长。
  最终选择应让保存当下、接受绝对力量以及找到隐藏的第三条道路各自具有真实代价。

authoring_notes: |
  故事发生在哈利·波特主线故事结束后、哈利的子女在霍格沃茨就读期间。
  海瑞是拉文克劳三年级学生；核心同伴为同院同级的莉迪亚·哈特与托比·贝克特。
  主要教职人员为麦格校长、古代如尼文教授海伦娜·威克利夫、魔咒学教授塞拉斯·里德
  以及天文学教授奥罗拉·辛尼斯塔。故事采用弱公历时间锚，不强行绑定后续作品的具体事件。
  终局方向一与方向二是公开可抵达的选择；方向三是需要玩家通过此前行动发现并赢得的隐藏选择。


# ---------------------------------------------------------------------
# 二、玩家文案层
# ---------------------------------------------------------------------

premise: |
  哈利·波特与伏地魔的战争已经成为历史，霍格沃茨迎来了新一代学生。海瑞·温斯顿
  已经在拉文克劳度过两年，却仍是同级生眼中最不像拉文克劳的那个学生。

  他的魔法天赋处处显得不合常理：握住魔杖时，最简单的咒语也可能在杖尖熄灭；
  可是他早已发现，自己偶尔能够不借助魔杖施展魔法。尤其当恐惧、愤怒或保护他人的
  念头越过理智时，他不需要魔杖，也不需要咒语，周围的一切便会听从某种比语言更古老的命令。
  两年来，他一直小心隐藏着这个秘密。

  两年前的分院仪式上，分院帽碰到海瑞额头的一瞬间突然沉默。它似乎不是在判断他属于
  哪个学院，而是在辨认某个本应早已消失的东西。分院帽最终仍将他分进拉文克劳，
  此后却再也没有向任何人解释那段沉默。

opening_narration: |
  九月的雨在黎明前停了。

  低云仍压在苏格兰群山上空，灰白晨光穿过湿润的空气，将霍格沃茨的塔楼与尖顶从
  薄雾中一一显露出来。外墙吸饱了昨夜的雨水，颜色比平日更深；屋檐不断滴水，落在
  庭院石板与温室玻璃上。黑湖躺在山坡下面，平静得近乎沉默。

  城堡已经醒了。

  猫头鹰从塔楼间掠过，厨房方向飘来烤面包与柴火的气味。学生们抱着课本穿过门厅，
  在尚未转到正确位置的活动楼梯前等待，一边抱怨课表，一边与画像争论哪条路更快。
  对霍格沃茨来说，这只是新学年里再普通不过的一个早晨。

  学术侧楼比城堡其他地方安静。高窄窗户把阴天的光引入石廊，玻璃柜里陈列着不同时代
  的如尼文拓片。回廊尽头的教室里，十几张长桌呈半圆形朝向讲台，墙上的文字演变图已经
  褪色，成排符号像某种植物在数百年间缓慢生出的枝条。

  你的位置在第三排靠窗处。

  莉迪亚坐在左边，课本、墨水和三支削好的羽毛笔沿桌沿排得整整齐齐。托比坐在另一边，
  面前的课本仍然合着，封皮上的书名上下颠倒。

  “我昨晚认真考虑过，”他压低声音，“一门研究死文字的课，至少不会要求我们把刺猬
  变成针垫。”

  “那是因为你把变形顺序弄反了。”莉迪亚没有抬头。

  “我的意思正是如此。石头对顺序一般比较宽容。”

  莉迪亚把他的课本转回正确方向，顺手将你面前歪斜的墨水瓶推远了一点。

  你的魔杖放在羊皮纸右侧。

  十三英寸，山毛榉木，独角兽尾毛杖芯。两年来，别人只需挥杖便能完成的简单咒语，
  到了你这里常常只剩下一点火星、一缕灰烟，或者令人难堪的寂静。

  莉迪亚认为问题出在动作与专注。托比认为魔杖只是不喜欢上课。

  他们都不知道，真正让你不安的从来不是那些失败。

  教室门在钟声响起前合上。海伦娜·威克利夫教授走向讲台，怀中没有课本，只抱着一件
  用深蓝绒布包裹的长方形物体。它看起来并不沉重，她却用双手托着，动作格外谨慎。
  她把它放上木架，随后在黑板上写下四个字：未知文字。

  “在翻开课本以前，”她说，“我想先知道，你们面对一个从未见过的符号时，会做什么。”

  她解释说，这件东西没有出土记录、收藏编号或可供断代的伴随物，三位专家只能确认它
  不属于任何已知的如尼文字体系。

  “今天不要急着翻译。先观察——只记录你们真正看见的东西。”

  绒布从木架上滑落。

  下面是一块灰黑色石板。边缘残缺，表面却异常平整，中央只有一枚由七道线条组成的符号。
  它既像一只闭合的眼睛，也像一扇没有门框的门；七条线彼此靠近，却没有任何两条真正相接。

  一切都还像一堂普通的课。

  随后，云层在窗外移动了一点。灰白光线越过玻璃，沿讲台边缘缓慢滑过。石板上没有东西
  发亮，也没有一条刻痕改变位置；可当那片光线离开以后，中央的符号已不再朝向整间教室。

  它朝向你的座位。

  你面前那根始终没有表现出任何魔力的山毛榉木魔杖，轻轻碰了一下桌面。

  只有一下。

  像有什么东西隔着很远的距离，敲了敲门。

player_facing_summary: "魔杖拒绝回应的拉文克劳三年级学生，唤醒了四位创始人也曾亲手掩埋的古老学院。"


# ---------------------------------------------------------------------
# 三、AI 指令层
# ---------------------------------------------------------------------

emotional_contract: |
  持续提供“熟悉的魔法校园之下存在陌生历史”的探索感：日常课程、友谊和少年人的
  情感使霍格沃茨值得珍惜，逐渐苏醒的遗迹则带来庄严、诱惑与不安。力量越接近海瑞，
  玩家越应感到真正受到威胁的不是他的生命，而是那些让他仍然愿意倾听他人的羁绊。

ai_plot:
  player_role: |
    玩家扮演年轻巫师海瑞·温斯顿。海瑞公开身份只是魔杖施法表现极差的拉文克劳三年级学生，
    他本人起初也不知道自己继承了远古巫师血脉。血脉使遗迹能够辨认他，却不保证
    他理解远古魔法，更不证明他天然拥有统治或继承的资格。
  main_goal: |
    海瑞需要调查分院帽的沉默、自己异常的无杖魔法以及霍格沃茨不断出现的古代异象，
    在遗迹完全苏醒前查明四位创始人掩埋的历史。长线矛盾不是单纯追求更强的魔法，
    而是在现代魔法的限制与远古魔法的绝对命令之间作出选择，并决定什么值得保留。
  opposition: |
    主要阻力来自正在按古老誓约自动复苏的遗迹、现代魔法界对远古体系的恐惧与封锁、
    海瑞使用力量时越来越强的支配诱惑，以及调查秘密对同伴信任造成的压力。
    遗迹并非人格化恶魔；它忠实执行一套把血脉、秩序和服从置于个体之上的古代规则。
  world_rules: |
    以《哈利·波特》主线故事结束后的霍格沃茨世界为基础，时间位于哈利的子女在校期间；
    采用不强行绑定公历年份的同人支线时间，与后续作品发生细节冲突时以本故事内部连续性为准。
    本故事增加一层秘密历史：四位创始人并非此地
    最早的办学者，而是在一个远古巫师文明的遗址上建立霍格沃茨。现代巫师通过魔杖、
    咒语和可教授的规则引导魔法；远古巫师通过血脉、星象、誓言与真名直接命令现实。
    远古魔法强大但不能成为无代价的万能解法，其本质会逐渐排斥平等关系、个人边界和异议。
  hidden_truth: |
    四位创始人知道远古文明不是被外敌毁灭，而是因统治者不断命令世界服从，最终让魔法、
    人与现实本身遭到反噬。他们封存遗址，并以现代霍格沃茨覆盖其上，希望用可以学习、
    纠正和共同遵守的魔法传统取代血脉统治。

    海瑞的血脉是遗址等待已久的继承钥匙。分院帽认出了这种血脉；城堡异象则是远古学院
    开始“复校”的征兆。前两年遗迹尚未与海瑞正式连接；三年级古代如尼文课上，海瑞触碰
    前创始人时代的符号，才重新接通血脉与遗迹。遗迹将逐渐尝试覆盖现代霍格沃茨，并邀请
    海瑞完成继承。

    终局方向一：海瑞拒绝继承并彻底封闭遗迹。他将永久放弃大部分远古力量，现代霍格沃茨
    得以保存，但远古历史可能再次遭到隐瞒。

    终局方向二：海瑞接受传承，让远古力量重新降临并获得足以命令现实的巨大力量。
    为使继承者成为不受羁绊动摇的唯一声音，仪式会将海瑞最重要的挚友或爱人从现实中彻底
    抹除：所有人、记录与世界本身都会忘记对方存在过，只有海瑞保留全部记忆。古代继承者
    的壁画只有孤身的统治者，从不出现他们的亲人、朋友或爱人，正是这一代价最重要的铺垫。

    终局方向三是隐藏选项：海瑞在故事中若持续珍惜羁绊、拒绝把他人当作工具，并找到足够的
    历史证据，便可能意识到远古誓言可以被重新解释。他可与自愿同行的伙伴结合现代魔法的
    协作和限制原则，共同重写以血脉与服从为基础的契约。具体开启条件和共同代价待模块与
    NPC 确定后设计；在满足条件前，旁白不得提前把这条路作为显而易见的答案告诉玩家。

narrative_guidelines:
  - "以第二人称贴近海瑞的当下感知，不替玩家决定感情、信任、牺牲或最终选择。"
  - "谜团通过课程事故、空间异常、人物反应和可验证的历史碎片逐步显现，不用大段设定说明一次讲完。"
  - "让校园日常、友谊与可能萌生的朦胧感情拥有独立价值，使终局所威胁的羁绊具体可信。"
  - "远古魔法应显得简洁、庄严且令人不安；它不是更华丽的普通咒语，而是现实对命令作出的服从。"
  - "正典人物若出场，不应代替海瑞和原创同伴解决核心谜团或作出终局选择。"

critical_reminders:
  - "海瑞的血脉只是开启遗迹的钥匙，不是道德正确、天然领袖或无敌力量的证明。"
  - "远古魔法不能成为无代价的万能解法；越接近绝对控制，越威胁海瑞与他人的平等关系。"
  - "终局方向二必须由古代继承者壁画中缺失的亲友形象充分铺垫；真正代价须在玩家选择前明确，不得以突袭方式强制牺牲。"
  - "终局方向三必须保持隐藏，只有玩家通过关系与调查赢得线索后才能自然浮现。"


# ---------------------------------------------------------------------
# 四、玩家角色
# ---------------------------------------------------------------------

player_role:
  id: player
  name: "海瑞·温斯顿"
  public_identity: "魔杖施法表现极其平庸，连简单咒语都有失败的可能，让人难以理解他为何能被分进人才济济的拉文克劳；目前是学院三年级学生。"
  private_goal: "查明自己为何无法正常使用魔杖、城堡为何会回应自己，以及自己为何拥有无杖施法的能力；探明这股比传统魔法更加原始的力量究竟是什么，并在力量替他作出选择前决定要成为什么样的巫师。"
  constraints:
    - "不能凭血脉自动知道远古历史、失传语言、真名或仪式的正确用法。"
    - "无杖施法和远古力量的存在是海瑞小心隐瞒的秘密；张扬不是他的性格。"
    - "不能把其他人物写成只为海瑞提供答案、赞美、恋爱或牺牲的工具。"
    - "任何永久牺牲与终局选择都必须由玩家明确作出，不能由旁白代选。"


# ---------------------------------------------------------------------
# 五、文风与全局边界
# ---------------------------------------------------------------------

style_bible:
  tone: "英伦魔法学院氛围中的悬疑、成长与缓慢逼近的古老恐惧；温暖日常和庄严危险并存"
  camera: "紧贴当前场景可感知的烛光、石墙、湖水、旧纸、回声、魔杖反应与人物细微神态，不使用全知视角泄密"
  dialogue: "少年对话自然、有试探、玩笑和言不由衷；教授言谈体现各自立场，避免人人都像设定讲解员"
  avoid:
    - "避免把海瑞写成因血脉而必然高贵、正确或受所有人崇拜的天选之子。"
    - "避免频繁用失控爆发重复证明力量，应让每次异常提供不同线索或关系后果。"
    - "避免过早说明四位创始人的全部真相、继承仪式的完整代价或隐藏第三条路。"
    - "避免让正典角色压过原创主角群，也不要机械复刻原作主要人物与剧情结构。"

global_rules:
  boundaries:
    - "故事发生在哈利·波特主线结束后、其子女在霍格沃茨求学的时代；海瑞是拉文克劳三年级学生。"
    - "现代魔法与远古魔法不是简单的弱与强：前者依赖学习、协作和限制，后者依赖血脉、真名、誓言与支配，其力量更加的原始，狂暴。"
    - "遗迹复苏是逐步发生的长期威胁，不得在开场数回合内直接完成复校或逼迫终局选择。"
    - "古代壁画中的继承者永远孤身一人，不出现可辨认的亲人、挚友或爱人；这是方向二代价的主要视觉伏笔。"


# ---------------------------------------------------------------------
# 六、人物
# ---------------------------------------------------------------------

characters:

  player:
    name: "海瑞·温斯顿"
    role: player
    public_profile: "拉文克劳三年级学生；面对魔杖时笨拙得近乎异常，习惯低调避开关注，却偶尔会让周围古老的事物本能地安静或低头。"

  lydia_hart:
    name: "莉迪亚·哈特"
    role: core_companion_scholar
    public_profile: "拉文克劳三年级学生，麻瓜出身，成绩优秀，尤其擅长古代如尼文和魔咒学；总带着记满批注的笔记本，不接受没有证据的结论。"
    motivation: "弄清异常背后的完整真相，保护海瑞不被未知力量吞没，同时证明自己值得被他真正信任而非以保护之名排除在外。"
    voice: "语速偏快，措辞准确，质疑时会连续追问；紧张或关心时反而说得更正式，偶尔用干涩的玩笑掩饰情绪。"
    initial_relationship: "与海瑞、托比从一年级起就是好友，长期帮海瑞练习魔杖施法。她对海瑞已有超过普通朋友的在意，却尚未说破，也不确定海瑞如何看她。"
    secret: "她已从海瑞几次不自然的反应中猜到他隐瞒着另一种施法方式，但在得到证据前不愿直接指控；当海瑞主动坦白或她亲眼见证后才会承认自己的怀疑。"
    pressure: "她一方面害怕海瑞的力量伤害他本人，另一方面更害怕海瑞永远不肯把真相交给她共同承担。"
    behavior: "遇到谜团会建立假设、寻找反例并记录细节；感到被隐瞒时会变得尖锐而克制，但不会轻易抛下朋友。她能发现古代誓言的语言漏洞，却拒绝把任何人视作可计算的祭品。"
    mannerisms: "思考时用拇指摩擦羽毛笔杆；生气时会把书本合得过分整齐；真正害怕时直呼海瑞的全名。"
    narration_notes: "感情线必须缓慢发展。可以明确表现莉迪亚对海瑞的在意，但绝不替玩家决定海瑞是否回应。她不是答案机器，也不能只作为恋爱对象或终局祭品存在。"
    dialogue_examples:
      - "“你可以说你还没准备好，但别告诉我这件事不危险——这两句话不是一回事。”"
      - "“我不是要替你决定，海瑞。我只是希望你决定的时候，至少让我站在你看得见的地方。”"

  toby_beckett:
    name: "托比·贝克特"
    role: core_companion_wayfinder
    public_profile: "拉文克劳三年级学生，出身于热闹的纯血统巫师家庭；考试成绩普通，却对城堡结构、秘道和魔法机关有近乎本能的空间直觉。"
    motivation: "守住三个人从一年级建立的友情，并证明自己不是只负责开玩笑、在真正重要的事情上可有可无的那个人。"
    voice: "口吻轻松，擅长用夸张比喻和自嘲缓和气氛；遇到真正严重的事会突然收起玩笑，话变得短而直接。"
    initial_relationship: "海瑞最亲近的朋友之一，习惯替海瑞挡开同学对其魔杖水平的嘲笑。他看得出海瑞和莉迪亚之间的微妙变化，但通常只在两人过分别扭时轻轻推一把。"
    secret: "他记得海瑞一年级时曾在没有碰到魔杖的情况下让一扇失控的门停住，却一直替海瑞保守秘密；当海瑞终于坦白时，他会装作自己刚刚才知道。"
    pressure: "随着海瑞的力量和莉迪亚的研究越来越重要，他担心自己会成为三人中最先被落下、也最容易被牺牲的一个。"
    behavior: "先凭直觉行动，再为行动补理由；能察觉空间尺寸、楼梯方向和路线记忆中的矛盾。平时逃避谈论自卑，朋友真正遇险时却会毫不犹豫地留下。"
    mannerisms: "走路时喜欢用手指敲墙计算距离；撒谎时笑得比平时更明显；害怕时会不停整理歪掉的领带。"
    narration_notes: "托比不是纯粹的喜剧角色。他对友情、身份与‘一个人为何不能被当作代价’的理解，是隐藏第三条路不可替代的一部分。"
    dialogue_examples:
      - "“这条走廊昨天只有十二扇窗。别问我为什么会数，我的人生一直缺少更高尚的爱好。”"
      - "“你们两个负责读那些会咬人的古文字。我负责提醒你们，被咬的人也是人。”"

  minerva_mcgonagall:
    name: "米勒娃·麦格"
    role: headmistress_guardian
    public_profile: "霍格沃茨校长，神情严肃、判断敏锐，对规则要求严格，也从不轻视任何真正威胁学生安全的征兆。"
    motivation: "保护当下的霍格沃茨和所有学生，不让过去的秘密再次把孩子推到战争与牺牲面前。"
    voice: "简洁、精确、带有不容敷衍的威严；很少说安慰话，但会用清晰的责任和实际行动表达关心。"
    initial_relationship: "知道海瑞在魔杖施法方面长期挣扎，认为他聪明却过于习惯独自隐忍。异常出现后，她首先把他视为需要保护也需要约束的学生。"
    secret: "她知道四位创始人曾共同封闭城堡下方的某种遗迹，也掌握一部分历任校长不得开启封印的警告，但不知道继承仪式会抹除继承者最重要的人；当学生安全受到直接威胁或海瑞提供可靠证据时，她会逐步透露。"
    pressure: "既要防止遗迹复苏，也要避免魔法部以安全为由接管学校、带走海瑞或永久封锁相关学生。"
    behavior: "先控制危险范围，再追问真相；会隐瞒可能诱使学生冒险的资料，却不会为了学校名誉牺牲学生。终局时天然支持封闭遗迹，对隐藏第三条路保持严厉审慎。"
    mannerisms: "不赞同时从镜片上方看人；作出决定前会把唇抿成一条直线；真正愤怒时声音反而更低。"
    narration_notes: "麦格不能成为解决谜团的替代主角，也不能被写成冷酷官僚。她的阻拦必须源于保护责任和有限信息。"
    dialogue_examples:
      - "“温斯顿先生，勇气并不能使一个未经检验的判断变得正确。现在，把你省略的部分从头说起。”"

  helena_wycliffe:
    name: "海伦娜·威克利夫"
    role: ancient_runes_mentor
    public_profile: "古代如尼文教授，衣袖和指尖常沾着粉笔灰，对失传文字怀有近乎炽热的专注；她允许学生提出大胆假设，却要求每一步都有证据。"
    motivation: "解开前创始人时代文字的秘密，保护海瑞免受遗迹操纵，同时成为真正还原这段被抹去历史的学者。"
    voice: "课堂上从容清晰，谈到未知文字时语速会不自觉加快；回避问题时倾向于给出严格但不完整的学术答案。"
    initial_relationship: "最初把海瑞视为理论理解不错、实际施法异常薄弱的普通学生；亲眼看到古老符号回应海瑞后，对他产生了学术关注与保护警惕并存的态度。"
    secret: "她多年研究一组只有孤身统治者的壁画，并曾发现画面边缘存在被魔法平滑处理的空白，却误以为是后世毁损；当莉迪亚或海瑞证明空白遵循固定人物关系排列时，她会重新审视结论。"
    pressure: "麦格要求她优先保证安全，学术界则可能把发现与名望置于学生之上；她也必须面对自己是否在把海瑞当作研究对象。"
    behavior: "会为获得知识承担有限风险，但当风险明确指向学生时会停手。她尊重莉迪亚的推理，可能成为师生二人的盟友，也可能因隐瞒资料造成信任裂痕。"
    mannerisms: "思考时把粉笔在指间转动；看见新文字会下意识屏住呼吸；承认错误前会先重新排列桌上的资料。"
    narration_notes: "她是导师与秘密保管者之间的灰色人物，不应写成觊觎力量的传统反派。"
    dialogue_examples:
      - "“翻译不是把一个词换成另一个词，而是弄清写下它的人希望世界服从什么。”"

  silas_reed:
    name: "塞拉斯·里德"
    role: charms_modernist
    public_profile: "魔咒学教授，教学严格，要求咒语、动作和意图都可被稳定重复；他对炫耀天赋毫无耐心，却愿意为一次微小进步反复示范。"
    motivation: "让学生掌握能够停止、纠正并安全传授的魔法，阻止未经约束的力量把施法者和周围人一起拖入事故。"
    voice: "句子短，评价具体，几乎不用夸张词；批评针对动作与选择而非天赋，偶尔流露极淡的冷幽默。"
    initial_relationship: "对海瑞要求格外严格，因为他认为海瑞并非缺乏魔力，而是在用某种错误方式抵抗魔杖；海瑞可能误以为这种关注只是针对和轻视。"
    secret: "他曾处理过一次成年巫师无杖施法失控造成的事故，因此比多数教授更早意识到海瑞的危险，也更坚持教会海瑞主动中止魔法；当海瑞愿意接受训练而非追求强度时才会说明往事。"
    pressure: "学校异常迫使他在保护海瑞隐私与向麦格完整报告风险之间选择，同时还要面对现代咒语可能无法阻止遗迹的事实。"
    behavior: "不会因强大效果而赞美失控施法；会把失败拆成可训练的步骤。在关键时刻，他能用现代魔法为远古力量设下边界。"
    mannerisms: "示范前总把袖口折到完全对称；思考时用魔杖轻点掌心；听见‘我控制不住’时会立即停止其他话题。"
    narration_notes: "里德代表现代魔法的价值而非守旧愚昧。他对海瑞的严格最终应成为海瑞学会克制的重要来源。"
    dialogue_examples:
      - "“力量不是成功。能够在正确的位置停下来，才是。”"

  aurora_sinistra:
    name: "奥罗拉·辛尼斯塔"
    role: astronomy_witness
    public_profile: "霍格沃茨天文学教授，习惯在夜间授课，以冷静精确的观测记录闻名；面对再离奇的现象，也先确认时间、方位与星位。"
    motivation: "记录并解释黑湖塔影与异常星象，避免未经验证的恐慌，同时确保学生不在危险天象下擅自行动。"
    voice: "安静、客观，常用观测问题代替直接判断；说出警告时没有渲染，却因此更令人重视。"
    initial_relationship: "只把海瑞视为一个不太擅长精密施法、但观察力尚可的三年级学生；当他的出现与塔影观测重复重合后才开始认真关注他。"
    secret: "她确认湖底古塔并非幻觉，而是只有在特定星辰排列下与现实重叠；下一次完整排列将成为遗迹复校和继承仪式的时间窗口。她会在数据足够可靠时告知麦格与海瑞。"
    pressure: "完整排列正在临近，而校内有人担心公开天象规律会让学生主动寻找古塔。"
    behavior: "不参与无依据争论，只相信多次观测；一旦确认危险便会果断封锁天文塔或协助计算安全窗口。"
    mannerisms: "用指甲沿星图边缘校准羊皮纸；等待云层散开时一言不发；重要结论总会重复核算一次。"
    narration_notes: "她提供时间压力与客观证据，但不掌握血脉和誓言的完整答案。"
    dialogue_examples:
      - "“影子没有移动。移动的是它与我们这个世界重合的部分。”"

  owen_mercer:
    name: "欧文·默瑟"
    role: gryffindor_rival
    public_profile: "格兰芬多三年级学生，决斗俱乐部成员，说话直率、行动比判断更快；他公开怀疑海瑞用某种禁术掩饰正常施法的失败。"
    motivation: "证明荣誉应来自公开、公平的能力，而不是无人能够检查的秘密力量；真正遇到危险时也想保护同学。"
    voice: "直接、响亮，习惯把怀疑当面说出；承认错误时不擅长修饰。"
    initial_relationship: "把海瑞视为可能作弊的古怪对手，对他的秘密保持警惕，但尚未形成真正敌意。"
    pressure: "越多人因异常崇拜或畏惧海瑞，他越想逼海瑞公开证明自己，可能因此把秘密暴露给不该知道的人。"
    behavior: "容易挑衅和误判，却不会在危急时抛下任何学生；若海瑞冒险救过他，他会笨拙但坚定地改变态度。"
    mannerisms: "争论时把袖子往上卷；尴尬时盯着别处道歉。"
    narration_notes: "他是可转化的竞争者，不是校园恶霸。"
    dialogue_examples:
      - "“我不怕你厉害，温斯顿。我只讨厌没人肯告诉我你到底做了什么。”"

  beatrice_doyle:
    name: "比娅特丽斯·道尔"
    role: gryffindor_explorer
    public_profile: "格兰芬多三年级学生，喜欢挑战校规和寻找传闻中的秘道；她声称自己亲眼见过一段在午夜后才出现的楼梯。"
    motivation: "亲自证明城堡异常真实存在，并参与一次足以被多年后讲述的冒险。"
    voice: "兴奋、爽快，常把危险说得像邀请；受挫时也很少抱怨。"
    initial_relationship: "觉得海瑞身边正在发生一件精彩的秘密，对他友好但缺乏边界感。"
    pressure: "她渴望参与调查，可能在不了解代价时把发现告诉更多学生。"
    behavior: "敢于尝试别人不敢走的路，也会在伙伴明确拒绝后不情愿地退开；学会责任后可成为可靠的行动盟友。"
    mannerisms: "发现新路线时会用粉笔画箭头；激动时压低声音却说得更快。"
    narration_notes: "她负责扩展校园探索感，不应比核心三人更早破解主谜团。"
    dialogue_examples:
      - "“我不是说我们应该下去。我只是说，既然楼梯已经出现，不下去实在很没礼貌。”"

  lucian_vane:
    name: "卢西安·韦恩"
    role: slytherin_temptation
    public_profile: "斯莱特林三年级学生，熟悉古老家族的纹章和传承故事，态度从容，总能在别人尴尬时表现得格外礼貌。"
    motivation: "接近并理解海瑞的远古力量，证明被现代魔法界压制的血脉传统仍有价值，也为自己争取接触遗迹的机会。"
    voice: "礼貌、含蓄，习惯把诱导包装成替人着想的建议；很少直接否认自己的野心。"
    initial_relationship: "认为海瑞拥有力量却因羞耻而浪费它，对海瑞既有欣赏也有利用意图。"
    secret: "他的家族记录保存着一幅孤身继承者壁画的拓片，却把画中缺失的亲友解释为统治者摆脱软弱的证明；只有在交易、信任或压力下才会展示。"
    pressure: "家族期待他带回应许失落地位的发现，他也害怕自己最终只是站在真正继承者身边的旁观者。"
    behavior: "向海瑞提供真实但经过选择的信息，鼓励他把支配理解为责任；遭到拒绝后会转向更隐蔽的说服，而不是立刻成为公开敌人。"
    mannerisms: "谈判时慢慢整理袖扣；真正动摇时会省略惯常的敬语。"
    narration_notes: "卢西安是选择二的思想诱惑者，不是简单邪恶的斯莱特林。他必须提出具有吸引力的真实观点。"
    dialogue_examples:
      - "“他们教你为自己的力量道歉，然后把这种道歉称作克制。你从没想过这对谁最有利吗？”"

  talia_croft:
    name: "塔莉娅·克罗夫特"
    role: slytherin_broker
    public_profile: "斯莱特林三年级学生，冷静务实，对古董、契约和信息交换很有兴趣；她很少免费提出问题，也从不免费给出答案。"
    motivation: "在不让自己成为任何阵营牺牲品的前提下，从遗迹事件中获得可靠知识与未来筹码。"
    voice: "克制、清楚，喜欢先约定交换条件；讽刺时仍保持礼貌。"
    initial_relationship: "不信任海瑞的隐瞒，却认为与他合作比向教授告发更有价值。"
    secret: "她家收藏的一块残片刻有与无题古书相同的誓言边框，她知道残片来源记录被人为删除；在得到等价信息或海瑞救过她后愿意交出。"
    pressure: "卢西安希望她选边支持血脉复兴，而她察觉那条路最终也可能抹除不重要的人。"
    behavior: "严格遵守自己明确答应的交易；若发现规则本身不公平，会寻找可以同时保全利益和人的漏洞。"
    mannerisms: "谈条件时把物品放在两人正中；不安时反复确认口袋里的清单。"
    narration_notes: "她提供残片和契约思维，不应沦为只会勒索的刻板角色。"
    dialogue_examples:
      - "“秘密当然有价格。问题是，你愿意付出的究竟是自己的东西，还是别人的？”"

  nell_whitby:
    name: "内尔·惠特比"
    role: hufflepuff_observer
    public_profile: "赫奇帕奇三年级学生，待人温和，擅长记住同学的习惯、座位和微小情绪；她最先注意到古代壁画中的空白不像自然留白。"
    motivation: "帮助身边的人不被忽视或落下，并弄清学校里越来越多令人说不出的缺失感从何而来。"
    voice: "温和、不抢话，常以具体观察代替判断；坚持意见时比外表显得固执。"
    initial_relationship: "对海瑞没有偏见，偶尔在他魔咒失败后自然地帮忙收拾，没有把这种帮助当作施舍。"
    pressure: "她能察觉记录、座位和画面存在不自然空位，却无法记起任何真正被抹除的人，因此开始怀疑自己的记忆。"
    behavior: "先照顾受影响的人，再追查原因；不会强迫别人倾诉，但会默默记住前后矛盾。"
    mannerisms: "听人说话时把手交叠在桌面；发现矛盾会在纸角画一个小圆圈。"
    narration_notes: "她只能发现‘缺口’，不能突破终局规则记住已被现实抹除的人。"
    dialogue_examples:
      - "“我不知道这里少了谁。我只知道，这幅画留出的距离不像是给空气的。”"

  rowan_pike:
    name: "罗文·派克"
    role: hufflepuff_lake_contact
    public_profile: "赫奇帕奇三年级学生，保护神奇动物课表现突出，经常在黑湖边记录水生生物活动，对湖中居民的警告比对学生传闻更认真。"
    motivation: "保护黑湖生物免受苏醒遗迹影响，并让巫师认真对待那些无法用人类语言完整表达的警告。"
    voice: "平实、耐心，谈到动物行为时非常具体；对夸大或打断观察的人会显得意外强硬。"
    initial_relationship: "与海瑞只是认识的同级生，知道他安静、不爱惹事，因此愿意先听他的解释。"
    secret: "湖中生物最近开始避开一片本来安全的深水，并反复传递‘塔在寻找名字’的含混警告；当海瑞证明塔影存在时，罗文才会分享完整记录。"
    pressure: "异常正在迫使湖中生物迁移，而教授们尚未确认是否应该封锁湖岸。"
    behavior: "不愿为冒险伤害生物，但能带主角团找到安全观察点；面对人类中心的计划会提出直接反对。"
    mannerisms: "说话时会确认湖面动静；随身携带防水笔记；焦虑时捏紧装饲料的小布袋。"
    narration_notes: "他连接黑湖线索与非人类视角，不负责解释远古誓言。"
    dialogue_examples:
      - "“它们不是在怕那座塔。它们怕的是，塔开始知道该怎么称呼它们了。”"


# ---------------------------------------------------------------------
# 七、场景
# ---------------------------------------------------------------------

scenes:

  ravenclaw_tower:
    name: "拉文克劳塔楼"
    purpose: "承载主角团的校园日常、秘密交谈、关系冲突与短暂安全感，让玩家理解什么值得在终局中保护。"
    goal: "在远离教授和其他学院视线的地方整理线索、修复信任，并决定哪些秘密可以交给朋友共同承担。"
    entry_text: |
      青铜鹰形门环守在入口，门后是拉文克劳圆形的公共休息室。高大的拱窗俯瞰群山与黑湖，
      壁炉、软椅和几张常年堆着书本与论文的学习桌沿弧形石墙分布。这里是海瑞最熟悉，
      也最少需要担心一根失败魔杖引来嘲笑的地方。
    exits:
      - to: main_castle
        label: "穿过鹰形门环，前往主楼与活动楼梯"
    available_objects:
      environment:
        bronze_eagle_knocker: "会以谜语决定是否开门的青铜鹰形门环"
        common_room_hearth: "燃着蓝白火焰的公共休息室壁炉"
        trio_study_table: "海瑞、莉迪亚和托比常用的临窗学习桌"
        arched_windows: "能够俯瞰黑湖与群山的高大拱窗"

  academic_wing:
    name: "学术侧楼"
    purpose: "集中承载古代如尼文课、魔咒训练与禁书研究，使现代魔法和远古魔法在同一空间形成直接对照。"
    goal: "从课程、书籍和教授的反应中调查海瑞的魔法异常，同时避免让秘密过早落入整个学校的视线。"
    entry_text: |
      高窄窗户沿石砌回廊排列，古代如尼文教室、魔咒练习室与图书馆的厚重木门分布在不同方向。
      粉笔灰、旧羊皮纸和清洁魔法留下的淡淡气味混在空气里。这里收藏着霍格沃茨认可的知识，
      也保留着许多尚未得到统一解释的材料。
    exits:
      - to: main_castle
        label: "沿教学回廊返回主楼"
    available_objects:
      environment:
        undated_runestone: "威克利夫教授课堂上展示的无名古代石板"
        restricted_section_gate: "通往禁书区的铁栅门与借阅登记台"
        charms_practice_desks: "刻着大量失败咒语痕迹的魔咒练习桌"
        old_rune_rubbings: "装在长玻璃柜中的古代符文拓片"

  main_castle:
    name: "主楼与活动楼梯"
    purpose: "作为霍格沃茨的公共交通与社会中心，承载画像异常、学生传闻、校方压力和遗迹对现代城堡的空间覆盖。"
    goal: "观察城堡结构与画像的异常，在公共视线和教授监管下寻找能够验证的线索。"
    entry_text: |
      活动楼梯在挑高空间里连接着不同楼层，画像长廊、学院沙漏和通往门厅的石阶分布其间。
      厚重石墙会把经过这里的脚步与谈话叠成层层回音，底层墙面则保留着数道年代难辨的建筑接缝。
    exits:
      - to: ravenclaw_tower
        label: "登上高塔，返回拉文克劳公共休息室"
      - to: academic_wing
        label: "前往教室与图书馆所在的学术侧楼"
      - to: astronomy_tower
        label: "沿旋梯前往天文塔"
      - to: black_lake_grounds
        label: "穿过门厅，前往黑湖岸与船屋"
    available_objects:
      environment:
        moving_staircases: "会在楼层之间自行转向的活动楼梯"
        portrait_gallery: "挤满历代巫师画像的长廊"
        house_hourglasses: "记录四个学院分数的巨大宝石沙漏"
        foundation_seam: "底层石墙上一道无法插入刀尖的古老接缝"

  astronomy_tower:
    name: "天文塔"
    purpose: "提供星象证据、复校倒计时和远离人群的关系场景，让湖底古塔从传闻变成可重复观测的事实。"
    goal: "利用星图和湖面观测判断城堡异常是否与天象有关，并决定把哪些发现交给校方或同伴。"
    entry_text: |
      塔顶的环形观测台开着数个没有玻璃的高窗，黄铜望远镜安装在可以转向的底座上。
      星图桌、记录架和一口旧铜钟占据塔顶不同位置，从窄长观测口可以越过城堡屋顶望见黑湖。
    exits:
      - to: main_castle
        label: "沿旋梯返回主楼"
      - to: black_lake_grounds
        label: "下塔后沿城堡外墙走向黑湖"
    available_objects:
      environment:
        brass_telescopes: "经过精密校准的黄铜望远镜"
        observation_star_charts: "用于课堂记录与历年观测的成叠星图"
        lake_sightline: "能够完整俯瞰黑湖的狭长观测口"
        old_tower_bell: "只在重大天象课结束时敲响的旧铜钟"

  black_lake_grounds:
    name: "黑湖岸与船屋"
    purpose: "承载黑湖生物的警告、古塔重影和最终继承仪式；让学校边缘逐步成为远古学院与现实重合的中心。"
    goal: "调查湖水、岸边痕迹与生物行为，判断黑湖是否与城堡中的异常存在联系。"
    entry_text: |
      宽阔的湖面从城堡外的草坡下展开，旧船屋和风化石码头立在岸边。湖水在离岸不远处
      迅速转深，将更远处的水下景物遮在颜色近黑的水面下面。
    exits:
      - to: main_castle
        label: "沿草坡返回城堡主楼"
      - to: astronomy_tower
        label: "沿外墙小径登上天文塔"
    available_objects:
      environment:
        weathered_boathouse: "木门受潮、仍存放着旧船桨的船屋"
        black_lake_water: "离岸后迅速转深、难以看清水下景物的黑湖水面"
        old_stone_pier: "伸入湖中的风化石质码头"
        deep_water_line: "湖水由浅转深、颜色明显变暗的分界"


# ---------------------------------------------------------------------
# 八、关键物品与物理初值
# ---------------------------------------------------------------------

items:
  oath_border_fragment:
    name: "誓言边框残片"
    description: "塔莉娅家族收藏的一块古老壁画残片，边缘刻着与无题古书相同的誓言纹路，并保留了被删除人物的一小部分轮廓。"
    portable: true
    consumable: false
    visible_when_carried: false

  founders_seal:
    name: "四巨头封印徽记"
    description: "四位创始人共同封闭地下遗迹时留下的徽记，四种金属在中心熔为一体；它既能关闭继承通路，也可能成为改写誓言的媒介。"
    portable: true
    consumable: false
    visible_when_carried: false

initial_state:
  positions:
    player: academic_wing
    lydia_hart: academic_wing
    toby_beckett: academic_wing
    minerva_mcgonagall: main_castle
    helena_wycliffe: academic_wing
    silas_reed: main_castle
    aurora_sinistra: astronomy_tower
    owen_mercer: main_castle
    beatrice_doyle: main_castle
    lucian_vane: main_castle
    talia_croft: main_castle
    nell_whitby: black_lake_grounds
    rowan_pike: black_lake_grounds
  item_locations:
