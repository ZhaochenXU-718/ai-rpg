      - module: toby_refuses_sacrifice
        status: resolved
      - module: wycliffe_proves_erasure
        status: resolved
      - module: reed_lesson_in_stopping
        status: resolved

  restoration_night:
    category: main
    title: "复校之夜"
    purpose: "以一个统一终局场景完成故事，让玩家在保留当下、接受绝对力量与满足条件后出现的共同誓言之间明确选择。"
    hook: "星象完成重合，湖底古塔覆盖现代霍格沃茨。遗迹要求海瑞以真名完成继承，四巨头封印则在他手中开始崩裂。"
    trigger: |
      四位创始人的最后记录已经揭示，玩家理解基础选择的真实代价，星象进入完整重合，
      且海瑞主动来到黑湖古塔面对仪式时出现。不得仅因达到最早回合就强行触发终局。
    involves:
      - player
      - lydia_hart
      - toby_beckett
      - black_lake_grounds
      - founders_seal
    escalation: |
      始终明确呈现两个基础选择：
      一、使用封印关闭遗迹，永久放弃大部分远古力量；
      二、接受继承，以自己最重要的人被现实抹除为代价获得绝对力量。

      只有 prepare_shared_oath 已 resolved，且当前记忆仍证明莉迪亚与托比自愿参与时，
      才允许他们提出第三个隐藏选择：三人共同重写誓言。不得因作者知道隐藏真相就提前展示。
    resolution: |
      必须根据玩家明确作出的选择完成且只完成一个结局：

      选择一：海瑞以四巨头封印关闭遗迹，永久放弃大部分远古力量；现代霍格沃茨和所有同伴
      得以保留，真相是否公开由玩家决定。

      选择二：遗迹根据此前实际关系选中海瑞最重要的挚友或爱人，将其从现实、记录及所有人的
      记忆中彻底抹除，只有海瑞记得。海瑞获得完整传承，古代壁画中出现孤身的他。牺牲对象
      不得因莉迪亚是潜在恋爱对象而固定选择她；若托比或其他人实际与海瑞关系最深，应忠实反映。

      隐藏选择：海瑞放弃成为唯一继承者，莉迪亚与托比自愿成为共同守誓者。三人分别承担知识、
      记忆与力量的一部分，任何一人都不能独自命令遗迹；海瑞永久失去独占完整远古力量的资格，
      三人终身能够感到遗迹再次苏醒的召唤。
    fallback: "若玩家拒绝立即选择，仪式维持在崩溃边缘，让同伴表达立场并再次确认代价；旁白不得替玩家选择，也不得用倒计时直接判定某个结局。"
    repeatable: false
    min_turn: 16
    priority: high
    tags: [finale, choice, sacrifice, hidden_path]
    requires:
      - module: founders_last_record
        status: resolved
