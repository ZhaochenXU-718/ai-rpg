id: rooftop_supper
title: "晚风中的一桌饭"
version: 0.1.0
schema_version: 2
language: zh-CN
genre: urban_slice_of_life
target_duration_minutes: 15-25

design_goal: |
  验证同一套通用引擎能否承载没有反派、没有暴力、没有重大秘密的都市日常故事。
  核心体验不是破解谜题，而是在有限的晚饭窗口里留意他人的处境、提供恰当帮助，
  并把一次偶然的邀约变成一张不勉强任何人的邻里饭桌。

premise: |
  周五傍晚，你刚回到梧桐里九号楼。陈阿姨拎着一篮刚做好的饭菜站在一楼门厅：
  原本要回家吃饭的女儿临时加班，她一个人吃不完，又不愿让饭菜在冰箱里放坏。
  天台的晚风正好，楼里的邻居却各有各的忙碌。再过一会儿，送餐晚高峰开始、
  洗衣店打烊，云层里的阵雨也会落下来。你可以帮她支起一张小桌，
  也可以问问附近的人，今晚是否愿意暂时放下手里的事，一起吃顿便饭。

player_role:
  id: player
  name: "九号楼住户"
  public_identity: "住进梧桐里半年、和大家混了个脸熟的普通上班族"
  private_goal: "在晚饭窗口结束前，帮陈阿姨把多做的饭菜妥善摆上桌；是否邀请邻居，由你决定"
  constraints:
    - "不能强迫任何人参加饭局，也不能替别人承诺时间。"
    - "不能凭空获得物品、金钱、交通工具或专业能力。"
    - "可以交谈、帮忙、观察、借用物品和改变计划，但要尊重营业与工作秩序。"

style_bible:
  tone: "轻松、克制、温暖，保留成年人的疲惫和分寸感"
  camera: "多写城市傍晚的具体触感：空调外机、饭菜热气、洗衣机转动、塑料门帘和天台晚风"
  dialogue: "人物说话简短自然，不用金句，不把普通善意写成命运转折"
  avoid:
    - "不要制造反派、阴谋、危险事故或夸张的情感创伤。"
    - "不要把拒绝邀请写成冷漠；每个人都可以有自己的安排。"
    - "不要让一次帮忙立刻换来不合常理的亲密或感激。"
    - "不要把邻里关系写成说教式的社区宣传。"

global_rules:
  time:
    description: >
      每次确认执行行动通常消耗 1 点 time_left。它代表饭菜保温、店铺营业和邻居空闲
      共同构成的晚饭窗口；报价、查看帮助和放弃不消耗。归零时，大家会按原计划散去。
    evening_window_closes_when_time_left_lte: 0
  fairness:
    - "复杂行动先报价，再执行。"
    - "善意不是万能钥匙；帮助必须与对方眼下的需要有关。"
    - "玩家没有邀请到所有人也不算失败，一张安静的小桌同样是完整选择。"
    - "失败要回到日常尺度：饭菜被各自打包带走，而不是发生灾难。"
  boundaries:
    - "故事发生在梧桐里九号楼及相连的临街小店。"
    - "阵雨将近，但不会发展成危险天气。"
    - "罗叔必须照看便利店，不能上天台参加饭局。"
    - "阿禾只有在送餐晚高峰开始前才可能短暂坐下。"

world_board:
  nodes:
    building_lobby: { name: "九号楼门厅", kind: common_area }
    convenience_store: { name: "梧桐便利店", kind: shop }
    laundromat: { name: "转角洗衣店", kind: shop }
    rooftop: { name: "九号楼天台", kind: common_area }
  edges:
    - { from: building_lobby, to: convenience_store, bidirectional: true }
    - { from: building_lobby, to: laundromat, bidirectional: true }
    - { from: building_lobby, to: rooftop, bidirectional: true }
    - { from: convenience_store, to: laundromat, bidirectional: true }
    - { from: convenience_store, to: rooftop, bidirectional: true }
    - { from: laundromat, to: rooftop, bidirectional: true }

world_rules:
  - id: aunt_comes_upstairs
    actor: aunt_chen
    priority: 30
    when:
      scene: rooftop
      positions:
        aunt_chen: building_lobby
      world_state:
        dinner_status: ready
    move:
      to: rooftop
    narrative_hint: "陈阿姨看见桌面已经铺好，提着保温壶从门厅上了天台。"

  - id: xiaoyu_comes_upstairs
    actor: xiaoyu
    priority: 20
    when:
      scene: rooftop
      positions:
        xiaoyu: laundromat
      world_state:
        dinner_status: ready
      flags:
        xiaoyu_invited: true
    move:
      to: rooftop
    narrative_hint: "小雨等洗衣机停稳，抱着自己的帆布包从后楼梯上来。"

  - id: ahe_comes_upstairs
    actor: ahe
    priority: 20
    when:
      scene: rooftop
      positions:
        ahe: convenience_store
      world_state:
        dinner_status: ready
      flags:
        ahe_invited: true
    move:
      to: rooftop
    narrative_hint: "阿禾把电动车停进雨棚，确认暂时没有新订单，快步上了天台。"

items:
  food_basket:
    name: "保温饭篮"
    description: "陈阿姨多做的三菜一汤，饭盒外还带着热气。"
    portable: true
    consumable: false
  picnic_mat:
    name: "折叠野餐垫"
    description: "罗叔借出的旧野餐垫，洗得很干净，正好能铺在天台折叠桌上。"
    portable: true
    consumable: false
  checked_cloth:
    name: "蓝白格布"
    description: "小雨刚洗好的市集桌布，她愿意先借来铺晚饭，吃完再收走。"
    portable: true
    consumable: false

initial_state:
  world:
    chapter: 1
    step: 0
    # 完整邻里路线 8 回合，另留 2 回合观察或改变主意。
    time_left: 10
    current_goal: "在晚饭窗口结束前，把陈阿姨多做的饭菜妥善摆上桌"
    dinner_status: waiting
    guest_count: 0
    weather: humid
  positions:
    player: building_lobby
    aunt_chen: building_lobby
    clerk_luo: convenience_store
    xiaoyu: laundromat
    ahe: convenience_store
  item_locations:
    food_basket: { type: carried_by, id: aunt_chen }
    picnic_mat: { type: carried_by, id: clerk_luo }
    checked_cloth: { type: carried_by, id: xiaoyu }
  player:
    energy: 3
    soaked: false
  scene:
    ambient_noise: 2
    wind_level: 1
    social_pressure: low
  flags:
    opening_delivered: false
    dinner_agreed: false
    rooftop_noticed: false
    xiaoyu_invited: false
    ahe_invited: false
    aunt_arrived: false
    xiaoyu_arrived: false
    ahe_arrived: false
    table_set: false

characters:
  player:
    name: "九号楼住户"
    role: player
    public_profile: "刚下班，衬衫后背还有一点通勤留下的潮气。"
  aunt_chen:
    name: "陈阿姨"
    role: accidental_host
    public_profile: |
      住在三楼的退休会计，做事利落，习惯把保鲜盒擦得没有一滴水。
      她不喜欢浪费，也不愿把自己的失落说成需要别人照顾。
    secret: "女儿临时加班让她有些失落，但她更在意饭菜有没有被认真吃掉。"
    motivation: "找个不麻烦人的办法处理多做的晚饭。"
    initial_state:
      rapport: 2
      fatigue: 1
  clerk_luo:
    name: "罗叔"
    role: practical_helper
    public_profile: |
      楼下便利店的晚班店主，记得熟客常买什么，却很少离开收银台。
      门口的纸箱总比他能拆完的速度多一摞。
    secret: "储物间里有一张很久没用的野餐垫。"
    motivation: "守好晚班生意，也愿意在不耽误营业的范围内搭把手。"
    initial_state:
      rapport: 1
      fatigue: 2
  xiaoyu:
    name: "小雨"
    role: reserved_neighbor
    public_profile: |
      住在五楼的插画师，常在洗衣店等大件布料烘干。
      她不是不想和人说话，只是习惯先确认一场社交会不会占满整个晚上。
    secret: "她今晚的稿子已经交完，真正担心的是答应吃饭后不好意思提前离开。"
    motivation: "把市集桌布洗好，回家安静休息；如果邀请足够轻松，她也愿意坐一会儿。"
    initial_state:
      rapport: 1
      fatigue: 2
  ahe:
    name: "阿禾"
    role: passing_neighbor
    public_profile: |
      经常在这一带送餐的骑手，给九号楼住户送过很多次外卖。
      他正靠在便利店门边调整松动的手机支架，晚高峰很快就要开始。
    secret: "他今天只吃过一个饭团，但不愿因为吃饭耽误别人的订单。"
    motivation: "在晚高峰前修好手机支架；如果时间明确，他愿意吃几口热饭再走。"
    initial_state:
      rapport: 0
      fatigue: 3

perception:
  facts_label: "留意到"
  world_state:
    time_left: "晚饭窗口"
  scene_state:
    ambient_noise: "周围动静"
    wind_level: "风"
    social_pressure: "拘谨"
  character_state:
    rapport: "熟络"
    fatigue: "疲惫"

quote_warnings:
  - when:
      state_lte: { world.time_left: 3 }
    text: "饭菜已经不如刚才热，附近的人也快要回到各自的安排里。"
  - when:
      state_gte: { xiaoyu.fatigue: 3 }
      same_location: [player, xiaoyu]
    text: "小雨明显很累，过分热情的邀请可能会变成负担。"
  - when:
      state_gte: { ahe.fatigue: 4 }
      same_location: [player, ahe]
    text: "阿禾一边看订单提示，一边活动发酸的肩膀。"

intents:
  observe:
    label: "留意"
    description: "观察人物、物品、环境或眼下的日常细节。"
    base_risk: low
    quote_required: false
    fallback_narrative: "你停下来多看了一会儿，眼下没有新的事情需要插手。"
    typical_cost:
      time_left: -1
  talk:
    label: "聊聊"
    description: "与人交谈、询问、邀请、说明计划、听对方顾虑或礼貌地说服。"
    base_risk: medium
    quote_required: true
    fallback_proposal:
      npc_state: { key: rapport, step: 1 }
    fallback_narrative: "你们聊了几句。对方没有立刻改变安排，但谈话比刚才自然了一点。"
    typical_cost:
      time_left: -1
  help:
    label: "搭把手"
    description: "处理对方眼下明确的小麻烦，例如整理纸箱、固定支架或收好布料。"
    base_risk: low
    quote_required: false
    requires_storylet_match: true
    typical_cost:
      time_left: -1
  prepare:
    label: "布置"
    description: "使用手边物品铺桌、摆饭或完成天台晚饭的准备。"
    base_risk: low
    quote_required: false
    requires_storylet_match: true
    min_objects: 3
    typical_cost:
      time_left: -1
  custom:
    label: "自定义做法"
    description: "提出不在预设动作里的日常做法，由系统映射为最接近的结构化行动。"
    base_risk: variable
    quote_required: true
    fallback_narrative: "你的做法带来了一点变化，但还没有让晚饭计划真正往前走。"
    typical_cost:
      time_left: -1
  move:
    label: "走过去"
    description: "沿当前出口前往门厅、临街小店或天台。"
    base_risk: low
    quote_required: false
    engine_action: move
    typical_cost:
      time_left: -1

resolution_limits:
  max_paths_per_action: 3
  patchable:
    aunt_chen.rapport: { min: 0, max: 5, max_step: 1 }
    aunt_chen.fatigue: { min: 0, max: 5, max_step: 1 }
    clerk_luo.rapport: { min: 0, max: 5, max_step: 1 }
    clerk_luo.fatigue: { min: 0, max: 5, max_step: 1 }
    xiaoyu.rapport: { min: 0, max: 5, max_step: 1 }
    xiaoyu.fatigue: { min: 0, max: 5, max_step: 1 }
    ahe.rapport: { min: 0, max: 5, max_step: 1 }
    ahe.fatigue: { min: 0, max: 5, max_step: 1 }
    scene.ambient_noise: { min: 0, max: 5, max_step: 1 }
    scene.wind_level: { min: 0, max: 4, max_step: 1 }
    scene.social_pressure: { values: [low, medium, high] }
    player.energy: { min: 0, max: 5, max_step: 1 }
  protected:
    - positions.*
    - item_locations.*
    - world.time_left
    - world.dinner_status
    - world.guest_count
    - flags.*

scenes:
  building_lobby:
    name: "九号楼门厅"
    purpose: "交代偶然邀约，让玩家决定是否接下这件小事。"
    goal: "和陈阿姨谈谈，确定一顿不浪费也不勉强人的晚饭计划。"
    entry_text: |
      九号楼的玻璃门被晚霞照成淡橙色。电梯检修牌靠在墙边，空调外机的热风
      一阵阵卷进门厅。陈阿姨站在长椅旁，脚边是一只冒着热气的保温饭篮。
      她看了一眼手机上女儿发来的加班消息，又把屏幕按灭了。
    exits:
      - to: convenience_store
        label: "去隔壁梧桐便利店"
        narrative_hint: "你穿过塑料门帘，走进隔壁亮着白灯的便利店。"
      - to: laundromat
        label: "去转角洗衣店"
        narrative_hint: "你沿着临街骑楼走到洗衣店，滚筒转动声从门内传出来。"
      - to: rooftop
        label: "走楼梯上天台"
        narrative_hint: "你沿着刚拖过的楼梯往上，推开通向天台的铁门。"
    available_objects:
      environment:
        notice_board: "贴满旧通知的公告栏"
        roof_access: "通往天台的楼梯"
        elevator_notice: "电梯检修牌"
        takeout_bench: "门边长椅"
      states:
        warm_food: "饭菜还热"
        humid_evening: "闷热的傍晚"
    suggested_intents:
      - observe
      - talk
      - move
      - custom
    exit_conditions:
      any:
        - flags:
            dinner_agreed: true

  convenience_store:
    name: "梧桐便利店"
    purpose: "提供务实的铺桌物资，以及一位时间有限的潜在饭友。"
    goal: "在不耽误营业和送餐的前提下，借到铺桌物品或邀请阿禾。"
    entry_text: |
      便利店门口的塑料帘被空调吹得轻轻拍响。罗叔在收银台后核对进货单，
      一摞还没拆平的纸箱堵住了储物间门。阿禾靠在冰柜旁，反复拧紧手机支架，
      屏幕上的订单地图已经开始变红。
    exits:
      - to: building_lobby
        label: "回九号楼门厅"
        narrative_hint: "你掀开门帘，几步回到九号楼门厅。"
      - to: laundromat
        label: "沿骑楼去洗衣店"
        narrative_hint: "你沿着骑楼走到转角，洗衣店的暖风扑到人行道上。"
      - to: rooftop
        label: "从便利店后侧楼梯上天台"
        narrative_hint: "你从便利店旁的后楼梯上楼，天台铁门在风里轻响。"
    available_objects:
      environment:
        carton_stack: "挡住储物间的纸箱"
        phone_mount: "松动的手机支架"
        charging_socket: "收银台边的充电插座"
        cold_drinks: "冰柜里的冷饮"
        order_map: "渐渐变红的订单地图"
      states:
        store_open: "便利店正在营业"
        delivery_rush_soon: "送餐晚高峰将近"
    suggested_intents:
      - observe
      - talk
      - help
      - move
      - custom
    exit_conditions:
      any:
        - inventory_all:
            - picnic_mat
        - flags:
            ahe_invited: true

  laundromat:
    name: "转角洗衣店"
    purpose: "提供另一条铺桌路线，并呈现对社交邀请有合理顾虑的人。"
    goal: "听懂小雨的顾虑，或帮她处理缠在一起的大件布料。"
    entry_text: |
      四台滚筒洗衣机把同一种低响错开成不同节拍。小雨坐在折叠凳上改最后一处色稿，
      旁边的烘干机里，一块蓝白格布和床单缠成一团。墙上的时钟已经走近打烊刻度，
      但这里没有人显得特别着急。
    exits:
      - to: building_lobby
        label: "回九号楼门厅"
        narrative_hint: "你沿骑楼回到九号楼，门厅里还留着饭菜的香味。"
      - to: convenience_store
        label: "沿骑楼去便利店"
        narrative_hint: "你离开滚筒的低响，走进便利店明亮的白灯里。"
      - to: rooftop
        label: "从洗衣店后侧楼梯上天台"
        narrative_hint: "你从洗衣店后门绕上楼梯，推开被晚风顶住的天台门。"
    available_objects:
      environment:
        tangled_sheet: "缠在一起的大件布料"
        dryer_timer: "烘干机倒计时"
        folding_counter: "叠衣台"
        back_stairs: "通往天台的后楼梯"
        finished_artwork: "小雨刚交完的色稿"
      states:
        closing_time_near: "打烊时间将近"
        quiet_company: "各忙各的安静"
    suggested_intents:
      - observe
      - talk
      - help
      - move
      - custom
    exit_conditions:
      any:
        - inventory_all:
            - checked_cloth
        - flags:
            xiaoyu_invited: true

  rooftop:
    name: "九号楼天台"
    purpose: "把玩家前面的选择收束为一张具体的饭桌。"
    goal: "用饭篮和借来的铺桌物品，把晚饭真正摆好。"
    entry_text: |
      天台上晾衣绳已经收空，水箱边摆着一张折叠桌。楼群之间的夕阳只剩窄窄一条，
      空调外机和远处车流合成稳定的城市底噪。风比楼下凉一些，也带来了潮湿的雨味。
    exits:
      - to: building_lobby
        label: "下楼回门厅"
        narrative_hint: "你关好天台铁门，沿楼梯回到门厅。"
      - to: convenience_store
        label: "从后楼梯去便利店"
        narrative_hint: "你沿后楼梯下到街边便利店。"
      - to: laundromat
        label: "从后楼梯去洗衣店"
        narrative_hint: "你沿另一侧楼梯下到洗衣店后门。"
    available_objects:
      environment:
        folding_table: "水箱旁的折叠桌"
        string_lights: "没有插电的旧灯串"
        empty_clothesline: "收空的晾衣绳"
        water_tank: "温热的水箱外壳"
        city_sunset: "楼群间最后一线夕阳"
      states:
        rain_smell: "风里的雨味"
        table_space: "刚好够几个人的小桌"
    suggested_intents:
      - observe
      - talk
      - prepare
      - move
      - custom
    exit_conditions:
      any:
        - ending_reached: true

storylets:
  # 通用 move 已负责沿合法出口更新位置；这些到达卡只负责给都市故事的移动
  # 一个明确的行动回应和“成功”归因，不重复改写 positions。
  - id: arrive_building_lobby
    title: "回到九号楼门厅"
    type: progress
    once: false
    trigger:
      scene: building_lobby
      intent: move
    effect: {}
    narrative_hint: "门厅里的热风和饭菜香重新靠近，楼梯、街边小店都在几步之外。"

  - id: arrive_convenience_store
    title: "走进梧桐便利店"
    type: progress
    once: false
    trigger:
      scene: convenience_store
      intent: move
    effect: {}
    narrative_hint: "便利店的冷气迎面压住暑气，收银台、纸箱和等订单的人都在眼前。"

  - id: arrive_laundromat
    title: "走进转角洗衣店"
    type: progress
    once: false
    trigger:
      scene: laundromat
      intent: move
    effect: {}
    narrative_hint: "滚筒的低响包住街边车声，烘干机的暖风从门缝里散出来。"

  - id: arrive_rooftop
    title: "推开天台铁门"
    type: progress
    once: false
    trigger:
      scene: rooftop
      intent: move
    effect: {}
    narrative_hint: "天台铁门在身后合上，晚风、折叠桌和楼群间的夕阳一起展开。"

  - id: opening_offer
    title: "多出来的一篮饭"
    type: opportunity
    attribution: world_beat
    once: true
    trigger:
      scene: building_lobby
      flags:
        opening_delivered: false
    effect:
      set_flags:
        opening_delivered: true
    narrative_hint: "陈阿姨收到女儿加班的消息，一篮刚做好的饭菜临时没了去处。"

  - id: accept_supper_plan
    title: "先把饭摆起来"
    type: progress
    once: true
    trigger:
      scene: building_lobby
      intent_any:
        - talk
        - custom
      object_any:
        - aunt_chen
        - food_basket
      flags:
        dinner_agreed: false
    effect:
      set_flags:
        dinner_agreed: true
      set_world:
        dinner_status: planning
      move_items:
        food_basket: { type: carried_by, id: player }
      add_facts:
        - "陈阿姨只希望饭菜被好好吃掉；人多人少都可以，不必为了热闹勉强谁。"
        - "天台有一张折叠桌，但需要找块干净的东西铺桌。"
    narrative_hint: "陈阿姨把饭篮交给你，约好等桌面铺好再上楼；她特意说，人少也没关系。"

  - id: notice_rooftop_table
    title: "公告栏上的天台照片"
    type: reveal
    once: true
    trigger:
      scene: building_lobby
      intent: observe
      object_any:
        - notice_board
        - roof_access
    effect:
      set_flags:
        rooftop_noticed: true
      add_facts:
        - "天台水箱旁有一张公共折叠桌，铺块干净的布就能用。"
    narrative_hint: "一张褪色的旧活动照片提醒你，天台水箱旁一直收着一张折叠桌。"

  - id: clerk_lends_picnic_mat
    title: "储物间里的野餐垫"
    type: reward
    once: true
    trigger:
      scene: convenience_store
      intent: help
      object_all:
        - clerk_luo
        - carton_stack
      flags:
        dinner_agreed: true
    effect:
      state_patch:
        clerk_luo.rapport: +1
        clerk_luo.fatigue: -1
      move_items:
        picnic_mat: { type: carried_by, id: player }
      add_facts:
        - "罗叔不能离开收银台，但愿意把储物间里的折叠野餐垫借给你。"
    narrative_hint: "你把纸箱拆平码好后，罗叔从腾出的储物间里翻出一张洗净的旧野餐垫。"

  - id: help_rider_before_rush
    title: "拧紧手机支架"
    type: reward
    once: true
    trigger:
      scene: convenience_store
      intent: help
      object_all:
        - ahe
        - phone_mount
      flags:
        dinner_agreed: true
    effect:
      set_flags:
        ahe_invited: true
      state_patch:
        ahe.rapport: +2
        ahe.fatigue: -1
      add_facts:
        - "阿禾答应在晚高峰前上天台吃几口；如果新订单来了，他会随时离开。"
    narrative_hint: "支架终于不再往下坠。你把饭局说得很随意，阿禾看了眼订单地图，答应空档时上来吃几口。"

  - id: invite_rider_with_clear_timing
    title: "只坐到订单来"
    type: opportunity
    once: true
    trigger:
      scene: convenience_store
      intent: talk
      object_any:
        - ahe
      flags:
        dinner_agreed: true
        ahe_invited: false
      npc_state:
        ahe.rapport_gte: 1
    effect:
      set_flags:
        ahe_invited: true
      add_facts:
        - "阿禾愿意在新订单到来前上楼坐一会儿；这不是必须吃完整顿饭的邀请。"
    narrative_hint: "听见你说随时可以走，阿禾才点头：下一单来之前，他会上去扒几口热饭。"

  - id: help_xiaoyu_with_cloth
    title: "把大件布料理开"
    type: reward
    once: true
    trigger:
      scene: laundromat
      intent: help
      object_all:
        - xiaoyu
        - tangled_sheet
      flags:
        dinner_agreed: true
    effect:
      set_flags:
        xiaoyu_invited: true
      state_patch:
        xiaoyu.rapport: +1
        xiaoyu.fatigue: -1
      move_items:
        checked_cloth: { type: carried_by, id: player }
      add_facts:
        - "小雨愿意把洗净的蓝白格布借来铺桌，也会在烘干结束后上楼坐一会儿。"
    narrative_hint: "你们把缠住的床单和格布一层层理开。小雨把格布递给你，说吃完前叫她一声就好。"

  - id: invite_xiaoyu_without_pressure
    title: "不用待到散席"
    type: opportunity
    once: true
    trigger:
      scene: laundromat
      intent: talk
      object_any:
        - xiaoyu
      flags:
        dinner_agreed: true
        xiaoyu_invited: false
      npc_state:
        xiaoyu.rapport_gte: 2
    effect:
      set_flags:
        xiaoyu_invited: true
      add_facts:
        - "小雨在意的不是饭局本身，而是能否随时离开；说清楚之后，她愿意来坐一会儿。"
    narrative_hint: "你说明不用待到散席，小雨把电脑合上一半，答应等烘干机停下就上楼。"

  - id: set_table_with_picnic_mat
    title: "铺开野餐垫"
    type: progress
    once: true
    trigger:
      scene: rooftop
      intent: prepare
      object_all:
        - food_basket
        - picnic_mat
        - folding_table
      inventory_all:
        - food_basket
        - picnic_mat
      world_state:
        dinner_status: planning
    effect:
      set_flags:
        table_set: true
      set_world:
        dinner_status: ready
      move_items:
        food_basket: { type: board, id: rooftop }
        picnic_mat: { type: board, id: rooftop }
    narrative_hint: "你把野餐垫铺上折叠桌，饭盒一只只打开，家常菜的热气被晚风吹向水箱边。"

  - id: set_table_with_checked_cloth
    title: "铺开蓝白格布"
    type: progress
    once: true
    trigger:
      scene: rooftop
      intent: prepare
      object_all:
        - food_basket
        - checked_cloth
        - folding_table
      inventory_all:
        - food_basket
        - checked_cloth
      world_state:
        dinner_status: planning
    effect:
      set_flags:
        table_set: true
      set_world:
        dinner_status: ready
      move_items:
        food_basket: { type: board, id: rooftop }
        checked_cloth: { type: board, id: rooftop }
    narrative_hint: "蓝白格布压住折叠桌的旧划痕。你摆开饭盒，汤面还浮着一层很薄的热气。"

  - id: host_arrives
    title: "陈阿姨上楼"
    type: progress
    attribution: world_beat
    phase: after_world
    once: true
    trigger:
      scene: rooftop
      same_location:
        - player
        - aunt_chen
      world_state:
        dinner_status: ready
      flags:
        aunt_arrived: false
    effect:
      set_flags:
        aunt_arrived: true
    narrative_hint: "陈阿姨提着保温壶上来，看见桌面已经铺好，只问了一句碗筷够不够。"

  - id: xiaoyu_arrives
    title: "小雨带着空闲上楼"
    type: reward
    attribution: world_beat
    phase: after_world
    once: true
    trigger:
      scene: rooftop
      same_location:
        - player
        - xiaoyu
      world_state:
        dinner_status: ready
      flags:
        xiaoyu_invited: true
        xiaoyu_arrived: false
    effect:
      set_flags:
        xiaoyu_arrived: true
      state_patch:
        world.guest_count: +1
    narrative_hint: "小雨把手机调成静音，在桌边留了个方便起身的位置，然后坐下来。"

  - id: ahe_arrives
    title: "阿禾赶在订单前上楼"
    type: reward
    attribution: world_beat
    phase: after_world
    once: true
    trigger:
      scene: rooftop
      same_location:
        - player
        - ahe
      world_state:
        dinner_status: ready
      flags:
        ahe_invited: true
        ahe_arrived: false
    effect:
      set_flags:
        ahe_arrived: true
      state_patch:
        world.guest_count: +1
    narrative_hint: "阿禾把头盔放在脚边，手机屏幕朝上，只给自己盛了小半碗饭。"

  - id: shared_table_settles
    title: "各忙各的人成了一桌"
    type: ending_route
    attribution: world_beat
    phase: after_world
    once: true
    trigger:
      scene: rooftop
      world_state:
        dinner_status: ready
      state_gte:
        world.guest_count: 2
    effect:
      set_world:
        dinner_status: shared
      state_patch:
        scene.social_pressure: low
    narrative_hint: "没有人宣布饭局开始。有人递碗，有人挪凳子，原本各自赶时间的人就这样坐成了一桌。"

  - id: small_table_settles
    title: "小桌也正合适"
    type: ending_route
    attribution: world_beat
    phase: after_world
    once: true
    trigger:
      scene: rooftop
      world_state:
        dinner_status: ready
      state_lte:
        world.guest_count: 1
    effect:
      set_world:
        dinner_status: small
      state_patch:
        scene.social_pressure: low
    narrative_hint: "桌边没有坐满，但空位并不尴尬。陈阿姨把汤往你这边推了推，晚饭安静地开始了。"

  - id: evening_window_closes_waiting
    title: "大家回到各自的晚上"
    type: failure_pressure
    attribution: world_beat
    once: true
    trigger:
      state_lte:
        world.time_left: 0
      world_state:
        dinner_status: waiting
    effect:
      set_world:
        dinner_status: missed
      add_facts:
        - "陈阿姨把饭菜分装进保鲜盒；没有东西被浪费，只是今晚没能坐成一桌。"
    narrative_hint: "阵雨落下前，陈阿姨把饭菜重新分装。店铺继续营业，邻居各自回家，今晚没有人坐上天台。"

  - id: evening_window_closes_planning
    title: "没赶上的饭桌"
    type: failure_pressure
    attribution: world_beat
    once: true
    trigger:
      state_lte:
        world.time_left: 0
      world_state:
        dinner_status: planning
    effect:
      set_world:
        dinner_status: missed
      add_facts:
        - "晚饭窗口结束后，饭菜被大家各自带回家；计划没有完成，但也没有造成损失。"
    narrative_hint: "雨点敲上遮雨棚时，店铺要打烊、订单也多起来。还没摆开的饭菜最终被分成几份，各自带回家。"

endings:
  shared_evening:
    title: "晚风把人留成一桌"
    priority: 1
    conditions:
      positions.player: rooftop
      world.dinner_status: shared
      world.guest_count_gte: 2
    outcome: |
      天台上没有正式的座次，也没有谁负责活跃气氛。阿禾吃到一半接了新单，
      小雨在第一阵小雨落下前收起自己的格布。大家来得短，走得也自然。
      陈阿姨看着空下去的饭盒，只说下次少放一点盐。今晚并没有改变谁的生活，
      只是让几段原本互不相干的晚间安排，安稳地重叠了一会儿。

  small_supper:
    title: "小桌也很好"
    priority: 2
    conditions:
      positions.player: rooftop
      world.dinner_status: small
    outcome: |
      有人有别的安排，有人只来坐了一小会儿，桌边没有凑出想象中的热闹。
      陈阿姨并不介意。她把汤分进小碗，你们听着楼下电动车经过，慢慢把热饭吃完。
      一顿饭不需要很多人见证才算被认真对待；空着的凳子，也不等于谁辜负了邀请。

  plans_dispersed:
    title: "各自带回家的晚饭"
    priority: 3
    conditions:
      world.dinner_status: missed
    outcome: |
      等你们真正腾出手，阵雨、订单和打烊时间已经把这个傍晚切回各自的轨道。
      陈阿姨把饭菜分成几盒，罗叔留了一盒夜里热，小雨和阿禾也各自带走一点。
      天台的桌没有铺开，但饭菜没有被扔掉，也没有人因此责怪谁。
      城市里很多没完成的小计划，最后就是这样被妥善收好。

genre_system:
  social_gathering:
    host: aunt_chen
    gathering_place: rooftop
    invited_flags:
      - xiaoyu_invited
      - ahe_invited
    principle: "邀请是否成功取决于是否听懂对方的时间和边界，而不是把好感刷到满值。"
  everyday_stakes:
    success: "饭菜被摆上桌，人们可以自在地来去。"
    setback: "计划散掉，饭菜被分装带走，没有灾难性惩罚。"

authoring_notes:
  content_scope:
    scenes: 4
    characters: 5
    items: 3
    storylets: 21
    endings: 3
  route_notes:
    - "铺桌物有两条等价路线：帮罗叔整理纸箱借野餐垫，或帮小雨理开布料借格布。"
    - "小雨和阿禾都可通过理解顾虑来邀请；帮忙路线是更明确、更省回合的作者交互。"
    - "最佳结局要求两人都接受邀请；零到一位来客会进入同样完整的小桌结局。"
    - "时间耗尽只让计划散去，不制造受伤、冲突或道德惩罚。"
  production_log:
    created_at: "2026-07-13"
    source: "原创都市日常短篇；未使用既有影视、小说或游戏 IP。"
