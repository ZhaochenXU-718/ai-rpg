# 《午夜前的档案室》可解性回归用例。
# 每个结局至少一条路线；修改故事内容后必须重跑：
#   python3 tools/check_walkthroughs.py content/walkthroughs/midnight_archive.yaml
# generic_patch 表示该回合兜底判定授予的状态变化（如交涉成功 +1 信任），
# 必须落在 resolution_limits 白名单内。

story: midnight_archive

walkthroughs:
  - id: truth_exposed_fast
    title: "钥匙路线：徽章 + 侧门钥匙，无暴露"
    target_ending: truth_exposed
    steps:
      - note: "观察全家画像：开场压力、侍女便签、画像徽记同回合触发"
        intent: observe
        objects: [family_portrait]
        expect_storylets: [opening_pressure, observe_family_portrait, maid_warning]
      - note: "与薇拉交涉建立信任，拿到旧徽章"
        intent: negotiate
        objects: [heir]
        generic_patch: { heir.trust: 1 }
        expect_storylets: [heir_badge]
      - note: "借便签提示从侧梯溜进仆役走廊"
        intent: sneak
        objects: [side_stair]
        expect_storylets: [slip_into_corridor]
        expect_world_rules: [maid_uses_service_route]
      - note: "与艾拉交涉，换来仆役侧门钥匙"
        intent: negotiate
        objects: [maid, medicine_box]
        generic_patch: { maid.trust: 1 }
        expect_storylets: [maid_lends_key]
      - note: "走后楼梯上二楼东翼"
        intent: sneak
        objects: [back_stairs]
        expect_storylets: [climb_back_stairs]
      - note: "用钥匙打开仆役侧门进入档案室"
        intent: use
        objects: [servant_key, service_door]
        expect_storylets: [archive_entry_with_key]
      - note: "旧徽章打开暗格，拿到证据并级联进入午夜摊牌"
        intent: use
        objects: [old_badge, locked_cabinet]
        expect_storylets: [hidden_compartment, midnight_gathering, final_truth]

  - id: costly_victory_fire
    title: "火情路线：可控火情引开守卫，管家识破，暴露身份"
    target_ending: costly_victory
    steps:
      - note: "观察全家画像，建立与薇拉的第一层信任"
        intent: observe
        objects: [family_portrait]
        expect_storylets: [opening_pressure, observe_family_portrait, maid_warning]
      - note: "与薇拉交涉拿到旧徽章"
        intent: negotiate
        objects: [heir]
        generic_patch: { heir.trust: 1 }
        expect_storylets: [heir_badge]
      - note: "从侧梯溜进仆役走廊（管家怀疑 +1，累计 4）"
        intent: sneak
        objects: [side_stair]
        expect_storylets: [slip_into_corridor]
        expect_world_rules: [maid_uses_service_route]
      - note: "不等钥匙，直接走后楼梯到档案室门口"
        intent: sneak
        objects: [back_stairs]
        expect_storylets: [climb_back_stairs]
      - note: "点燃烛台制造可控火情；管家怀疑到 5，当场识破玩家"
        intent: create_distraction
        objects: [candle_stand]
        expect_storylets: [controlled_fire, butler_catches_player]
        expect_world_rules: [butler_pursues_intruder]
      - note: "趁守卫离开门口的一回合窗口穿过东翼"
        intent: sneak
        objects: [archive_door]
        expect_storylets: [archive_entry_by_distraction]
        expect_world_rules: [butler_pursues_intruder]
      - note: "打开暗格拿到证据，但已暴露，进入代价胜利"
        intent: use
        objects: [old_badge, locked_cabinet]
        expect_storylets: [hidden_compartment, midnight_gathering, final_truth]

  - id: costly_victory_without_badge
    title: "补救路线：未取徽章，用仆役钥匙强开暗格"
    target_ending: costly_victory
    steps:
      - note: "观察画像获得侍女便签，但不向薇拉索取徽章"
        intent: observe
        objects: [family_portrait]
        expect_storylets: [opening_pressure, observe_family_portrait, maid_warning]
      - note: "直接进入仆役走廊"
        intent: sneak
        objects: [side_stair]
        expect_storylets: [slip_into_corridor]
        expect_world_rules: [maid_uses_service_route]
      - note: "取得仆役侧门钥匙"
        intent: negotiate
        objects: [maid]
        generic_patch: { maid.trust: 1 }
        expect_storylets: [maid_lends_key]
      - note: "走后楼梯到档案室门口"
        intent: sneak
        objects: [back_stairs]
        expect_storylets: [climb_back_stairs]
      - note: "显式使用钥匙打开仆役窄门"
        intent: use
        objects: [servant_key, service_door]
        expect_storylets: [archive_entry_with_key]
      - note: "观察文件柜，发现没有徽章时的替代办法"
        intent: observe
        objects: [locked_cabinet]
        expect_storylets: [evidence_without_badge]
        expect_world_rules: [butler_pursues_intruder]
      - note: "用仆役钥匙强行撬开暗格，带着暴露代价取得证据"
        intent: use
        objects: [servant_key, hidden_compartment]
        expect_storylets: [force_compartment_with_key, midnight_gathering, final_truth]

  - id: evidence_destroyed_stall
    title: "拖延路线：在大厅耗尽时间，午夜焚毁证据"
    target_ending: evidence_destroyed
    steps:
      - note: "只看壁炉，错过画像；侍女便签仍会自动触发"
        intent: observe
        objects: [fireplace]
        expect_storylets: [opening_pressure, maid_warning]
      - intent: observe
        objects: [rain_noise]
      - intent: observe
        objects: [fireplace]
      - intent: observe
        objects: [rain_noise]
      - intent: observe
        objects: [fireplace]
      - intent: observe
        objects: [rain_noise]
      - intent: observe
        objects: [fireplace]
      - note: "时间归零，午夜焚毁触发，直接被带进终幕"
        intent: observe
        objects: [rain_noise]
        expect_storylets: [midnight_destruction]
