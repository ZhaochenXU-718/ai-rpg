# 《晚风中的一桌饭》可解性回归用例。
# 覆盖两种铺桌物资与两档完整结局；自由叙事默认无时间耗尽结局。

story: rooftop_supper

walkthroughs:
  - id: shared_evening_full_table
    title: "完整邻里路线：邀请小雨和阿禾，用野餐垫铺桌"
    target_ending: shared_evening
    steps:
      - note: "接下晚饭计划，开场节拍与陈阿姨的回应分开归因"
        intent: talk
        objects: [aunt_chen]
        generic_patch: { aunt_chen.rapport: 1 }
        expect_storylets: [opening_offer, accept_supper_plan]
      - note: "去便利店"
        intent: move
        objects: [convenience_store]
        expect_storylets: [arrive_convenience_store]
      - note: "帮阿禾固定手机支架，明确邀请可以随时离开"
        intent: help
        objects: [ahe, phone_mount]
        expect_storylets: [help_rider_before_rush]
      - note: "帮罗叔整理纸箱，借到野餐垫"
        intent: help
        objects: [clerk_luo, carton_stack]
        expect_storylets: [clerk_lends_picnic_mat]
      - note: "沿骑楼去洗衣店"
        intent: move
        objects: [laundromat]
        expect_storylets: [arrive_laundromat]
      - note: "帮小雨理开布料，她借出格布并接受轻量邀请"
        intent: help
        objects: [xiaoyu, tangled_sheet]
        expect_storylets: [help_xiaoyu_with_cloth]
      - note: "从洗衣店后楼梯上天台"
        intent: move
        objects: [rooftop]
        expect_storylets: [arrive_rooftop]
      - note: "用野餐垫铺桌；三名 NPC 同步上楼，两位受邀者到场后进入共享结局"
        intent: prepare
        objects: [food_basket, picnic_mat, folding_table]
        expect_storylets:
          - set_table_with_picnic_mat
          - host_arrives
          - xiaoyu_arrives
          - ahe_arrives
          - shared_table_settles
        expect_world_rules:
          - aunt_comes_upstairs
          - xiaoyu_comes_upstairs
          - ahe_comes_upstairs

  - id: shared_evening_conversation_route
    title: "对话邀请路线：先说明边界，再用小雨的格布铺桌"
    target_ending: shared_evening
    steps:
      - intent: talk
        objects: [aunt_chen]
        generic_patch: { aunt_chen.rapport: 1 }
        expect_storylets: [opening_offer, accept_supper_plan]
      - intent: move
        objects: [convenience_store]
        expect_storylets: [arrive_convenience_store]
      - note: "正常交谈让熟络 +1，达到阿禾愿意接受短时邀请的阈值"
        intent: talk
        objects: [ahe]
        generic_patch: { ahe.rapport: 1 }
        expect_storylets: [invite_rider_with_clear_timing]
      - intent: move
        objects: [laundromat]
        expect_storylets: [arrive_laundromat]
      - note: "正常交谈让熟络 +1，小雨确认可以提前走后接受邀请"
        intent: talk
        objects: [xiaoyu]
        generic_patch: { xiaoyu.rapport: 1 }
        expect_storylets: [invite_xiaoyu_without_pressure]
      - note: "仍需通过具体帮忙取得铺桌用的格布"
        intent: help
        objects: [xiaoyu, tangled_sheet]
        expect_storylets: [help_xiaoyu_with_cloth]
      - intent: move
        objects: [rooftop]
        expect_storylets: [arrive_rooftop]
      - intent: prepare
        objects: [food_basket, checked_cloth, folding_table]
        expect_storylets:
          - set_table_with_checked_cloth
          - host_arrives
          - xiaoyu_arrives
          - ahe_arrives
          - shared_table_settles
        expect_world_rules:
          - aunt_comes_upstairs
          - xiaoyu_comes_upstairs
          - ahe_comes_upstairs

  - id: small_supper_practical_route
    title: "安静小桌：只借野餐垫，不额外邀请邻居"
    target_ending: small_supper
    steps:
      - intent: talk
        objects: [aunt_chen]
        generic_patch: { aunt_chen.rapport: 1 }
        expect_storylets: [opening_offer, accept_supper_plan]
      - intent: move
        objects: [convenience_store]
        expect_storylets: [arrive_convenience_store]
      - intent: help
        objects: [clerk_luo, carton_stack]
        expect_storylets: [clerk_lends_picnic_mat]
      - intent: move
        objects: [rooftop]
        expect_storylets: [arrive_rooftop]
      - note: "只有陈阿姨上楼，客人数为 0，进入同样完整的小桌结局"
        intent: prepare
        objects: [food_basket, picnic_mat, folding_table]
        expect_storylets:
          - set_table_with_picnic_mat
          - host_arrives
          - small_table_settles
        expect_world_rules:
          - aunt_comes_upstairs
