title: 尘缘
version: 0.1.0
language: zh-CN
genre: 玄幻 · 修仙
genre_tags:
- 玄幻
- 修仙
premise: '人间尚有旧剑

  朝天大陆已经太平了很多年。

  至少凡人是这样认为的。

  南方青山连绵数千里，九峰隐在云海之间，青山宗仍是天下剑道之首。北方中州派底蕴深厚，与青山遥遥相对；朝歌城里的神皇统御人间，却也必须在各大修行宗派之间维持微妙的平衡。果成寺不问俗务，水月庵避世清修，风刀教镇守北境。更远处的雪原寒雾终年不散，雪国妖物很少南下；地底冥部也已经许久没有发动真正的战争。

  就在这种平静中，青山宗的景阳真人飞升了。

  世人看见一道剑光斩开天空，认为那位数百年来最接近大道的强者已经离开人间。青山宗为此封闭神末峰，修行界开始重新估量彼此的力量，朝歌城中的权贵则暗自庆幸：一位几乎无人能够制衡的强者终于不在了。

  只有极少数人怀疑，那场飞升并没有真正成功。

  景阳确实离开了原来的身体，却没有抵达传说中的彼岸。飞升之时发生了意外，他不得不以自己的神魂与万物一剑相合，重新化作一个名为井九的少年。

  从那一天起，世间少了一位景阳真人，多了一个没有来历、没有境界、看起来对任何事情都提不起兴趣的白衣少年。


  井九在山村里住了一年。

  这一年里，他晒太阳、吃火锅、看云，很少修行。在村民眼中，他容貌过于出众，性情却懒散得不可救药。只有名叫柳十岁的少年隐约知道，井九并不像看上去那样普通。井九能够一眼看出山石的纹理、剑招的破绽以及人体经脉中最细微的问题，仿佛这世间没有什么真正完整的东西，只要他愿意，总能找到可以被切断的那一点。


  但井九并非无所不能。

  他现在的身体近乎一柄活着的剑，坚固、纯粹，却也异常危险。过去属于景阳真人的境界已经不复存在，他必须从最初的修行阶段重新开始。更重要的是，在弄清飞升失败的真正原因之前，他不能让天下人知道景阳还活着。

  因为想让景阳消失的人，未必只有一个。


  因此，当青山宗仙师来到山村、准备带走天生道种柳十岁时，井九决定同行。

  在旁人看来，这只是一个没有修行天赋的懒散少年，借着同乡的机会进入青山外门。

  对井九而言，这是一次归山。


  他要重新走过自己曾经走过的道路，确认哪些人仍然可信，找出藏在青山里的那只手，并取回某件被人从神末峰带走的东西。

  他并不打算拯救天下。

  天下太大，也太麻烦。

  但如果有人试图利用他的死改变青山，或者把他已经斩断的旧事重新接起来，他便会找到那件事最薄弱的地方，然后像从前一样，一剑切断。

  故事便从井九走进青山山门的那一天开始。

  山门之内，所有人都在谈论已经飞升的景阳真人。

  没有人知道，景阳正在他们身边。'
player_role:
  id: player
  name: 井九
  private_goal: '第一，查明自己飞升失败的真正原因。

    第二，找回被人从神末峰带走的神秘旧物。

    第三，确认青山宗内部究竟是谁知道他仍然活着，并阻止对方利用景阳真人留下的身份、秘密和因果改变青山。'
  constraints:
  - 第一，九峰之间可以竞争，但不能轻易公开互相残杀。任何同门死亡都会引发上德峰调查。
  - 第二，不同山峰并非可以自由出入。洞府、禁地、剑阵与峰主居所都有权限限制，井九即使知道道路，也不能在众目睽睽之下随意穿行。
  - 第三，剑会留下痕迹。剑意、剑伤、御剑习惯和功法特征都可能暴露凶手所属山峰，也可能被人故意伪造。
  - 第四，高境界人物不能随意出手。峰主级强者的一次行动，会立刻被其他山峰、护山大阵和外部宗派察觉。
  - 第五，井九最大的优势不是当前境界，而是他认识青山的每一套剑法、每一条旧路和许多已经被人遗忘的秘密。
  - 第六，井九最大的限制也来自这种熟悉。他越自然地使用这些知识，就越容易让故人意识到：这个年轻弟子知道了太多只有景阳真人才应该知道的事情。
style_bible:
  tone: 整篇故事的叙述语言应当具有东方玄幻特有的清远与浩荡，以山川、云海、剑光、风雪、星月等自然意象承载人物情绪和天地变化，让景物不仅是背景，也是修行者心境与局势的外在显现。文字应疏密有致：描写九峰、剑阵与天地异象时，视野开阔，句势舒展，使力量显得磅礴而非喧闹；落到人物、旧物与细微情绪时，则收束笔墨，以一片落叶、一声剑鸣、一盏未熄的灯表现难以言明的牵挂。飘渺感不依赖堆砌华丽辞藻，而来自距离、留白与不可尽知，让云雾遮住山峰，让剑意只显露一线，让人物面对宏大天地时仍保有沉默。语言可以适度古雅，但应清晰自然，避免艰涩仿古；比喻应少而准确，意象应反复呼应，使青山、云海与剑成为贯穿故事的精神象征。整体效果应如隔云望山：近处清冷具体，远处辽阔难明，在安静之中显出天地之大，也在天地之大中照见人的选择。
  camera: '场景开头通常先写环境中的一处具体变化，再进入人物。


    例如不要直接写“众人来到神末峰”，而可以写：


    云海停在石阶下方。

    再往前一步，便是神末峰。

    重要场景要先给一个远景，建立山峰、云海、殿堂或剑窟的空间感；随后收近到人物手势、眼神和物品；最后落到一个能够代表场景结果的细节上。

    战斗镜头应当迅速、清晰。


    剑修交手不是长时间互相释放招式，而是观察、判断、出剑、结果。真正重要的不是招式数量，而是谁先发现了破绽。


    一场普通战斗可以在数句内结束；只有涉及关键选择、身份暴露或人物关系变化时，才放慢时间，细写剑锋距离、气息变化和人物判断。'
  avoid:
  - 避免让配角只围绕井九存在
  - 赵腊月需要真相，柳词需要维持青山，元骑鲸需要执行门规，方景天需要控制风险。
  - 他们可以帮助井九，也可以反对井九，但都应基于自己的判断行动。
  - 不要让他们因为井九是主角便轻易信服，也不要让高境界人物突然变得愚蠢，只为给井九制造表现机会。
  - 避免简单的正邪划分
  - 闻辛、方景天和柳词都不应成为脸谱化反派。
  - 他们的选择必须有现实依据。牺牲神末峰确实是最安全、最快速的方案；井九提出的新方法则应更加危险，需要所有人共同承担后果。
  - 只有这样，井九最后的选择才不是击败坏人，而是否定一种曾经属于自己的正确。
  - 避免现代化、网络化表达
  - 人物不应使用过于现代的心理学术语、网络词语或轻浮吐槽。幽默要来自古典语境中的人物反差，而不是现代梗。
  - 同时也不必故意堆砌文言。人物语言应简洁自然，只在宗门议事、旧令或正式礼仪中适量提高古雅程度。
  dialogue: 整篇故事的对话应当保持简短、克制而富有潜台词，主要用于试探立场、交换条件、隐藏意图和推动选择，而不是直接讲解设定或完整说明人物内心。人物通常只回答问题的一部分，真正的态度则通过停顿、动作、环境变化以及后续行为表现；越重要的冲突，语言反而越平静，让压力来自彼此都理解对方的理由，却仍然无法退让。对话句式宜简洁自然，少用夸张语气词和复杂的情绪标签，也不要频繁争吵、咆哮或长篇独白。关键信息应在多次交谈中逐步显露，每场重要对话最好围绕一个明确矛盾展开，并在结束时改变人物间的信任、提供新的线索或迫使玩家作出判断。整体而言，对话应像剑修试剑：先观察，再试探，只用最少的话逼近对方真正想隐藏的部分。
global_rules:
  boundaries:
  - 故事始终以青山九峰为核心。
  - 力量规模不超过青山可以承受的范围。
  - 井九不能过早公开真实身份。
  - 所有重要冲突都应保留合理立场。
  - 谜题始终围绕景阳留下的因果展开。
  - 玩家选择可以改变路径，但不改变人物本质。
  - 终极问题始终是“井九如何面对过去的自己”。
characters:
  player:
    name: 井九
    role: player
    public_profile: 初入青山不久的年轻弟子；没有来历、没有境界，看起来对任何事情都提不起兴趣的白衣少年。
  character_1:
    name: 赵腊月
    role: 主要调查伙伴。推动景阳飞升之谜与神末峰旧案的调查
    public_profile: 青山宗罕见的年轻剑道天才，、意志坚定，不畏惧师长与宗门权威。她对景阳真人极为敬仰，并公开怀疑那场飞升另有隐情。
    motivation: 查清景阳飞升的真相，继承自己认同的剑道，不让宗门以稳定为名掩埋重要秘密。
    voice: 尽管她可以让自己表现的镇定，但是往往还是会流露出少女的天真语气。
    initial_relationship: 最初把井九视为一个来历可疑却见识惊人的同伴，随后逐渐产生信任。进而产生依恋的复杂感情
    secret: 她最初接近井九并不完全出于信任。她一直在将井九的言行与自己收集到的景阳旧事相互印证。
  character_2:
    name: 柳十岁
    role: 玩家与普通人间的情感纽带，也是幕后势力可以利用的人质、诱饵与牺牲对象。
    public_profile: 出身山村的天才少年，诚恳、勤奋，对青山和修行充满敬意。虽然缺乏世故，却拥有极强的修行资质。
    motivation: 成为真正的青山弟子，报答师门与井九的帮助，并证明自己能够保护身边的人。
    voice: 诚实、朴素，情绪容易被听出来。面对井九时带有天然的信赖，遇到不理解的事情会直接询问。
    initial_relationship: 把井九视为最可信赖的人。玩家可以保护、指导或疏远他，但柳十岁始终会主动维护井九。对井九而言，他是最难被归入“有用或无用”这套判断标准的人。
    secret: 他的天赋可能与九峰剑阵产生特殊共鸣，因此幕后之人认为他可以替代部分神末峰弟子，成为修复大阵的祭品。
  character_3:
    name: 柳词
    role: 维持宗门整体秩序，在暗中调查与公开稳定之间保持平衡，为玩家提供有限帮助和制度性压力。
    public_profile: 青山宗掌门、天光峰之主。沉稳宽厚，极少显露情绪，习惯从整个宗门的利益出发考虑问题。
    motivation: 确保九峰不因景阳离去而分裂，修复护山大阵，同时避免青山内部爆发无法收拾的冲突。
    voice: 温和、从容，很少直接下结论。常以反问、暗示或看似无关的话传递真正意思，不在公开场合轻易表态。
    initial_relationship: 对井九的真实身份有所怀疑，并可能在较早阶段便形成自己的判断。他会暗中给予玩家行动空间，但不会无条件站在玩家一边。
    secret: 柳词知道护山大阵存在异常，也知道景阳飞升前曾单独修改过神末峰与天光峰之间的阵法连接，但他并不知道备用计划的完整内容。
  character_4:
    name: 元骑鲸
    role: 主要调查者和规则压力来源。负责追查宗门事故、古剑异动、禁地入侵以及可能存在的内奸。
    public_profile: 上德峰峰主、青山剑律。冷酷严厉，重视证据与门规，是多数弟子最不愿面对的人。
    motivation: 维护青山秩序，找出真正威胁宗门的人。他认为任何身份、资历与私人情感都不能凌驾于门规之上。
    voice: 冷淡、精确，不说没有必要的话。询问时像审讯，很少暴露自己的判断，也不会接受以沉默代替回答。
    initial_relationship: 最危险的观察者。他会不断发现井九言行中的矛盾，并通过案件、阵法和旧档试探玩家。双方可能互相隐瞒，却也最容易形成无需解释的默契。
    secret: 元骑鲸已经认出井九使用过一式只有景阳熟悉的剑法，但他故意没有将此事记录在上德峰案卷中。
  character_5:
    name: 方景天
    role: 宗门政治上的主要反对者和前期嫌疑人。他阻止调查、推动封闭神末峰，使玩家始终面临来自九峰议事层面的压力。
    public_profile: 昔来峰峰主，资历深厚，在青山内部拥有众多支持者。行事稳健，重视传统、规矩和宗门名声。
    motivation: 不惜代价维持青山稳定。他认为一件真相是否应该公开，取决于它会给宗门带来什么后果，而不取决于个人是否有权知道。
    voice: 礼貌、克制，习惯引用门规、旧例与宗门大义。很少直接威胁别人，却会让对方意识到自己没有多少选择。
    initial_relationship: 把井九视为神末峰危机中的危险变量。他可能怀疑玩家是景阳留下的传人、容器或某种后手，因此会监视、限制并尝试控制玩家。
    secret: 方景天并非幕后主使。他压制调查，是因为他已经察觉九峰大阵可能崩毁，并担心真相公开后各峰会为自保而争夺阵法控制权。
  character_6:
    name: 闻辛
    role: 幕后行动者与最终对手。制造古剑异动、匿名书信和宗门事故，迫使玩家寻找归剑令并承认自己的真实身份。
    public_profile: 青山前代阵师，早已在宗门记录中坐化。只有少数旧籍还保留着他的名字，多数弟子从未听说过他。
    motivation: 完成景阳真人当年留下的备用计划，以神末峰为代价修复九峰剑阵。他把服从旧令视为自己存在的唯一意义。
    voice: 平静、恭敬、古板。与井九交谈时仍使用面对景阳真人的礼仪，却会毫不退让地指出玩家正在背弃自己过去的决定。
    initial_relationship: 他把玩家视为主人，也把玩家视为必须被迫履行承诺的人。他不会主动杀死井九，却会伤害玩家身边的人，以逼迫玩家启动归剑令。
    secret: '闻辛并不是以正常肉身活到现在。他已经将神魂融入九峰大阵，只能借助飞剑、阵枢和被短暂控制的弟子行动。

      他所执行的命令确实由过去的景阳亲自留下，但命令的最后一句被封存在归剑令内：


      “若归来之人不再认可此令，则由他自行决定。”


      闻辛从未看见这句话，也不相信现在的井九有资格否定当年的景阳。'
scenes:
  scene_1:
    name: 神末峰·断剑阵室
    purpose: '这是故事真相揭晓前的核心密室。


      玩家在这里取得归剑令，并确认最终敌人并非某个野心家，而是景阳自己留下的备用命令。'
    goal: '井九、赵腊月与柳十岁进入神末峰地下。


      三人需要利用弗思剑、九峰剑图与承天剑鞘开启阵室。


      阵室开启后，归剑令显示景阳当年的命令：当九峰大阵无法维持时，牺牲神末峰修复青山。


      柳十岁发现自己也被列入可替代的祭品之中。


      赵腊月质问井九是否早已知道这一可能，柳十岁则仍然选择相信他。


      归剑令的最后一句没有立即显现。闻辛通过阵法现身，夺走归剑令的一部分控制权，并启动献祭程序。'
    entry_text: '断剑阵室应当是一个人工秩序极强的地下空间。


      九面石壁分别对应九峰，每一面都插着一柄已经折断的石剑。中央石台像一座被压缩的山峰，归剑令嵌在其中。


      随着归剑令开启，九面石壁会依次亮起，只有神末峰对应的石剑不断崩裂。


      环境不需要华丽，而应表现出景阳过去那种极端冷静、只考虑效率的设计方式。'
    exits: []
    available_objects:
      environment: {}
  scene_2:
    name: 神末峰·无声剑窟
    purpose: '这里负责确认弗思剑仍然记得景阳，并第一次向玩家提供飞升当日的碎片信息。


      它也是井九必须在隐瞒身份与取得关键物品之间作出选择的场景。'
    goal: '赵腊月带井九进入剑窟，试图确认古剑异动的原因。


      剑窟中的无主飞剑对二人产生敌意，逼迫井九使用超出当前境界的判断与剑术。


      弗思剑在井九靠近时苏醒，却没有立即认主，而是向他传递一段破碎画面：飞升剑光、九峰震动，以及景阳主动回头的一瞬。


      元骑鲸随后赶到，发现现场残留了只有景阳熟悉的剑意。


      从这一刻起，他开始真正怀疑井九。'
    entry_text: '剑窟不应只是普通洞穴，而应像一片被封闭的剑之墓地。


      石壁上插着不同年代的飞剑，空气中满是细碎剑鸣。越往深处走，声音越少，最后变成完全的寂静。


      弗思剑所在之处是一面光滑石壁，周围没有其他飞剑，也没有风。


      当它苏醒时，不需要大规模异象，只需要石壁上出现一道极细的白线，整座剑窟的剑同时低头。'
    exits: []
    available_objects:
      environment: {}
  scene_3:
    name: 上德峰·剑律堂
    purpose: '这是调查与审讯的核心场景。


      在这里，井九不再只是寻找真相，也开始成为元骑鲸调查的对象。九峰剑图的存在会把故事从个人身份之谜，推进到整个青山存亡的问题。'
    goal: '元骑鲸以调查剑窟异动为由询问井九与赵腊月。


      他逐一指出井九行动中的矛盾，却没有直接揭穿身份。


      之后，他单独向井九展示九峰剑图，让井九解释为什么神末峰正在承受其余八峰的剑意压力。


      井九确认护山大阵存在裂隙，但拒绝立刻说出全部判断。


      元骑鲸暂时允许他继续调查，同时警告：如果再有弟子因神末峰之事死亡，他会亲自封峰。'
    entry_text: '剑律堂应当体现秩序、压迫与冷静。


      建筑线条笔直，没有多余装饰。墙上悬挂历代门规、断剑与被废除姓名的弟子名册。堂内光线很亮，却让人感觉寒冷。


      九峰剑图应存放在一间没有窗户的旧档室中。金属薄片展开时，九座微缩山峰浮在黑暗里，神末峰的光芒异常明亮，像正在燃烧。'
    exits: []
    available_objects:
      environment: {}
  scene_4:
    name: 天光峰·承天殿
    purpose: '这里是宗门政治与公开冲突的中心。


      它负责让九峰对神末峰危机表达不同立场，并迫使柳词在掌门职责与对景阳的信任之间作出选择。'
    goal: '九峰代表因连续异象召开议事。


      方景天主张封闭神末峰，并停止井九与赵腊月的调查。元骑鲸要求继续查明事实。赵腊月公开反对牺牲神末峰。


      井九在议事中保持沉默，却指出大阵出现了一处只有历代掌门才能验证的错误。


      柳词因此确认井九知道景阳留下的秘密。


      会议结束后，柳词单独与井九交谈。他不直接询问身份，只问：“你回来，是为了飞升，还是为了青山？”


      故事后期，柳词将在这里把承天剑鞘交给井九。'
    entry_text: '承天殿应当高大、开阔，能够俯瞰九峰云海。


      殿中没有皇宫式的奢华，只有巨大的木柱、青石地面与悬在高处的空剑鞘。九峰代表分别站在不同方位，空间本身便体现权力关系。


      议事时，殿外云海应随着大阵变化缓慢起伏。意见冲突最激烈时，九峰之间可以出现远处雷声，但无人立刻察觉那并非自然天气。'
    exits: []
    available_objects:
      environment: {}
  scene_5:
    name: 九峰地下照影井
    purpose: '这是最终场景。


      它完成井九与闻辛的对抗，也完成“景阳的命令是否还能约束现在的井九”这一核心主题。'
    goal: '九峰大阵开始崩坏，井九进入地下剑脉交汇处。


      闻辛借命灯显现，要求井九执行旧令。他向玩家展示如果不牺牲神末峰，青山可能毁灭的未来。


      元骑鲸负责压制失控剑意，柳词以承天剑鞘维持大阵，赵腊月与柳十岁守住通往照影井的入口。


      井九必须进入闻辛命灯的记忆，找出归剑令被遮蔽的最后一句话。


      闻辛最终得知，景阳早已把最终决定留给“归来之人”。


      井九拒绝牺牲神末峰，并以九峰共同承担损耗的方式重构剑阵。这样做风险更高，也意味着九峰今后必须真正成为一个整体。


      最终，井九决定不再服从过去的自己。'
    entry_text: '照影井不是普通水井，而是一座深入地脉的巨大竖井。


      井壁上流动着来自九峰的不同剑光，中央悬着闻辛命灯。下方没有水，只有看不见尽头的黑暗与剑意。


      终局开始时，九种剑光彼此冲撞；井九作出选择后，它们不应立刻恢复平静，而应艰难地重新连接。


      最后可以让天光从井口落下，照亮已经熄灭或恢复平静的命灯。


      这道光象征的不是飞升，而是井九重新选择留在人间。'
    exits: []
    available_objects:
      environment: {}
  scene_6:
    name: 青山山门与洗剑溪
    purpose: '这是故事正式开始的地方。


      它负责让玩家以“普通新弟子井九”的身份进入青山，同时建立青山宗表面的秩序、年轻弟子之间的关系，以及井九对旧地重游的疏离感。


      这里也是井九第一次察觉九峰剑阵异常的位置。'
    goal: '井九与柳十岁进入青山，被安排参加入门修行。


      其他弟子轻视井九的懒散与低境界，柳十岁则很快显露天赋。


      赵腊月注意到井九对青山道路、剑意和规矩过于熟悉，开始暗中观察他。


      夜间，洗剑溪中的飞剑同时发出短暂剑鸣。所有人都认为这是新弟子引发的偶然异象，只有井九判断出，剑鸣来自神末峰方向。


      这是故事的第一个异常事件。'
    entry_text: '洗剑溪应当表现出青山宗年轻、清澈而有秩序的一面。


      溪水穿过青石与竹林，水中偶尔可见细小剑光。两岸分布着弟子居所、练剑坪与通往九峰的山道。


      白日里这里有新弟子练剑、争论与奔跑，充满生气；夜里则只剩流水声与远处峰顶的灯火。


      当飞剑异动发生时，溪水中的倒影应同时破碎，使安静的宗门第一次显出不祥。'
    exits: []
    available_objects:
      environment: {}
  scene_7:
    name: 神末峰·旧居
    purpose: '这是井九的主要据点，也是“景阳的过去”与“井九的现在”发生碰撞的地方。


      它既提供相对安全的空间，也不断提醒玩家：井九对这里的熟悉本身就是身份暴露的危险。'
    goal: '井九与赵腊月进入长期封闭的神末峰。


      峰上的旧阵没有攻击井九，猿猴与山道也对他表现出异样反应。


      赵腊月发现井九能够自然避开旧阵，却拒绝解释原因。


      两人在一座废弃洞府中发现无名剑匣。赵腊月先一步将其收起，没有立即交给井九。


      夜间，神末峰深处传来弗思剑的第一声剑鸣。'
    entry_text: '神末峰应当安静、荒凉，但不能显得衰败。


      山道被野草和落叶覆盖，旧石阶依然完整。洞府中没有灰尘，仿佛主人只是暂时离开。云海常年停在峰腰，使山顶与其他八峰隔绝。


      这里最重要的感受是“有人生活过，却突然消失”。


      可以描写旧竹椅、未落子的棋盘、干涸的茶盏、被风吹动的白色帘布。这些东西对赵腊月而言是景阳遗迹，对井九而言却只是自己曾经用过的普通物件。'
    exits: []
    available_objects:
      environment: {}
  scene_8:
    name: 昔来峰·观岁台
    purpose: '这是方景天解释自身立场、洗脱部分嫌疑的场景。


      它使玩家意识到，阻止调查的人未必是幕后黑手，而青山真正的危险来自所有人都认为自己是在保护宗门。'
    goal: '井九主动前往昔来峰质问方景天为何压下旧案。


      方景天承认自己早已察觉大阵问题，也承认曾派人监视神末峰，却否认制造古剑异动。


      他向井九展示一份历代阵法损耗记录，证明神末峰早在景阳飞升前便开始替其他山峰承担压力。


      方景天提出交易：交出神末峰的控制权，由九峰共同处理危机，他便停止追查井九身份。


      井九拒绝。


      离开前，方景天告诉他，飞升前最后见过景阳的人不是柳词，而是已经“死去”的阵师闻辛。'
    entry_text: '观岁台应建在昔来峰极高处，可以看见九峰随日影变化。


      这里没有封闭殿堂，只有石台、古松与被风磨平的栏杆。方景天在开阔之地谈论秘密，表现出他并不认为自己需要躲藏。


      环境应传达“岁月比个人更重要”的感觉。


      石台上可以刻着历代峰主名字，有些已经模糊。方景天谈论牺牲时，目光始终落在远处的整座青山，而不是井九身上。'
    exits: []
    available_objects:
      environment: {}
items:
  item_1:
    name: 归剑令
    description: '一枚由青黑色剑石制成的令牌，表面没有文字，只有九道彼此交错的剑痕。


      它由景阳真人在飞升前亲自炼制，记录着九峰剑阵的真实结构、修复方法以及启动备用计划的权限。只有景阳本人的剑意能够完全开启它。


      令牌中保存着景阳当年留下的命令：必要时牺牲神末峰，修复整个青山大阵。


      但在命令最深处，还藏有一句闻辛从未见过的话：


      “若归来之人不再认可此令，则由他自行决定。”


      归剑令是故事最核心的物品，也是最终选择的载体。'
    portable: true
    consumable: false
    visible_when_carried: false
  item_2:
    name: 弗思剑
    description: '神末峰主剑，曾长期跟随景阳真人。


      弗思剑保存着景阳过去的部分剑意，也记得飞升当日发生的事情。它无法直接说出真相，只能通过剑鸣、剑痕与断续的神识画面传递信息。


      它既是证明井九身份的证据，也是开启归剑令的必要钥匙。'
    portable: true
    consumable: false
    visible_when_carried: false
  item_3:
    name: 九峰剑图
    description: '九峰剑图被封存在上德峰剑律堂的最高级旧档中。元骑鲸发现图中的剑意流向正在自行变化，因此没有将其交给天光峰，也没有写入正式案卷。


      他会借调查宗门事故的机会观察井九，并决定是否允许井九查看剑图。


      玩家若想取得九峰剑图，必须获得元骑鲸的信任，或者潜入上德峰旧档。


      一幅刻在极薄金属片上的古老阵图，展开后会浮现九座彼此相连的山峰。


      它显示的不是护山大阵的表层结构，而是九峰之间真正的剑意流向。随着裂隙扩大，图中的神末峰会越来越亮，其余山峰则逐渐暗淡。


      九峰剑图可以证明大阵正在把所有损耗转移到神末峰。'
    portable: true
    consumable: false
    visible_when_carried: false
  item_4:
    name: 承天剑鞘
    description: '承天剑鞘由历代青山掌门保管，平时放置在天光峰“承天殿”内。除掌门外，任何人未经允许触碰剑鞘，都会被视为试图夺取青山大阵的控制权。


      柳词利用剑鞘压制九峰大阵的异常，却因此必须长期留在天光峰，无法亲自调查神末峰。


      故事后期，玩家必须说服柳词暂时交出剑鞘。这个决定意味着柳词将整个青山的安危交给井九。


      一只无剑的古老剑鞘，是青山掌门身份与权力的象征。


      它能够调动九峰剑意，封闭山门、隔绝某峰或镇压失控的飞剑。承天剑鞘只能延缓大阵崩坏，无法单独修复裂隙。


      它代表的不是某个人，而是整个青山宗的共同意志。'
    portable: true
    consumable: false
    visible_when_carried: false
  item_5:
    name: 闻辛命灯
    description: '九峰大阵核心的“照影井”。


      照影井位于九峰地下剑脉的交汇处，没有普通道路可以抵达。闻辛的肉身早已消亡，他的神魂寄宿在命灯之中，并借助大阵观察各峰。


      命灯不能离开照影井。一旦被移走，九峰剑阵会立刻发生剧烈震荡。


      闻辛可以通过命灯影响飞剑、阵枢与靠近剑脉的弟子，但每次行动都会使灯火变暗。


      一盏表面布满剑纹的青铜小灯。


      只要命灯不灭，闻辛便不会真正死亡。灯中也保存着他接受景阳旧令时的完整记忆。


      最终，玩家可以毁掉命灯，也可以进入闻辛的记忆，让他亲眼看见归剑令中被隐藏的最后一句话。'
    portable: true
    consumable: false
    visible_when_carried: false
  item_6:
    name: 无名剑匣
    description: '赵腊月在调查景阳飞升之谜时，于神末峰一座废弃洞府中发现了剑匣。她没有把此事上报宗门，而是将剑匣藏在自己的临时住处中。


      剑匣无法被普通方法打开。赵腊月只知道它与景阳有关，并怀疑井九能够开启它。


      她不会轻易把剑匣交给玩家。只有当井九愿意透露部分真相，或以行动证明自己并非在利用她时，赵腊月才会将其取出。


      一只没有纹饰、没有锁孔的旧木剑匣。


      匣中没有飞剑，只有景阳飞升前留下的一截白色衣袖，以及一道无法被普通神识察觉的剑痕。


      剑痕记录着景阳在飞升最后一刻主动斩断通道、返回人间的经过，是证明井九并非意外转生，而是主动归来的关键证物。'
    portable: true
    consumable: false
    visible_when_carried: false
