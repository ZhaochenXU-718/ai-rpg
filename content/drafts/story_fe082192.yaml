narrative_guidelines:
- 以环境承载情绪与局势
- 每个场景都应产生推进。
- 让真相逐层显现。
critical_reminders:
- 井九可以看得很远，但不能轻易解决一切
- 冲突不是简单的正邪之争。
- 情感必须通过选择兑现。
opening_narration: '# 第一章　山门有风


  青山在云里。


  从山下望去，只能看见数道青黑色的峰影，自云海之间断续升起。最高处被晨光照亮，像几柄沉默了很多年的剑，剑锋已经伸进天穹，剑身却仍留在人间。


  山道前立着一座石门。


  石门不高，没有匾额，也没有镇山异兽。两侧生着几株不知年岁的古松，枝叶间积着昨夜的露水。风从群峰深处吹来，松针微动，那些露珠便落在青石上，声音很轻。


  柳十岁仰着头看了很久。


  “公子，这就是青山？”


  井九也在看青山。


  他看得比柳十岁更久一些，却不是因为惊叹。


  山门还是从前的山门，石阶的位置没有变，左侧那株松树多长出了一根斜枝，右边的石壁上添了几道浅痕，应该是近些年才入门的弟子练剑时留下的。远处云层的流向有些不同，说明护山大阵改过一次。


  改得不算好。


  井九收回视线，说道：“嗯。”


  柳十岁等了一会儿，没等到下文，便又问道：“很厉害吗？”


  “还可以。”


  负责引他们入山的青山弟子走在前面，听见这句话，回头看了井九一眼。


  那名弟子姓吕，来自南松亭，境界不高，神情却很端正。他先前已经听说柳十岁天生道种，对这个少年自然和气。至于井九，在他看来只是容貌过于出众，身体却有些虚弱，走了这么久的山路，连一丝汗都没有出，多半是累得连汗都流不出来。


  “青山九峰，是天下剑道正宗。”


  吕师兄停下脚步，望向云中群峰，语气里带着理所当然的骄傲。


  “修行界提起青山，从来不会说还可以。”


  井九说道：“那是因为他们没有住过。”


  吕师兄微微皱眉。


  柳十岁赶紧解释：“公子没有别的意思，他只是……不太喜欢说话。”


  井九看了他一眼。


  柳十岁低下头，不再替他解释。


  三人穿过山门。


  那一刻，林间的风忽然停了。


  石门上方空无一物，空气里却像有一道看不见的水面，被他们的身体轻轻撞开。柳十岁只觉得耳边一静，山外的鸟鸣、虫声与溪水声同时远去，接着，一股清冽至极的气息扑面而来，顺着口鼻进入胸腹。


  他脸色微白，下意识停住脚步。


  吕师兄眼中露出赞许之色。


  第一次进入青山，便能感应到天地灵气的变化，说明柳十岁的道种确实不凡。


  井九没有停。


  那道无形屏障从他身上掠过，像春水经过一块旧石，没有激起半点涟漪。


  但在很远的地方，有什么东西醒了一瞬。


  那道感觉极淡，淡得像云层后的一点星光。吕师兄没有察觉，柳十岁更不可能察觉。井九抬头望向群峰最深处，只看见一座被云雾遮住大半的孤峰。


  神末峰。


  那里没有声音。


  井九看了片刻，继续向前走去。


  山门之后，道路渐宽。溪水从林间穿过，水色清亮，溪底散落着无数细碎白石。偶尔有年轻弟子坐在岸边静心吐纳，也有人踩着水中石块练习身法。更远处，数道剑光从山腰飞起，在云间一闪而逝，留下极淡的痕迹。


  柳十岁看得目不暇接。


  井九只看了一眼。


  那几名弟子的御剑姿势有些问题，真元运转也不够平稳。最前面那人的剑尖偏了三分，若遇到侧风，应该会撞上后面那人。


  片刻后，云间传来一声惊呼。


  两道剑光仓促分开，其中一名弟子斜斜落进竹林，惊起一群白鸟。


  吕师兄神情略显尴尬，装作没有看见。


  井九也没有说话。


  有些事情看见就可以，没有必要都说出来。


  南松亭在洗剑溪下游，是青山弟子入门修行之地。院落依山而建，白墙青瓦，廊下悬着一排木剑。那些木剑被山风吹动，偶尔彼此轻碰，发出空而清脆的声音。


  吕师兄给二人安排住处，又交代了几条规矩。


  晨起听钟，日落止剑，不得擅入九峰，不得私斗，不得在洗剑溪中沐浴。


  说到最后一条时，他特意看了井九一眼。


  井九问道：“为什么？”


  “溪中有剑意。”


  “很弱。”


  吕师兄沉默片刻，说道：“总之不能。”


  井九没有继续问。


  柳十岁认真记下所有规矩，又替井九领了衣物与木牌。等到吕师兄离开，他把东西放在桌上，犹豫了一会儿。


  “公子，你以前是不是来过这里？”


  窗外，暮色正从群峰之间落下。云海被夕阳染成暗金色，天光峰最高处还有一线明光，神末峰却已经隐入阴影。


  井九说道：“没有。”


  “可是你好像什么都知道。”


  “知道不等于来过。”


  柳十岁觉得这句话有道理，又觉得哪里不对。他想了很久，没有想明白，只好去整理床铺。


  井九走到窗边。


  暮色渐深，溪水的声音变得清晰。远处有人诵读入门心法，有人在院中练习最简单的剑式。那些声音交叠在一起，并不嘈杂，反而使群山显得更加安静。


  青山还是青山。


  人换了一些，路改了一些，阵法也坏了一些。


  除此之外，没有太大区别。

  '
