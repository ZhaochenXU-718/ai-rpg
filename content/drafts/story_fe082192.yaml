emotional_contract: '一个近乎无所不知、无所畏惧的人，隐藏身份重新回到熟悉而陌生的人间，以绝对冷静面对阴谋、旧债与生死；而在他看似淡漠的目光之下，那些被他否认、忽略或不愿承认的牵挂，正一点点重新生长。

  玩家要获得：俯视一切的从容与爽感，无论局势多么危险，井九总能看见别人看不见的那条路；旧日荣光下的孤独与疏离，他过去习惯从高处看待众生，如今却必须站在众生之间。'
player_facing_summary: '山门之内，所有人都在谈论已经飞升的景阳真人。

  没有人知道，景阳正在他们身边。'
ai_plot:
  player_role: '在众人眼中，他只是一个初入青山、境界低微、性情懒散的年轻弟子；实际上，他是飞升失败后重返人间的景阳真人。凭借前世的阅历、剑道认知和对青山宗的了解，他能够看穿许多旁人无法察觉的阴谋与破绽。

    他在故事中既是调查者，也是被调查和追猎的对象。'
  main_goal: '主要目标是查明自己飞升失败的真正原因。

    核心矛盾是是“离开人间”与“重新进入人间”之间的冲突。井九认为修行的最终目的就是飞升，不应被感情、宗门或人间事务束缚。但在调查旧事的过程中，他不断与故人、新弟子和青山建立新的联系。他越想斩断因果，便越会发现自己已经重新身处因果之中。'
  opposition: '井九面对的主要对抗力量，是一个隐藏在青山宗内部的旧日势力。

    这股势力知道景阳的飞升存在问题，并正在寻找他遗留的秘密。他们未必能够立刻确认井九的身份，却会通过试探、追杀和制造宗门冲突，迫使他暴露真实能力。'
  world_rules: '一、世界观的基本结构


    朝天大陆是一个由凡人王朝、修行宗派与非人族群共同构成的世界。


    朝歌城的皇朝负责治理凡人社会，维持城池、军队、赋税与世俗秩序；修行宗派则掌握真正能够改变天下格局的力量。皇权与宗派并非单纯的上下关系，而是彼此合作、彼此戒备：皇朝需要修行者抵御雪国、冥部与邪道势力，修行宗派也需要皇朝维持人间稳定。


    修行界表面以正邪划分，实际更接近一种长期维持的力量平衡。青山宗与中州派是最强大的两极，其他宗派、皇朝以及边境势力处在两者之间。任何一位通天境强者的生死、任何一座大派的内乱，都可能改变整个大陆的政治格局。


    在本故事中，飞升之后的世界不作展开。对朝天大陆上的绝大多数人而言，飞升仍是一种无法验证的终极目标：成功者离开人间，失败者往往形神俱灭。景阳真人的“飞升”因此既是一场宗教意义上的成功，也是一场无人能够调查清楚的失踪。

    二、修行力量如何运行


    修行者吸纳天地灵气，在体内培养道种、真元与神魂。不同宗派对力量的解释不同：青山宗重剑果与剑丸，果成寺重禅心，冥部重魂火，中州派则使用另一套丹境体系。名称虽然不同，但本质都是让身体、精神与天地力量逐渐结合。


    青山剑修最看重三件事：


    境界决定修行者能够承载多少力量。


    飞剑决定力量以何种方式释放。


    剑道认知决定修行者能否用最小代价找到敌人的破绽。


    所以境界并不完全等同于战斗结果。飞剑品质、功法克制、阵法环境、战斗经验与情报差距都可能改变胜负。不过境界相差过大时，技巧通常无法弥补绝对力量。


    青山宗的剑道尤其追求飞剑的速度与威力。真正的交手往往只在一瞬间，一剑落下便分生死，因此同门平日很少进行毫无限制的切磋。承剑大比、试剑等正式场合也有严格规则，避免弟子因一时失手直接死亡。


    三、境界划分


    青山宗的主要境界依次为：


    1. 有仪


    修行的入门阶段。


    弟子锻炼身体、磨炼意志，使体内的道种稳定下来。此时仍接近强健的凡人，能够感知修行法门，却不能真正运用天地之力。


    2. 抱神


    修行者开始感应天地灵气，将其吸收入体内，转化为真元。


    这一阶段的关键不是招式，而是精神是否稳定。意志不坚、心绪混乱的人，很难维持道种成长。


    3. 知通，又称果成


    道种成熟，结成剑果，剑意开始出现。


    修行者能够与飞剑建立稳定联系，正式御剑攻击。从这一境界开始，青山弟子才真正成为剑修。


    4. 守一


    真元转化为更加凝练的剑元，剑果逐渐形成剑丸。


    剑丸一成，飞剑便如手足延伸，可以断石切金，也可以载人飞行。守一境弟子已经具备独立执行普通宗门任务的能力。


    5. 承意


    修行者的感知范围大幅扩张，能够察觉极细微的声音、气息与剑意变化。


    这一境界的剑修不仅能控制飞剑，还开始真正理解战场。对青山弟子而言，承意境通常意味着已经脱离新人阶段。


    6. 无彰


    力量由显露转为内敛。


    剑意、真元与气息不再轻易外泄，修行者开始学会隐藏自身状态。无彰境修行者往往已经可以担任教习、执事或宗门中的重要办事者。


    7. 游野


    修行者能够长距离御剑，在大陆上独立行走。


    游野境意味着真正进入强者行列，足以镇守一地、猎杀大妖或代表宗门参与重要事务。很多年轻弟子终其一生也无法到达此境。


    8. 破海


    能够突破天地与神魂之间更深层的限制。


    破海境通常是长老、峰主级别的力量。一位破海境修行者足以左右一座中型宗派的存亡，在青山宗内也拥有真正的话语权。


    9. 通天


    朝天大陆最顶层的常规境界。


    通天境强者能够以剑意跨越极远距离，直接影响天地异象。掌门、宗派老祖与大陆级强者大多处于这一层次。他们之间的交手往往已经不是私人恩怨，而是宗派战争。


    10. 藏天下与万物一


    这是通天之上的传说层次，不宜作为普通晋级阶段使用。


    它们更接近修行者对天地规则的彻底理解，也是接近飞升的标志。在本故事中，这两个境界主要用于解释景阳真人过去的高度，不会成为年轻弟子日常比较的力量单位。


    青山境界为“有仪、抱神、知通、守一、承意、无彰、游野、破海、通天、藏天下、万物一”；御剑距离也常被用作直观判断标准，例如承意可隔百丈杀敌，游野可御剑十余里，通天则可以一剑千里。


    五、青山九峰


    九峰分别拥有不同的主剑、剑法、传统与气质。它们既是九种剑道，也是九个拥有自身利益的权力群体。


    1. 天光峰：青山的公开权威


    天光峰是第一峰、祖峰，也是掌门居所。


    这里代表青山宗的正式意志，掌管对外命令、宗门大典、重大议事与护山大阵。掌门柳词居于此峰，象征性核心是承天剑鞘与万物一剑的传承，所修为承天剑道。


    天光峰讲究承担与统御。它不一定在所有事务中亲自出手，却必须对整个青山负责。


    在故事中，天光峰适合承担：


    宗门公开命令的发布地、掌门与长老议事之地、官方调查的中心，以及“青山对外说法”与真实内幕发生冲突的地方。


    2. 两忘峰：年轻一代的剑锋


    两忘峰是青山年轻强者汇集之处。


    它没有普通意义上的稳定峰主，更像青山宗内部的精英战斗组织。最优秀、最适合实战的年轻弟子会被选入其中，由首席弟子统领，负责历练、除妖以及宗门需要年轻一代出面的危险任务。


    两忘峰崇尚实力、纪律与战功。这里的人往往把自己视为青山未来的守护者，因此容易形成强烈的荣誉感，也容易轻视那些境界低、性情懒散或拒绝承担责任的人。


    其代表为不二剑。


    在故事中，两忘峰适合成为井九最直接的同辈阻力：他们未必邪恶，却会怀疑他的态度、身份与能力，并试图用青山弟子的标准衡量他。


    3. 上德峰：门规与剑狱


    上德峰是青山最冷的一峰。


    峰主元骑鲸兼任剑律，负责宗门戒律、调查、惩处与剑狱。所有涉及叛宗、勾结外敌、残杀同门与禁术的案件，最终都可能落到上德峰手中。


    其代表为三尺剑与雪流剑诀。


    上德峰弟子重证据、秩序和服从。他们不轻易相信解释，也不会因为身份高贵便放弃调查。这里储存着青山最危险的囚犯、最不能公开的旧案与最严密的记录。


    在故事中，上德峰是宗门悬疑的核心场所：井九需要借助上德峰的旧档和剑狱调查真相，却也必须避免自己成为被调查的对象。


    4. 云行峰：剑选择人的地方


    云行峰又常被称为剑峰。


    无数有主、无主或尚未认主的飞剑藏于山峰石壁与洞穴之间。弟子需要登峰寻剑，但最终并不完全是人选择剑，也可能是剑选择人。


    云行峰地势险峻，剑意混杂，是九峰中最适合发生意外的地方。代表主剑为皆空剑，剑法为苍鸟剑诀，以轻灵迅疾见长。


    在青山宗的运行中，云行峰掌握着一个极重要的环节：没有合适的飞剑，弟子便无法真正发挥剑道。


    在故事中，这里适合出现失踪的剑、被人为改动的剑意、错误认主、古剑苏醒，以及井九通过一柄剑认出旧日故人的情节。


    5. 清容峰：柔和表象下的锋利


    清容峰以女弟子居多，峰主为南忘。


    其代表为锦瑟剑与无端剑诀，剑势看似轻柔瑰丽，实际变化难测。清容峰并非单纯的“女子山峰”，其弟子在宗门教学、交往与事务中同样拥有重要影响。


    清容峰对人的情绪、关系与言外之意更加敏感，与井九那种只看事实和剑理的方式形成对照。


    在故事中，它适合成为消息流通、人际观察与情感冲突的场所。清容峰的人可能最早察觉井九并非表面那样冷漠，也可能从他的生活习惯和言谈细节中发现身份疑点。


    6. 适越峰：典籍、药圃与日常秩序


    适越峰由陆广元主持。


    这里负责照料药草、果园以及部分典籍事务，气氛相对平和，峰上还有大量猿猴。代表主剑为回日剑，所修为六龙剑法。


    适越峰看似远离权力斗争，却掌握着宗门日常运行所需的资源：丹药原料、旧籍、物资记录以及历代弟子的部分修行资料。


    在故事中，适越峰适合承担“安静但关键”的调查功能。一株被调换的灵药、一页被撕走的旧书、一份不合常理的物资领取记录，都可能成为揭开阴谋的第一条线索。


    7. 昔来峰：资历与宗门政治


    昔来峰峰主为方景天。


    其代表为如岁剑与七梅剑诀，剑意绵长柔韧。昔来峰拥有深厚的传承与复杂的门生关系，在九峰议事中往往有稳定而重要的影响。


    如果天光峰代表正式权威，那么昔来峰更适合代表宗门内部长期积累的资历、派系与人情。


    在故事中，昔来峰可以成为较为保守的力量。他们未必反对井九，但会优先考虑青山的稳定、规矩与名声。当真相可能动摇宗门时，他们很可能主张压下真相，而不是公开处理。


    8. 碧湖峰：雷声下的旧案


    碧湖峰临湖而立，与雷霆气息联系紧密。


    代表为潮来剑与八方剑诀。峰上有珍贵的雷魂木，也曾由青山镇守白鬼看护。前任峰主雷破云之死留下过复杂疑点，后来由成由天接掌。


    碧湖峰的力量带有水势与雷势，表面开阔，内部却很适合隐藏旧日恩怨。


    在故事中，这里可以成为第一桩宗门旧案的发生地。湖底、雷魂木、前代峰主洞府以及镇守灵兽的记忆，都能与景阳飞升前留下的秘密产生联系。


    9. 神末峰：井九的过去与现在


    神末峰是第九峰，也是最孤独的一峰。


    这里曾是景阳真人的修行之地，代表为弗思剑与九死剑诀。景阳“飞升”之后，神末峰近乎封闭，弟子稀少，峰中保留着大量无人敢轻易触碰的剑意、阵法与旧物。


    神末峰的特殊之处在于，它既属于青山，又像独立于青山之外。


    对其他峰而言，这里是景阳真人留下的遗迹；对井九而言，这里却是他曾经生活过的地方。峰上的道路、洞府、猿猴与剑阵都认识景阳，却未必立刻承认现在的井九。


    神末峰是本故事最重要的据点：


    它是井九暂时安全的居所，也是敌人最想进入的地方；是他隐藏身份的屏障，也是最可能暴露身份的证据库；更是“景阳留下了什么”与“井九准备成为什么”这两条主线交汇之处。


    九峰对应的核心传承依次为：天光峰承天、两忘峰不二、上德峰三尺、云行峰皆空、清容峰锦瑟、适越峰回日、昔来峰如岁、碧湖峰潮来、神末峰弗思。


    六、其他主要势力

    中州派


    与青山宗并列的超级宗派，也是青山最重要的竞争者。


    中州派传承庞杂，擅长丹法、符法、法宝与大型术法，组织方式比青山更加集中。双方表面同属正道，遇到雪国等共同威胁时会合作，但在声望、弟子、资源与天下主导权上长期竞争。


    朝歌城与皇朝


    凡人世界的统治中心。


    神皇拥有修行背景和强大供奉，却不能直接命令所有宗派。朝歌城需要在青山、中州及其他势力之间维持平衡，常以封赏、婚姻、情报和军队影响修行界。


    果成寺


    佛门圣地，地位超然。


    果成寺重视禅心与因果，常在宗派冲突中充当旁观者或调解者。它也是处理神魂、心魔与轮回问题的重要地点。


    水月庵


    隐世修行宗派，与外界往来不多。


    其态度通常较为克制，不轻易卷入天下争斗，但拥有深厚传承，也与部分青山前辈存在私人因缘。


    一茅斋


    以礼法、学问与人间责任为核心的修行势力。


    相比青山的剑道与果成寺的禅法，一茅斋更强调修行者应当如何面对世俗社会。


    风刀教


    位于北方的重要力量，由刀圣坐镇。


    风刀教长期面对雪国压力，是人族北境的第一道屏障。它与青山并非上下关系，而是拥有独立立场的盟友。


    西海剑派


    另一支强大的剑道势力。


    西海剑派与青山在剑道正统问题上存在竞争，既可能公开挑战，也可能利用青山内部矛盾削弱九峰。


    悬铃宗与卷帘人


    悬铃宗擅长炼器和法宝，宗族色彩浓厚。


    卷帘人则近似遍布大陆的情报组织，出售、收集或传递消息。涉及旧案调查时，他们可能比任何正道宗门知道得更多。


    冥部


    生活于地下的另一种文明。


    冥部与人族有持续数万年的战争与仇恨，但双方已经多年没有发生全面大战，私下也存在交易、谈判与秘密往来。


    雪国


    位于极北之地的非人力量。


    雪国怪物不遵循人类宗派规则，其存在本身就是对整个人族世界的威胁。只要雪国大规模南下，青山、中州、朝歌与风刀教便必须暂时放下内部争斗。


    玄阴宗与不老林


    玄阴宗代表公开的邪道传承，不老林则更接近隐秘的刺客和地下网络。


    这些势力会收买叛徒、安插内应，并利用正道宗门不愿公开的丑闻。青山内部的敌人未必真正信奉邪道，也可能只是与这些组织进行利益交换。


    七、本故事需要遵守的几条硬规则


    第一，九峰之间可以竞争，但不能轻易公开互相残杀。任何同门死亡都会引发上德峰调查。


    第二，不同山峰并非可以自由出入。洞府、禁地、剑阵与峰主居所都有权限限制，井九即使知道道路，也不能在众目睽睽之下随意穿行。


    第三，剑会留下痕迹。剑意、剑伤、御剑习惯和功法特征都可能暴露凶手所属山峰，也可能被人故意伪造。


    第四，高境界人物不能随意出手。峰主级强者的一次行动，会立刻被其他山峰、护山大阵和外部宗派察觉。


    第五，井九最大的优势不是当前境界，而是他认识青山的每一套剑法、每一条旧路和许多已经被人遗忘的秘密。


    第六，井九最大的限制也来自这种熟悉。他越自然地使用这些知识，就越容易让故人意识到：这个年轻弟子知道了太多只有景阳真人才应该知道的事情。


    因此，青山九峰不仅是故事发生的地点。


    它本身就是一座由剑道、规矩、旧情、权力与秘密共同组成的巨大迷宫。

