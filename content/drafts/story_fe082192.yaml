    他在飞升前曾留下了一件名为“归剑令”的旧物，其中记录着青山大阵的秘密，也包含着修复剑阵的方法。那件旧物后来被人从神末峰取走。


    隐藏在青山内部的势力并非单纯想夺取景阳的遗产。他们早已发现剑阵正在崩坏，却认为青山不能承受真相公开后的混乱。于是，他们决定牺牲神末峰，将神末峰积存的全部剑意以及峰中之人炼入大阵，永久修补九峰。


    那些神秘书信、古剑异动与旧案，都是他们为了寻找井九而制造的试探。


    他们相信景阳没有真正离开，也相信只有景阳能够启动归剑令。只要将井九逼到绝境，他便不得不承认身份，并完成这场牺牲。


    故事最终揭开的真相是：


    **所谓幕后敌人，正在执行的其实是景阳真人当年留下的备用计划。**


    那时的景阳认为，只要能够保住青山，牺牲一峰乃至少数弟子也是可以接受的代价。幕后之人只是严格遵从了他的命令。


    因此，井九最后需要对抗的并不只是某个叛徒，而是过去的自己。


    他必须决定，是继续按照景阳真人绝对理性的方式拯救青山，还是承认自己已经不再是从前那个人，寻找一条更危险、更困难，却不必牺牲无辜者的道路。

    '
