    name: 任素素
    role: player
    public_profile: 任素素，二十二岁，城南旧城区的护工，靠接零工过活。孤儿院出身，逢年过节会回白楼做义工，院长和楼里老人都认得这个安静本分的姑娘——不多话，手脚勤快，见谁都低三分。没人把这个不起眼的年轻女人和任何危险的事联系在一起。
