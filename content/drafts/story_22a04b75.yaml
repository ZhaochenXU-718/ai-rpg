emotional_contract: 在恨意与心动之间反复拉扯的窒息感；每一次信任都在为最终的撕裂加码。
ai_plot:
  main_goal: 玩家需要推进复仇计划：查清孤儿院拐卖网络的证据、接近院长、找到动手或揭发的时机；同时应对这个身份不明、目的不明的同行者——是合作、利用还是甩开他，由玩家决定。
  opposition: 院长表面慈善、实则手腕狠辣，背后还有买通官员与买家的整条利益链；而那个神秘男人行踪诡秘，他的家族与当年灭门案的关联让每一步靠近都可能暴露玩家自己。
  hidden_truth: 这个男人就是当年被救的男孩，他的家族正是女主家灭门案的委托方；他自己也在追查家族旧罪，试图赎罪，却不知眼前的女人就是当年的小女孩。两人的复仇与赎罪指向同一条锁链的两端。
  player_role: 你是女主。公开身份是城南孤儿院出身的二十出头普通年轻女人，靠打零工和在旧城区做护工维持生计，偶尔回白楼做义工——这让你有理由接近院长而不显得突兀。私下里，你活着只有一个目标：查清十年前灭门案的真相，把院长和她背后的拐卖网络连根拔起。你的约束在于：白楼里还有人记得小时候的你，调查越深，身份暴露的风险越高；而你对那个同样在暗中调查的男人一无所知，每一次合作都可能是在给仇家递刀。
  world_rules: 1. 十年前那场灭门大火被官方定性为意外，知情者要么消失要么缄口，真相只藏在孤儿院旧档案、院长的人情往来和买家的交易记录里，没有捷径可寻。2. 白楼有一套严密的'消失机制'：夜里被带走的孩子会以'被领养'的名义销档，楼里其他孩子会收到一套安慰说辞，任何追问都会招来院长的注意。3.
    院长的网络横跨官员、中间人和外地买家，扳倒其中一环不足以撼动全局，证据必须成链才有杀伤力。4. 金钱与权力能压住多数声音，但压不住记忆：当年活下来的人、记得旧事的老雇员、经手过文件的底层办事员，都是可以被撬动、也会反过来出卖你的活口。5.
    心动与信任在这个世界里是真实存在的风险——感情越深的人，越可能是锁链另一端的人，但没有人会主动向你坦白，一切关联必须靠玩家自己查证与试探。
