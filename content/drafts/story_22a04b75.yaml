premise: 你是女主。十年前你从火里救起一个陌生男孩，当夜你的全家因此被灭口。你在城南孤儿院长大，逐渐发现那栋白楼不只是收容所——夜里失踪的孩子再也没回来。如今你已搜集到足够线索，准备对院长和她背后的人动手，却在踩点时撞见一个同样在暗中调查孤儿院的男人。
player_role:
  id: player
  name: 任素素
  private_goal: 调查火灾真相，并且杀掉孤儿院院长。
  constraints: []
