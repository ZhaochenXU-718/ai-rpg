id: midnight_archive
title: "午夜前的档案室"
version: 0.3.0
schema_version: 2
language: zh-CN
genre: mystery_infiltration
target_duration_minutes: 20-30

design_goal: |
  验证玩家的自然语言行动方案是否能被系统认真理解、报价风险、
  公平判定，并转化为后续因果。第一版内容以高控制度短篇为目标，
  不追求开放世界。

premise: |
  暴风雪封住了黑松庄园。玩家是一名被临时邀请来的遗产见证人，
  但真正目的，是在午夜前进入二楼档案室，找到一份能证明遗嘱被篡改的证据。
  管家宣称所有人必须留在大厅，档案室门口有守卫看守。午夜钟声一响，
  管家就会以“防潮封存”为名烧毁档案室里的旧文件。

player_role:
  id: player
  name: "见证人"
  public_identity: "受邀到场的遗产见证人"
  private_goal: "午夜前进入档案室，找到能证明遗嘱被篡改的证据"
  constraints:
    - "不能凭空制造不存在的科技、武器或超自然能力。"
    - "不能直接命令 NPC 违背强动机。"
    - "可以撒谎、交涉、试探、潜入、制造局部混乱，但要承担后果。"

style_bible:
  tone: "悬疑、克制、带有暴风雪山庄的压迫感"
  camera: "多用可感知的细节：烛光、雨声、脚步、视线、沉默"
  avoid:
    - "不要像聊天机器人一样解释系统规则。"
    - "不要让 NPC 无条件配合玩家。"
    - "不要把失败写成单纯拒绝，失败也要推动故事。"

global_rules:
  time:
    description: >
      每次确认执行行动通常消耗 1 点 time_left（取自意图 typical_cost），
      高风险或复杂行动可消耗 2 点。重新报价不消耗 time_left。
      时间只能由引擎按意图代价和 storylet 效果扣减，不进入兜底判定白名单。
    midnight_when_time_left_lte: 0
  fairness:
    - "复杂行动先报价，再执行。"
    - "判定必须解释关键原因。"
    - "玩家创意优先转化为收益、代价或新机会。"
    - "除非明显违反世界规则，尽量避免纯失败。"
  boundaries:
    - "庄园因暴风雪无法离开。"
    - "档案室在二楼东翼，门口有守卫。"
    - "午夜后核心文件会被销毁。"
    - "管家是主要阻力，但不能在前半段直接暴露为反派。"

# Schema v2：空间图是静态内容，positions 是所有角色位置的唯一事实来源。
# 场景不再重复维护 available_characters / people 名单。
world_board:
  nodes:
    great_hall: { name: "大理石大厅", kind: room }
    servant_corridor: { name: "仆役走廊", kind: corridor }
    archive_door: { name: "档案室门口", kind: area }
    archive_room: { name: "二楼档案室", kind: room }
    final_confrontation: { name: "午夜摊牌", kind: encounter }
  edges:
    - { from: great_hall, to: servant_corridor, bidirectional: true }
    - { from: servant_corridor, to: archive_door, bidirectional: true }
    - { from: great_hall, to: archive_door, bidirectional: true }
    - { from: archive_door, to: archive_room, bidirectional: true }

world_rules:
  - id: maid_uses_service_route
    actor: maid
    priority: 20
    when:
      scene: servant_corridor
      positions:
        maid: great_hall
      flags:
        side_door_found: true
    move:
      to: servant_corridor

  - id: butler_pursues_intruder
    actor: butler
    priority: 100
    when:
      scene_any:
        - archive_door
        - archive_room
      state_gte:
        butler.suspicion: 5
    move:
      toward: player
    narrative_hint: "远处传来管家不紧不慢的脚步声，他正在循着动静靠近。"

items:
  servant_key:
    name: "仆役侧门钥匙"
    description: "艾拉交给你的小钥匙，可以打开档案室的仆役窄门。"
    portable: true
    consumable: false
  old_badge:
    name: "旧徽章"
    description: "薇拉保管的家族旧徽章，背面纹路像某种机关钥匙。"
    portable: true
    consumable: false
  maid_note:
    name: "侍女便签"
    description: "背面画着侧梯路线，并记录了艾拉闻到的纸灰味。"
    portable: true
    consumable: false
  forgery_evidence:
    name: "遗嘱篡改证据"
    description: "旧遗嘱、火漆差异和管家账本组成的关键证据。"
    portable: true
    consumable: false

initial_state:
  world:
    chapter: 1
    step: 0
    # 预算依据：最优钥匙路线 7 回合（见 walkthroughs），留 1 回合试错冗余。
    time_left: 8
    current_goal: "午夜前进入二楼档案室，找到能证明遗嘱被篡改的证据"
    evidence_status: intact
    archive_access: locked
    archive_door_unwatched: false
    storm_level: severe
  positions:
    player: great_hall
    butler: great_hall
    maid: great_hall
    guard: archive_door
    heir: great_hall
    drunk_guest: great_hall
  item_locations:
    servant_key: { type: carried_by, id: maid }
    old_badge: { type: carried_by, id: heir }
    maid_note: { type: carried_by, id: maid }
    forgery_evidence: { type: container, id: hidden_compartment }
  player:
    injury: 0
    exposed: false
    reputation: unknown
  scene:
    fire_risk: 0
    noise_level: 1
    crowd_attention: high
  flags:
    opening_delivered: false
    maid_warned_player: false
    guard_pattern_known: false
    butler_suspects_goal: false
    side_door_found: false
    hidden_compartment_found: false
    cabinet_weakness_found: false
    will_forgery_confirmed: false

characters:
  player:
    name: "见证人"
    role: player
    public_profile: "衣着得体、沉默谨慎，被老律师邀请到场。"
  butler:
    name: "洛维尔管家"
    role: antagonist_pressure
    public_profile: |
      黑松庄园的老管家，礼貌、克制、熟悉宅邸一切规矩。
      他总能在不提高音量的情况下让人感到压力。
    secret: "他协助篡改遗嘱，并准备在午夜销毁旧档案。"
    motivation: "维持大厅秩序，阻止任何人接近二楼档案室。"
    initial_state:
      suspicion: 2
      trust: 0
      knows_player_goal: false
  maid:
    name: "艾拉侍女"
    role: reluctant_helper
    public_profile: |
      年轻侍女，手指总是不自觉捏紧围裙边。
      她害怕管家，却仍试图保护老主人留下的真相。
    secret: "她看见管家在傍晚进入档案室，并听见纸张被翻动的声音。"
    motivation: "想提醒玩家，但不能让管家发现自己泄密。"
    initial_state:
      suspicion: 1
      trust: 2
      afraid: true
  guard:
    name: "布兰特守卫"
    role: obstacle
    public_profile: |
      退役军人，站在二楼东翼门口，做事按规矩来。
      他并不邪恶，但对职责和命令有近乎固执的服从。
    secret: "他欠管家一笔钱，因此不敢轻易违抗。"
    motivation: "守住档案室门，避免自己卷入遗产纠纷。"
    initial_state:
      alertness: 2
      trust: 0
      distracted: false
  heir:
    name: "薇拉小姐"
    role: emotional_stake
    public_profile: |
      老主人名义上的继承人，表面冷淡，实际已经意识到遗嘱有问题。
      她不信任任何人，尤其不信任突然出现的见证人。
    secret: "她保留着一枚老主人给她的旧徽章，可作为档案柜暗格的钥匙。"
    motivation: "保护自己，同时判断玩家是否值得信任。"
    initial_state:
      suspicion: 2
      trust: 0
  drunk_guest:
    name: "费恩先生"
    role: volatile_tool
    public_profile: |
      醉醺醺的远房亲戚，嘴上讽刺每个人，行动却容易被情绪带偏。
      他既可能成为麻烦，也可能成为可利用的混乱源。
    secret: "他偷听到管家和律师争吵过，但记忆混乱。"
    motivation: "证明自己没有被家族轻视。"
    initial_state:
      suspicion: 0
      trust: 0
      drunk_level: 3

# 玩家可感知的公开状态及其展示标签。
# 这是感知墙的内容侧声明：报价卡"预计影响"、状态栏、LLM 感知快照
# 只允许披露这里列出的键；未列出的状态（flags、他人位置、结局条件）
# 对玩家和理解 LLM 一律不可见。
perception:
  # 玩家知识日志在本故事中的称呼（引擎概念是 facts，词汇属于故事）。
  facts_label: "线索"
  world_state:
    time_left: "剩余时间"
  scene_state:
    fire_risk: "火势风险"
    noise_level: "动静"
    crowd_attention: "人群注意力"
  character_state:
    suspicion: "疑"
    alertness: "警"
    trust: "信"

# 报价卡上的世界内风险提示，条件语法与 storylet trigger 一致。
quote_warnings:
  - when:
      state_gte: { scene.fire_risk: 1 }
    text: "火势风险已存在，再生事端可能失控。"
  - when:
      state_gte: { butler.suspicion: 4 }
    text: "洛维尔管家已经高度怀疑你。"
  - when:
      state_gte: { guard.alertness: 4 }
    text: "布兰特守卫的警觉已经绷到极限。"

intents:
  observe:
    label: "观察"
    description: "调查人物、物品、环境或异常细节。"
    base_risk: low
    quote_required: false
    fallback_narrative: "你看得很仔细，暂时没有发现新的异常。"
    typical_cost:
      time_left: -1
  negotiate:
    label: "交涉"
    # 描述是理解 LLM 选择意图的唯一依据：任何"与人说话"类做法都应命中这里。
    description: "与人交谈、打听消息、说服、套话、安抚、交易或建立信任。"
    base_risk: medium
    quote_required: true
    fallback_proposal:
      npc_state: { key: trust, step: 1 }
    fallback_narrative: "对话在试探中结束。没有立刻的突破，但对方记住了你的态度。"
    typical_cost:
      time_left: -1
  sneak:
    label: "潜入"
    description: "绕开视线、靠近限制区域或进入档案室。"
    base_risk: high
    quote_required: true
    requires_storylet_match: true
    fallback_narrative: "你悄悄换了位置，没有引起注意，也还没找到突破口。"
    typical_cost:
      time_left: -1
  create_distraction:
    label: "制造混乱"
    description: "转移注意力、制造声响、引发争执或局部事故。"
    base_risk: medium
    quote_required: true
    fallback_proposal:
      state_patch: { scene.noise_level: 1 }
    fallback_narrative: "动静起来了，但还没有形成真正的机会。"
    typical_cost:
      time_left: -1
  threaten:
    label: "威胁"
    description: "施压、摊牌、用证据或风险迫使对方退让。"
    base_risk: high
    quote_required: true
    fallback_proposal:
      npc_state: { key: suspicion, step: 1 }
    fallback_narrative: "你的施压没有得到想要的反应。"
    typical_cost:
      time_left: -1
  custom:
    label: "自定义方案"
    description: "玩家提出非预设行动，由系统映射为最接近的结构化 action。"
    base_risk: variable
    quote_required: true
    fallback_narrative: "你的尝试产生了一些影响，但没有引出新的事件。"
    typical_cost:
      time_left: -1
  use:
    label: "使用"
    description: "使用口袋中的物品作用于当前人物、物品或环境。"
    base_risk: variable
    quote_required: true
    requires_storylet_match: true
    min_objects: 2
    typical_cost:
      time_left: -1
  move:
    label: "移动"
    description: "沿当前可用出口前往相邻区域。"
    base_risk: low
    quote_required: false
    engine_action: move
    typical_cost:
      time_left: -1

# 兜底判定白名单：玩家方案未命中任何 storylet 时，
# LLM 只能在这些路径和边界内提议状态变化，引擎负责裁剪。
# 关键剧情事实（证据、钥匙、场景、flags）全部 protected，只能由 storylet 改变。
resolution_limits:
  max_paths_per_action: 3
  patchable:
    butler.suspicion: { min: 0, max: 8, max_step: 2 }
    butler.trust: { min: 0, max: 5, max_step: 1 }
    maid.suspicion: { min: 0, max: 8, max_step: 2 }
    maid.trust: { min: 0, max: 5, max_step: 1 }
    guard.alertness: { min: 0, max: 6, max_step: 2 }
    guard.trust: { min: 0, max: 5, max_step: 1 }
    heir.suspicion: { min: 0, max: 8, max_step: 2 }
    heir.trust: { min: 0, max: 5, max_step: 1 }
    drunk_guest.trust: { min: 0, max: 5, max_step: 1 }
    drunk_guest.drunk_level: { min: 0, max: 5, max_step: 1 }
    scene.noise_level: { min: 0, max: 5, max_step: 2 }
    scene.fire_risk: { min: 0, max: 3, max_step: 1 }
    scene.crowd_attention: { values: [low, medium, high] }
    player.injury: { min: 0, max: 3, max_step: 1 }
  protected:
    - positions.*
    - item_locations.*
    - world.time_left
    - world.evidence_status
    - world.archive_access
    - world.archive_door_unwatched
    - player.exposed
    - flags.*

scenes:
  great_hall:
    name: "大理石大厅"
    purpose: "建立目标、展示人物关系、给玩家第一个可控行动空间。"
    goal: "找到进入二楼东翼档案室的第一条机会。"
    entry_text: |
      暴风雪把窗玻璃拍得发白。大厅中央的壁炉烧得很旺，
      但每个人都像坐在另一种寒意里。洛维尔管家宣布午夜前任何人不得离开大厅，
      二楼档案室将按老规矩封存。你知道，所谓封存意味着证据会消失。
    available_objects:
      items:
        oil_lamp: "油灯"
        curtains: "窗帘"
        medicine_box: "药箱"
        wine_tray: "酒盘"
        family_portrait: "全家画像"
      environment:
        fireplace: "壁炉"
        side_stair: "侧梯"
        rain_noise: "雨声"
        crowded_sofas: "拥挤的沙发区"
      states:
        time_pressure: "时间紧迫"
        crowd_attention: "人群注意力"
        butler_watching: "管家的注视"
    suggested_intents:
      - observe
      - negotiate
      - sneak
      - create_distraction
      - custom
    exit_conditions:
      any:
        - flags:
            side_door_found: true
        - flags:
            maid_warned_player: true
        - world_state:
            archive_door_unwatched: true

  servant_corridor:
    name: "仆役走廊"
    purpose: "让玩家通过侍女、侧门或药箱获得二楼机会。"
    goal: "绕开大厅视线，接近二楼东翼。"
    entry_text: |
      仆役走廊比大厅窄得多，墙上的煤油灯一盏接一盏向深处退去。
      风从某扇没关严的小窗钻进来，吹得门缝发出细声。这里没有宾客，
      但每一步都像会传到管家耳中。
    exits:
      - to: great_hall
        label: "返回大理石大厅"
        narrative_hint: "你沿侧梯退回大厅，重新混入宾客之间。"
    available_objects:
      items:
        medicine_box: "药箱"
        laundry_cart: "洗衣推车"
      environment:
        side_door: "仆役侧门"
        narrow_window: "窄窗"
        back_stairs: "后楼梯"
        rain_noise: "雨声"
      states:
        low_light: "光线昏暗"
        guard_patrol_nearby: "附近有守卫巡逻"
    suggested_intents:
      - observe
      - negotiate
      - sneak
      - move
      - custom
    exit_conditions:
      any:
        - inventory_all:
            - servant_key
        - flags:
            guard_pattern_known: true
        - world_state:
            archive_door_unwatched: true

  archive_door:
    name: "档案室门口"
    purpose: "核心门槛场景，集中验证判定公平感。"
    goal: "通过守卫、钥匙或混乱进入档案室。"
    entry_text: |
      二楼东翼的走廊比想象中更安静。档案室门上挂着黄铜铭牌，
      布兰特守卫站在门边，手按在腰侧。走廊尽头的阴影里，
      还有一扇供仆役搬运旧箱子的窄门，守卫的视线并不常落在那里。
      楼下大厅的声音在这里变得遥远，只剩钟摆一下一下敲着午夜。
    exits:
      - to: servant_corridor
        label: "返回仆役走廊"
        narrative_hint: "你沿后楼梯退回仆役走廊。"
      - to: archive_room
        label: "进入已打开的档案室"
        when:
          world_state:
            archive_access: open
        narrative_hint: "仆役窄门仍然开着，你重新进入档案室。"
    available_objects:
      items:
        key_ring: "钥匙环"
        sealed_notice: "封存告示"
        candle_stand: "烛台"
      environment:
        archive_door: "档案室正门"
        service_door: "仆役窄门"
        east_window: "东窗"
        service_bell: "仆役铃"
        shadowed_corner: "阴影角落"
      states:
        guard_alertness: "守卫警觉"
        butler_patrol: "管家巡查"
        time_pressure: "时间紧迫"
    suggested_intents:
      - observe
      - negotiate
      - sneak
      - create_distraction
      - threaten
      - use
      - move
      - custom
    exit_conditions:
      any:
        - world_state:
            archive_access: open
        - world_state:
            evidence_status: destroyed

  archive_room:
    name: "二楼档案室"
    purpose: "寻找证据，触发暗格或代价。"
    goal: "在管家赶到前找到遗嘱篡改证据。"
    entry_text: |
      档案室里有陈木、墨水和潮纸的气味。旧文件柜贴着年份标签，
      壁炉旁已经堆好一只铁皮焚烧箱。这里不是被封存的房间，
      而是一间等着被清空的房间。
    exits:
      - to: archive_door
        label: "退出档案室"
        narrative_hint: "你从仆役窄门退回档案室门口。"
    available_objects:
      items:
        old_will: "旧遗嘱"
        burned_edges: "烧焦的纸边"
        locked_cabinet: "上锁的文件柜"
        hidden_compartment:
          label: "暗格"
          visible_when:
            flags:
              cabinet_weakness_found: true
        wax_seal: "火漆印"
      environment:
        archive_shelves: "档案架"
        fireplace: "壁炉"
        tall_window: "高窗"
      states:
        evidence_nearby: "证据就在附近"
        butler_pursuit_risk: "管家可能循声赶来"
    suggested_intents:
      - observe
      - negotiate
      - threaten
      - use
      - move
      - custom
    exit_conditions:
      any:
        - inventory_all:
            - forgery_evidence
        - world_state:
            evidence_status: destroyed

  final_confrontation:
    name: "午夜摊牌"
    purpose: "根据证据、信任和暴露程度收束到结局。"
    goal: "决定玩家拿到的真相是否能被承认。"
    entry_text: |
      午夜钟声穿过整座庄园。所有人重新聚到大厅，火光把每张脸都切成明暗两半。
      现在问题不再是你能不能找到证据，而是谁会相信你，以及你为此付出了什么。
    available_objects:
      environment:
        fireplace: "壁炉"
        family_portrait: "全家画像"
        storm_windows: "风雪拍打的窗"
      states:
        public_attention: "众人注视"
        final_pressure: "最后的对峙"
    suggested_intents:
      - observe
      - negotiate
      - threaten
      - custom
    exit_conditions:
      any:
        - ending_reached: true

storylets:
  - id: opening_pressure
    title: "管家的午夜规矩"
    type: pressure
    attribution: world_beat
    once: true
    trigger:
      scene: great_hall
      flags:
        opening_delivered: false
    effect:
      set_flags:
        opening_delivered: true
      state_patch:
        butler.suspicion: +1
    narrative_hint: "管家公开强调午夜封存档案室，给玩家明确倒计时。"

  - id: observe_family_portrait
    title: "画像后的旧徽记"
    type: reveal
    once: true
    trigger:
      scene: great_hall
      intent: observe
      object_any:
        - family_portrait
        - heir
    effect:
      set_flags:
        old_badge_hint_seen: true
      state_patch:
        heir.trust: +1
    narrative_hint: "玩家注意到画像中老主人胸前的徽记，与薇拉小姐手袋上的压痕相似。"

  - id: maid_warning
    title: "侍女的低声提醒"
    type: reveal
    attribution: action_response
    once: true
    trigger:
      scene_any:
        - great_hall
        - servant_corridor
      intent: negotiate
      object_any:
        - maid
      npc_state:
        maid.trust_gte: 2
      world_state:
        evidence_status: intact
    effect:
      set_flags:
        maid_warned_player: true
        side_door_found: true
      move_items:
        maid_note: { type: carried_by, id: player }
      add_facts:
        - "艾拉看见管家在傍晚进入档案室。"
        - "她没看见管家出来时手里拿着什么，但闻到纸灰味。"
        - "便签背面画了一道侧梯的位置，通向仆役走廊。"
    narrative_hint: "侍女避开管家的视线，把一张折起的便签塞给玩家。"

  - id: find_side_stair
    title: "侧梯的走向"
    type: reveal
    once: true
    trigger:
      scene: great_hall
      intent_any:
        - observe
        - custom
      object_any:
        - side_stair
        - maid
    effect:
      set_flags:
        side_door_found: true
      add_facts:
        - "侧梯通向仆役走廊，晚宴期间几乎无人使用。"
    narrative_hint: "玩家注意到侍女每次都从侧梯的阴影里消失，那条路不经过大厅正门。"

  - id: slip_into_corridor
    title: "离开大厅的视线"
    type: progress
    once: false
    trigger:
      scene: great_hall
      intent_any:
        - sneak
        - custom
      # custom 承载所有自由文本行动，转场必须要求玩家指涉路线本身，
      # 否则"和薇拉聊天"这类无关自由行动也会触发离场。
      object_any:
        - side_stair
        - side_door
    effect:
      set_flags:
        side_door_found: true
      move_entities:
        player: servant_corridor
      state_patch:
        butler.suspicion: +1
    narrative_hint: "玩家借上茶的间隙退到侧梯阴影里，大厅的谈话声在身后合拢。"

  - id: drunk_guest_argument
    title: "醉客的争执"
    type: opportunity
    once: false
    trigger:
      scene: great_hall
      intent_any:
        - create_distraction
        - negotiate
      object_any:
        - drunk_guest
        - wine_tray
    effect:
      state_patch:
        scene.noise_level: +2
        butler.suspicion: +1
      temporary:
        duration_turns: 1
        state_patch:
          scene.crowd_attention: low
        set_world:
          archive_door_unwatched: true
    narrative_hint: "费恩先生被激怒后大声质问继承安排，短暂吸走大厅和楼梯口的注意力。"

  - id: controlled_fire
    title: "可控火情"
    type: opportunity_with_cost
    once: false
    trigger:
      scene_any:
        - great_hall
        - archive_door
      intent: create_distraction
      object_any:
        - oil_lamp
        - candle_stand
        - curtains
    effect:
      state_patch:
        scene.fire_risk: +1
        scene.noise_level: +2
        maid.suspicion: +1
        butler.suspicion: +1
      temporary:
        duration_turns: 1
        set_world:
          archive_door_unwatched: true
    narrative_hint: "火光窜起的一瞬，所有人本能地看向危险处；机会出现，但风险被记录。"

  - id: fire_gets_worse
    title: "火势失控边缘"
    type: consequence
    attribution: world_beat
    once: true
    trigger:
      state_gte:
        scene.fire_risk: 2
    effect:
      state_patch:
        player.exposed: true
        butler.suspicion: +2
      set_flags:
        butler_suspects_goal: true
    narrative_hint: "火势没有真的失控，但已经足够让管家记住玩家的位置和表情。"

  - id: guard_pattern
    title: "守卫的巡逻空隙"
    type: reveal
    once: true
    trigger:
      scene_any:
        - servant_corridor
        - archive_door
      intent: observe
      object_any:
        - guard
        - archive_door
        - service_bell
    effect:
      set_flags:
        guard_pattern_known: true
      state_patch:
        guard.alertness: -1
    narrative_hint: "守卫每次听见仆役铃都会下意识偏头，确认走廊另一端。"

  - id: climb_back_stairs
    title: "后楼梯上二楼"
    type: progress
    once: false
    trigger:
      scene: servant_corridor
      intent_any:
        - sneak
        - custom
      object_any:
        - back_stairs
    effect:
      move_entities:
        player: archive_door
    narrative_hint: "后楼梯的木板会响，玩家踩着雨声的间隙一步步靠近二楼东翼。"

  - id: maid_lends_key
    title: "侍女借出小钥匙"
    type: reward
    once: true
    trigger:
      scene: servant_corridor
      intent_any:
        - negotiate
        - observe
      object_any:
        - maid
        - medicine_box
      npc_state:
        maid.trust_gte: 3
      flags:
        maid_warned_player: true
    effect:
      move_items:
        servant_key: { type: carried_by, id: player }
      add_facts:
        - "这不是档案室正门钥匙，但能打开仆役侧门。"
    narrative_hint: "艾拉从药箱夹层取出小钥匙，避开视线塞进玩家掌心。"

  - id: heir_badge
    title: "薇拉的旧徽章"
    type: reward
    once: true
    trigger:
      scene: great_hall
      intent_any:
        - negotiate
        - observe
      object_any:
        - heir
      npc_state:
        heir.trust_gte: 2
    effect:
      state_patch:
        heir.trust: +1
      move_items:
        old_badge: { type: carried_by, id: player }
      add_facts:
        - "旧徽章背面的纹路像是某种暗格钥匙。"
    narrative_hint: "薇拉没有说相信玩家，只把徽章放在桌边，像是遗忘在那里。"

  - id: archive_entry_with_key
    title: "从侧门进入档案室"
    type: progress
    once: true
    trigger:
      scene: archive_door
      intent: use
      object_all:
        - servant_key
        - service_door
      inventory_all:
        - servant_key
    effect:
      set_world:
        archive_access: open
      move_entities:
        player: archive_room
      state_patch:
        guard.alertness: +1
    narrative_hint: "钥匙不是正门钥匙，却能打开一扇给仆役搬运旧箱子的窄门。"

  # 有意不含 create_distraction：制造混乱只打开一回合的机会窗口，
  # 玩家必须用下一个行动（潜入/自定义）主动利用它，否则窗口过期。
  - id: archive_entry_by_distraction
    title: "趁乱穿过东翼"
    type: progress
    once: true
    trigger:
      scene: archive_door
      intent_any:
        - sneak
        - custom
      object_any:
        - archive_door
        - service_door
        - shadowed_corner
      world_state:
        archive_door_unwatched: true
    effect:
      set_world:
        archive_access: open
        archive_door_unwatched: false
      move_entities:
        player: archive_room
      state_patch:
        butler.suspicion: +1
    narrative_hint: "守卫离开门边的时间短得几乎不算机会，但足够一个决心明确的人通过。"

  - id: hidden_compartment
    title: "档案柜暗格"
    type: reveal
    once: true
    trigger:
      scene: archive_room
      intent: use
      object_all:
        - old_badge
      object_any:
        - locked_cabinet
        - hidden_compartment
      inventory_all:
        - old_badge
    effect:
      set_flags:
        hidden_compartment_found: true
      set_world:
        evidence_status: secured
      move_items:
        forgery_evidence: { type: carried_by, id: player }
      add_facts:
        - "旧遗嘱上的火漆和新遗嘱不一致。"
        - "管家的账本记录了销毁档案的报酬。"
    narrative_hint: "旧徽章嵌入柜门凹槽时，暗格发出细小的弹响。"

  - id: evidence_without_badge
    title: "没有徽章的搜查"
    type: partial_progress
    once: true
    trigger:
      scene: archive_room
      intent: observe
      object_any:
        - locked_cabinet
      flags:
        hidden_compartment_found: false
      inventory_none:
        - old_badge
    effect:
      set_flags:
        cabinet_weakness_found: true
      state_patch:
        butler.suspicion: +1
      add_facts:
        - "暗格锁舌已经老化，细小坚硬的钥匙也许能把它撬开。"
    narrative_hint: "徽章不在手边，但玩家发现暗格锁舌已经松动；仆役钥匙或许能勉强撬开它。"

  - id: force_compartment_with_key
    title: "用仆役钥匙撬开暗格"
    type: opportunity_with_cost
    once: true
    trigger:
      scene: archive_room
      intent: use
      object_all:
        - servant_key
        - hidden_compartment
      inventory_all:
        - servant_key
      flags:
        cabinet_weakness_found: true
    director_hint: true
    effect:
      set_flags:
        hidden_compartment_found: true
      set_world:
        evidence_status: secured
      state_patch:
        player.exposed: true
        butler.suspicion: +1
      move_items:
        forgery_evidence: { type: carried_by, id: player }
      add_facts:
        - "变形的钥匙撬开暗格，也在锁舌上留下了明显划痕。"
    narrative_hint: "仆役钥匙在锁缝里弯了一下，暗格终于弹开；声音和划痕也暴露了玩家的行动。"

  - id: butler_catches_player
    title: "管家赶到"
    type: pressure
    attribution: world_beat
    once: true
    phase: after_world
    trigger:
      state_gte:
        butler.suspicion: 5
      scene_any:
        - archive_door
        - archive_room
      same_location:
        - butler
        - player
    effect:
      state_patch:
        player.exposed: true
      set_flags:
        butler_suspects_goal: true
    narrative_hint: "洛维尔管家没有奔跑，只是准时出现在走廊尽头，像早知道玩家会在这里。"

  - id: midnight_destruction
    title: "午夜焚毁"
    type: failure_pressure
    attribution: world_beat
    once: true
    trigger:
      state_lte:
        world.time_left: 0
      inventory_none:
        - forgery_evidence
    effect:
      set_world:
        evidence_status: destroyed
      move_items:
        forgery_evidence: { type: removed }
      move_entities:
        player: final_confrontation
        butler: final_confrontation
        maid: final_confrontation
        guard: final_confrontation
        heir: final_confrontation
        drunk_guest: final_confrontation
    narrative_hint: "午夜钟声响起时，档案室方向传来纸张卷曲的焦味。"

  # 必须排在 hidden_compartment 之后、final_truth 之前：
  # 拿到证据的同一回合级联进入终幕（单遍扫描语义，见 content-schema.md 10.3）。
  - id: midnight_gathering
    title: "午夜集合"
    type: progress
    attribution: world_beat
    once: true
    trigger:
      scene: archive_room
      inventory_all:
        - forgery_evidence
    effect:
      move_entities:
        player: final_confrontation
        butler: final_confrontation
        maid: final_confrontation
        guard: final_confrontation
        heir: final_confrontation
        drunk_guest: final_confrontation
    narrative_hint: "证据到手的同时，午夜钟声把所有人重新召回大厅，没有人能再假装无事发生。"

  - id: final_truth
    title: "证据摊牌"
    type: ending_route
    attribution: world_beat
    once: true
    trigger:
      scene: final_confrontation
      inventory_all:
        - forgery_evidence
    effect:
      set_flags:
        will_forgery_confirmed: true
    narrative_hint: "玩家把证据放到众人面前，火光照亮旧遗嘱上的蜡印。"

endings:
  truth_exposed:
    title: "真相曝光"
    priority: 1
    conditions:
      positions.player: final_confrontation
      item_locations.forgery_evidence.id: player
      player.exposed: false
      heir.trust_gte: 2
    outcome: |
      薇拉公开承认证据与父亲留下的旧物一致，侍女也鼓起勇气作证。
      管家的体面在午夜后崩塌，玩家以最小代价保住了真相。

  costly_victory:
    title: "代价胜利"
    priority: 2
    conditions:
      positions.player: final_confrontation
      item_locations.forgery_evidence.id: player
    outcome: |
      玩家拿到了证据，但过程留下了火情、怀疑或公开冲突。
      真相没有被毁掉，可玩家也成为庄园里被记住的人。

  evidence_destroyed:
    title: "证据被毁"
    priority: 3
    conditions:
      positions.player: final_confrontation
      world.evidence_status: destroyed
      item_locations.forgery_evidence.id_ne: player
    outcome: |
      核心档案在午夜被烧毁。玩家没能阻止这件事，
      但仍可能带走侍女便签、醉客证词或暗格线索，为坏结局后的续章留下希望。

authoring_notes:
  content_scope:
    scenes: 5
    storylets: 21
    endings: 3
  production_log:
    stage_1_started_at: "2026-07-08"
    stage_1_revised_at: "2026-07-09"
    revision_notes: >
      评审修订：补齐场景转场 storylet（find_side_stair / slip_into_corridor /
      climb_back_stairs / midnight_gathering，此前场景图不连通）；
      exit_conditions 改结构化条件；临时效果改 temporary 块；
      新增 resolution_limits 与 quote_required；time_left 6 -> 8
      （最优路线 7 回合 + 1 回合冗余）；schema v2 用世界图和唯一 positions
      取代静态在场名单；新增唯一 item_locations、显式使用、返回出口，
      以及无徽章时用仆役钥匙强开暗格的有代价补救路线。
    source: "原创短篇；只参考 Open-Theatre 的场景/角色/动机组织方式，不使用其已有 IP 内容。"
