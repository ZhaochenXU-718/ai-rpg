# =====================================================================
# AIRPG 故事模板（content_profile: narrative_first / schema_version: 2）
#
# 填写指南：
#   - 把所有空字符串 "" 填上实际内容；标注 [可选] 的整块不需要可整块删除。
#   - 机器 ID 格式：小写字母开头，只含小写字母、数字、下划线（如 owl_post_office）。
#   - 校验：python tools/validate_content.py content/templates/story_template.yaml
#   - 本文件是手写参考模板。复制为 content/drafts/<故事id>.yaml 并填入
#     有效的机器 ID 后，会出现在故事工作室中，可继续编辑、试玩和发布。
#     （工作室首次保存会统一格式化，本文件的注释不会保留。）
#
# 路由标记（该字段内容最终被谁看到）：
#   [玩家]     玩家在界面上直接看到的文案
#   [旁白]     进入旁白（叙事生成）prompt
#   [提案]     进入行动提案（ideas）prompt
#   [账本]     进入权威物理状态，由代码守护，模型不能直接修改
#   [不进模型] 任何模型调用都看不到
# =====================================================================


# ---------------------------------------------------------------------
# 一、身份与元数据（必填）
# ---------------------------------------------------------------------

content_profile: narrative_first  # 固定值，标识这是活动内容
schema_version: 2                 # 固定值
id: ""                            # 故事机器 ID；也是存档与 trace 中的故事标识
title: ""                         # [玩家] 故事标题，开场第一行展示
version: 0.1.0                    # 内容版本号，作者自行维护
language: zh-CN                   # 内容语言
genre: ""                         # 创作者可读的题材摘要；由工作室根据题材标签维护
# genre_tags:                     # 可选结构化标签；用于故事库筛选，不触发引擎专属规则
#   - "奇幻"
#   - "悬疑"

# 以下纯说明字段可自由保留，运行时与校验器都不读取：
# design_goal: "这个故事想验证什么"
# authoring_notes: "创作过程备忘"


# ---------------------------------------------------------------------
# 二、玩家文案层
# ---------------------------------------------------------------------

# [玩家] 开场引子（背景交代），游戏启动时只渲染一次：你为什么在这里、
# 刚发生了什么、此刻的处境。启动画面的渲染顺序是
# 《title》→ premise → 起始场景名 → entry_text → opening_narration，
# 连起来读就是玩家的"开场第一屏"。
# 注意：premise 不进入每回合 prompt——持续影响生成的是下面的 ai_plot。
# 单一开场不需要 openings 字段：起始位置由 initial_state.positions 决定。
premise: |
  ""

# [玩家][旁白] 开场正文：人写的"小说第一段"，建议 300-500 字。两个作用：
#   1. 启动时渲染在 entry_text 之后一次，是玩家读到的第一段正文；
#   2. 每回合作为文风与事实锚进入旁白的作者私有上下文——给模型"起头"的
#      示范散文，让它续写而非冷启动，也比形容词更抗长程漂移。
# 写作纪律：只写已经发生的事实；结尾停在开放局面；不替玩家做任何动作或
# 说任何话（玩家的第一个输入要从这里接下去）。[可选，强烈建议填]
opening_narration: |
  ""

# [玩家][不进模型] 一句话简介（故事列表/宣传位用）。有快照测试保证
# 它绝不进入任何模型调用，所以可以放心写吊胃口的悬念文案。[可选]
player_facing_summary: ""


# ---------------------------------------------------------------------
# 三、AI 指令层（给模型的私有材料，玩家永远看不到原文）
# ---------------------------------------------------------------------

# [旁白][提案] 情绪承诺：希望玩家在整个游玩过程中持续获得什么感受，
# 以及靠什么叙事手法维持它。这是全故事最上游的决定。[可选，强烈建议填]
emotional_contract: ""

# [旁白] AI 剧情蓝图，每回合进入旁白的作者私有上下文。
# 只接受下面五个键，写错键名校验器会报错（防止保密内容因笔误漏进提案）。
# 其中 hidden_truth 之外的四项会脱敏后作为"故事方向"进入 [提案]。[可选，强烈建议填]
ai_plot:
  player_role: ""    # 玩家在故事中的角色与处境
  main_goal: ""      # 主要目标和核心矛盾
  opposition: ""     # 对抗力量或阻力来源（不一定是反派）
  world_rules: ""    # 世界规律；采用知名世界观时写"遵循××正典 + 本故事的特别限制"
  hidden_truth: ""   # 作者知道、玩家开场不应知道的真相。只进旁白，绝不进提案

# [旁白] 叙述规则：视角、语气、节奏、关系处理尺度等。逐条短句。[可选]
narrative_guidelines:
  - ""

# [旁白] 最高优先级防漂移规则，旁白每回合必须遵守。
# 最多 4 条，超出校验器报错——刻意保持"极少量、高权重"。[可选]
critical_reminders:
  - ""


# ---------------------------------------------------------------------
# 四、玩家角色（必填）
# ---------------------------------------------------------------------

player_role:
  id: player            # 玩家角色机器 ID，须与 characters 中的条目对应
  name: ""              # [玩家] 玩家角色名
  private_goal: ""      # 玩家的私人目标。校验必填；当前运行时未直接消费，
                        #   作为创作参考（长线看会并入 ai_plot.player_role）
  constraints:          # [旁白][提案] 作为"世界边界"进入 prompt 的表达约束，
    - ""                #   如"不能凭空获得物品"。是创作约束，不会变成代码规则


# ---------------------------------------------------------------------
# 五、文风与全局边界（必填）
# ---------------------------------------------------------------------

# [旁白] 整个映射作为"文风约束"进入旁白 prompt。键名自由，惯用键如下。
style_bible:
  tone: ""       # 语气基调，如"克制、日常"
  camera: ""     # 镜头纪律，如"只写当前场景可见的事物"
  dialogue: ""   # 对白风格
  avoid:         # 明确不要出现的写法
    - ""

# [旁白][提案] global_rules.boundaries 与 player_role.constraints 合并后
# 作为"世界边界"进入两个 prompt。写世界级的软约束。
global_rules:
  boundaries:
    - ""


# ---------------------------------------------------------------------
# 六、人物（必填；玩家一张卡 + 每个 NPC 一张卡）
# ---------------------------------------------------------------------
# 人物卡是"摆脱机械感"的主战场。除 public_profile 外的所有字段都是
# 作者私有材料：只在该人物【在场】时进入旁白的作者私有上下文，用于扮演；
# 不进玩家感知、不进提案、不进事实抽取，也不代表玩家已知。
# 旁白的纪律是"知道秘密但不得说破"——秘密驱动回避、迟疑、撒谎，
# 而不是被复述。

characters:

  player:                 # 键须与 player_role.id 一致
    name: ""              # 同 player_role.name
    role: player          # 玩家卡的 role 固定写 player
    public_profile: ""    # [玩家][旁白][提案] 场景中他人可见的玩家形象

  npc_example:            # ← 改成实际 NPC 的机器 ID；按人物数量复制本块
    name: ""              # [玩家] 人物显示名
    role: ""              # 故事职责标签（如 shop_keeper），元数据
    public_profile: ""    # [玩家][旁白][提案] 该人物在场时玩家看到的公开形象
    # ---- 以下为必填的私有三件套 [旁白·在场时] ----
    motivation: ""            # 人物为什么行动：想要什么、害怕什么
    voice: ""                 # 人物怎样说话：句式、习惯、态度
    initial_relationship: ""  # 人物如何看待玩家（初始）
    # ---- 以下私有字段可选，按人物深度取舍 [旁白·在场时] ----
    secret: ""                # 人物知道但玩家未必知道的事；写清"愿意在什么条件下透露"
    pressure: ""              # 什么内外压力正迫使人物改变或紧绷
    behavior: ""              # 动机遇到压力后的可推导行为模式（含矛盾点）
    mannerisms: ""            # 习惯动作、小癖好，帮旁白写出辨识度
    narration_notes: ""       # 给旁白的专门表演说明（"这个人物绝不会……"）
    dialogue_examples:        # 一两句示例对白，锚定口吻
      - ""


# ---------------------------------------------------------------------
# 七、场景（必填；建议 3-5 个）
# ---------------------------------------------------------------------

scenes:

  scene_example:          # ← 改成实际场景机器 ID；按场景数量复制本块
    name: ""              # [玩家][旁白] 场景显示名
    purpose: ""           # [不进模型] 创作说明：这个场景为什么存在、验证什么
    goal: ""              # [玩家][旁白][提案] 当前叙事的"开放方向"。
                          #   注意语义：是方向不是任务，不写完成条件
    entry_text: ""        # [玩家][旁白] 场景描写。注意：玩家【每次】进入该场景
                          #   都会重新渲染（中途离开再回来也会），所以只写任何
                          #   时候进来都成立的内容；一次性的开场叙述（"你第一次
                          #   推开这扇门"）属于 premise，不要写在这里
    exits:                # [玩家][旁白][提案] 可见的导航选项；纯提示，无条件判断
      - to: scene_example_b   # 目标场景 ID，必须存在
        label: ""             # 出口显示文字，如"去后院"
    available_objects:    # [玩家][旁白][提案] 场景中的静态可见对象（环境陈设等）
      environment:        # 组名自由（environment/states…）；条目为 id: 显示标签
        object_example: ""

  scene_example_b:
    name: ""
    purpose: ""
    goal: ""
    entry_text: ""
    exits:
      - to: scene_example
        label: ""
    available_objects:
      environment:
        object_example_b: ""


# ---------------------------------------------------------------------
# 八、关键物品与物理初值
# ---------------------------------------------------------------------
# 纪律：只把"归属变化对剧情真正重要"的 1-3 件物品建模进账本。
# 普通杯子、食物、装饰不要建模——那是旧机械感的来源。

# [账本][玩家·可见时] 关键物品定义。[可选，没有关键物品可整块删除]
items:
  item_example:                 # ← 改成实际物品机器 ID
    name: ""                    # 显示名
    description: ""             # 玩家可见描述
    portable: true              # 是否可携带（布尔，必填）
    consumable: false           # 是否消耗品（当前仅元数据）
    visible_when_carried: false # 被人携带时旁人是否可见。
                                #   贴身信物写 false，大件物品写 true

# [账本] 权威物理初值。只允许 positions 与 item_locations 两个键。
# positions 必须覆盖所有人物；item_locations 必须覆盖所有物品。
initial_state:
  positions:
    player: scene_example       # 每个人物 → 所在场景 ID
    npc_example: scene_example
  item_locations:
    item_example: { type: carried_by, id: npc_example }
    # 两种放置格式：
    #   { type: carried_by, id: <人物ID> }  由某人携带
    #   { type: board, id: <场景ID> }       放在某个场景中


# ---------------------------------------------------------------------
# 九、剧情模块（[可选]；正式故事建议 12-16 个）
# ---------------------------------------------------------------------
# 模块 = 一段"可能发生的戏"：发生什么 + 何时适合出现。不是分支脚本、
# 不是任务、没有任何状态效果（effects/when/state_patch 会被校验器拒绝）。
# 编排器（纯代码）按类别策略/冷却/在场实体筛出至多 3 个候选交给旁白，
# 旁白可编织其钩子也可不用；玩家忽略 3 次后自动消退。
#
# category 五类（功能枚举）及编排差异：
#   main      主线关键场次；冷却 2 回合；可用时保底占一个候选席位
#   character 人物/关系深化；冷却 3 回合
#   pressure  外部压力事件；冷却 6 回合；最早第 6 回合才出现
#   aftermath 此前选择的余波；冷却 4 回合；通常配 requires 解锁
#   side      支线/世界肌理；冷却 5 回合；优先级最低
# 题材化分类（约会/战斗…）用 tags 表达，引擎不解析 tags。
# 建议配比：main 4-5，character 4-6（每个主要 NPC ≥2），pressure 2-3，
#           aftermath 2-3，side 1-2。

modules:

  module_example:             # ← 改成实际模块机器 ID；按模块数量复制本块
    category: character       # 必填：main | character | pressure | aftermath | side
    title: ""                 # 必填：模块名（memory 命令里显示）
    purpose: ""               # 必填 [旁白·候选时]：这段戏在故事中的作用
    hook: ""                  # 必填 [旁白·候选时]：抛给玩家的钩子怎么写
    trigger: ""               # 必填 [旁白·候选时]：什么时候适合出现（自然语言，
                              #   由旁白判断；编排器不解析这句话）
    involves: []              # [可选] 涉及的人物/物品/场景 ID 列表；
                              #   填了则至少一个在场才会成为候选
    escalation: ""            # [可选] 玩家接住钩子后往哪升级
    resolution: ""            # [可选] 怎样算收尾
    fallback: ""              # [可选] 玩家忽略时如何自然消退
    repeatable: false         # [可选] 收尾后是否还能再次出现，默认 false
    cooldown_turns: 4         # [可选] 两次抛出的最小间隔，默认由类别决定
    min_turn: 1               # [可选] 最早出现回合，默认由类别决定
    priority: normal          # [可选] low | normal | high，默认 normal
    tags: []                  # [可选] 自由标签，引擎不解析
    # requires:               # [可选] 结构性依赖：其他模块到达某软状态后才解锁。
    #   - module: other_module_id
    #     status: resolved    # offered | engaged | resolved | dropped
    #   满足按进度包含：offered 表示"抛出过即可"（零时延，代码即时标记）；
    #   engaged 被 engaged/resolved 满足；resolved/dropped 精确匹配。
    #   选用原则：顺承关系用 trigger 语义或 offered；engaged/resolved 依赖
    #   M2 记账（有时延），只留给"绝不能提前出现"的硬门槛（如终局、剧透）。


# ---------------------------------------------------------------------
# 十、多开场（[可选]；只有一个开场时整块删除）
# ---------------------------------------------------------------------
# 本字段只为"多起点"存在。单一开场不需要它——开场由三样已有的东西拼成：
#   起始位置 = initial_state.positions；一次性引子 = premise；
#   场景描写 = 起始场景的 entry_text。
# 定义多开场时，每个开场只覆盖初始位置并附加一段引导文字（intro 接在
# premise 和场景描写之后渲染）；进入游戏后所有开场走同一管线。
# CLI 用 --opening <id> 选择；不传则用 initial_state 的默认位置。

openings:
  opening_example:            # ← 改成实际开场机器 ID
    title: ""                 # 开场名（给选择界面用）
    intro: ""                 # [玩家][可选] 该开场专属的引导文字，接在开场渲染之后
    positions:                # [账本] 覆盖 initial_state.positions 中的对应条目
      player: scene_example_b
