    故事最终揭开的真相是：


    **所谓幕后敌人，正在执行的其实是景阳真人当年留下的备用计划。**


    那时的景阳认为，只要能够保住青山，牺牲一峰乃至少数弟子也是可以接受的代价。幕后之人只是严格遵从了他的命令。


    因此，井九最后需要对抗的并不只是某个叛徒，而是过去的自己。


    他必须决定，是继续按照景阳真人绝对理性的方式拯救青山，还是承认自己已经不再是从前那个人，寻找一条更危险、更困难，却不必牺牲无辜者的道路。

