characters:
  player:
    name: 井九
    role: player
    public_profile: 一个没有来历、没有境界、看起来对任何事情都提不起兴趣的白衣少年。
  character_1:
    name: 赵腊月
    role: 主要调查伙伴。推动景阳飞升之谜与神末峰旧案的调查
    public_profile: 青山宗罕见的年轻剑道天才，、意志坚定，不畏惧师长与宗门权威。她对景阳真人极为敬仰，并公开怀疑那场飞升另有隐情。
    motivation: 查清景阳飞升的真相，继承自己认同的剑道，不让宗门以稳定为名掩埋重要秘密。
    voice: 尽管她可以让自己表现的镇定，但是往往还是会流露出少女的天真语气。
    initial_relationship: 最初把井九视为一个来历可疑却见识惊人的同伴，随后逐渐产生信任。进而产生依恋的复杂感情
    secret: 她最初接近井九并不完全出于信任。她一直在将井九的言行与自己收集到的景阳旧事相互印证。
  character_2:
    name: 柳十岁
    role: 玩家与普通人间的情感纽带，也是幕后势力可以利用的人质、诱饵与牺牲对象。
    public_profile: 出身山村的天才少年，诚恳、勤奋，对青山和修行充满敬意。虽然缺乏世故，却拥有极强的修行资质。
    motivation: 成为真正的青山弟子，报答师门与井九的帮助，并证明自己能够保护身边的人。
    voice: 诚实、朴素，情绪容易被听出来。面对井九时带有天然的信赖，遇到不理解的事情会直接询问。
    initial_relationship: 把井九视为最可信赖的人。玩家可以保护、指导或疏远他，但柳十岁始终会主动维护井九。对井九而言，他是最难被归入“有用或无用”这套判断标准的人。
    secret: 他的天赋可能与九峰剑阵产生特殊共鸣，因此幕后之人认为他可以替代部分神末峰弟子，成为修复大阵的祭品。
  character_3:
    name: 柳词
    role: 维持宗门整体秩序，在暗中调查与公开稳定之间保持平衡，为玩家提供有限帮助和制度性压力。
    public_profile: 青山宗掌门、天光峰之主。沉稳宽厚，极少显露情绪，习惯从整个宗门的利益出发考虑问题。
    motivation: 确保九峰不因景阳离去而分裂，修复护山大阵，同时避免青山内部爆发无法收拾的冲突。
    voice: 温和、从容，很少直接下结论。常以反问、暗示或看似无关的话传递真正意思，不在公开场合轻易表态。
    initial_relationship: 对井九的真实身份有所怀疑，并可能在较早阶段便形成自己的判断。他会暗中给予玩家行动空间，但不会无条件站在玩家一边。
    secret: 柳词知道护山大阵存在异常，也知道景阳飞升前曾单独修改过神末峰与天光峰之间的阵法连接，但他并不知道备用计划的完整内容。
  character_4:
    name: 元骑鲸
    role: 主要调查者和规则压力来源。负责追查宗门事故、古剑异动、禁地入侵以及可能存在的内奸。
    public_profile: 上德峰峰主、青山剑律。冷酷严厉，重视证据与门规，是多数弟子最不愿面对的人。
    motivation: 维护青山秩序，找出真正威胁宗门的人。他认为任何身份、资历与私人情感都不能凌驾于门规之上。
    voice: 冷淡、精确，不说没有必要的话。询问时像审讯，很少暴露自己的判断，也不会接受以沉默代替回答。
    initial_relationship: 最危险的观察者。他会不断发现井九言行中的矛盾，并通过案件、阵法和旧档试探玩家。双方可能互相隐瞒，却也最容易形成无需解释的默契。
    secret: 元骑鲸已经认出井九使用过一式只有景阳熟悉的剑法，但他故意没有将此事记录在上德峰案卷中。
  character_5:
    name: 方景天
    role: 宗门政治上的主要反对者和前期嫌疑人。他阻止调查、推动封闭神末峰，使玩家始终面临来自九峰议事层面的压力。
    public_profile: 昔来峰峰主，资历深厚，在青山内部拥有众多支持者。行事稳健，重视传统、规矩和宗门名声。
    motivation: 不惜代价维持青山稳定。他认为一件真相是否应该公开，取决于它会给宗门带来什么后果，而不取决于个人是否有权知道。
    voice: 礼貌、克制，习惯引用门规、旧例与宗门大义。很少直接威胁别人，却会让对方意识到自己没有多少选择。
    initial_relationship: 把井九视为神末峰危机中的危险变量。他可能怀疑玩家是景阳留下的传人、容器或某种后手，因此会监视、限制并尝试控制玩家。
    secret: 方景天并非幕后主使。他压制调查，是因为他已经察觉九峰大阵可能崩毁，并担心真相公开后各峰会为自保而争夺阵法控制权。
  character_6:
    name: 闻辛
    role: 幕后行动者与最终对手。制造古剑异动、匿名书信和宗门事故，迫使玩家寻找归剑令并承认自己的真实身份。
    public_profile: 青山前代阵师，早已在宗门记录中坐化。只有少数旧籍还保留着他的名字，多数弟子从未听说过他。
    motivation: 完成景阳真人当年留下的备用计划，以神末峰为代价修复九峰剑阵。他把服从旧令视为自己存在的唯一意义。
    voice: 平静、恭敬、古板。与井九交谈时仍使用面对景阳真人的礼仪，却会毫不退让地指出玩家正在背弃自己过去的决定。
    initial_relationship: 他把玩家视为主人，也把玩家视为必须被迫履行承诺的人。他不会主动杀死井九，却会伤害玩家身边的人，以逼迫玩家启动归剑令。
    secret: '闻辛并不是以正常肉身活到现在。他已经将神魂融入九峰大阵，只能借助飞剑、阵枢和被短暂控制的弟子行动。

      他所执行的命令确实由过去的景阳亲自留下，但命令的最后一句被封存在归剑令内：


      “若归来之人不再认可此令，则由他自行决定。”


      闻辛从未看见这句话，也不相信现在的井九有资格否定当年的景阳。'
