    隐藏在青山内部的势力并非单纯想夺取景阳的遗产。他们早已发现剑阵正在崩坏，却认为青山不能承受真相公开后的混乱。于是，他们决定牺牲神末峰，将神末峰积存的全部剑意以及峰中之人炼入大阵，永久修补九峰。


