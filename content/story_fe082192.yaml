premise: '人间尚有旧剑

  朝天大陆已经太平了很多年。

  至少凡人是这样认为的。

  南方青山连绵数千里，九峰隐在云海之间，青山宗仍是天下剑道之首。北方中州派底蕴深厚，与青山遥遥相对；朝歌城里的神皇统御人间，却也必须在各大修行宗派之间维持微妙的平衡。果成寺不问俗务，水月庵避世清修，风刀教镇守北境。更远处的雪原寒雾终年不散，雪国妖物很少南下；地底冥部也已经许久没有发动真正的战争。

  就在这种平静中，青山宗的景阳真人飞升了。

  世人看见一道剑光斩开天空，认为那位数百年来最接近大道的强者已经离开人间。青山宗为此封闭神末峰，修行界开始重新估量彼此的力量，朝歌城中的权贵则暗自庆幸：一位几乎无人能够制衡的强者终于不在了。

  只有极少数人怀疑，那场飞升并没有真正成功。

  景阳确实离开了原来的身体，却没有抵达传说中的彼岸。飞升之时发生了意外，他不得不以自己的神魂与万物一剑相合，重新化作一个名为井九的少年。

  从那一天起，世间少了一位景阳真人，多了一个没有来历、没有境界、看起来对任何事情都提不起兴趣的白衣少年。


  井九在山村里住了一年。

  这一年里，他晒太阳、吃火锅、看云，很少修行。在村民眼中，他容貌过于出众，性情却懒散得不可救药。只有名叫柳十岁的少年隐约知道，井九并不像看上去那样普通。井九能够一眼看出山石的纹理、剑招的破绽以及人体经脉中最细微的问题，仿佛这世间没有什么真正完整的东西，只要他愿意，总能找到可以被切断的那一点。


  但井九并非无所不能。

  他现在的身体近乎一柄活着的剑，坚固、纯粹，却也异常危险。过去属于景阳真人的境界已经不复存在，他必须从最初的修行阶段重新开始。更重要的是，在弄清飞升失败的真正原因之前，他不能让天下人知道景阳还活着。

  因为想让景阳消失的人，未必只有一个。


  因此，当青山宗仙师来到山村、准备带走天生道种柳十岁时，井九决定同行。

  在旁人看来，这只是一个没有修行天赋的懒散少年，借着同乡的机会进入青山外门。

  对井九而言，这是一次归山。


  他要重新走过自己曾经走过的道路，确认哪些人仍然可信，找出藏在青山里的那只手，并取回某件被人从神末峰带走的东西。

  他并不打算拯救天下。

  天下太大，也太麻烦。

  但如果有人试图利用他的死改变青山，或者把他已经斩断的旧事重新接起来，他便会找到那件事最薄弱的地方，然后像从前一样，一剑切断。

  故事便从井九走进青山山门的那一天开始。

  山门之内，所有人都在谈论已经飞升的景阳真人。

  没有人知道，景阳正在他们身边。'
player_role:
  id: player
  name: jing jiu
  public_identity: 一个初入青山、境界低微、性情懒散的年轻弟子
  private_goal: '第一，查明自己飞升失败的真正原因。

    第二，找回被人从神末峰带走的神秘旧物。

    第三，确认青山宗内部究竟是谁知道他仍然活着，并阻止对方利用景阳真人留下的身份、秘密和因果改变青山。'
  constraints:
  - 第一，九峰之间可以竞争，但不能轻易公开互相残杀。任何同门死亡都会引发上德峰调查。
  - 第二，不同山峰并非可以自由出入。洞府、禁地、剑阵与峰主居所都有权限限制，井九即使知道道路，也不能在众目睽睽之下随意穿行。
  - 第三，剑会留下痕迹。剑意、剑伤、御剑习惯和功法特征都可能暴露凶手所属山峰，也可能被人故意伪造。
  - 第四，高境界人物不能随意出手。峰主级强者的一次行动，会立刻被其他山峰、护山大阵和外部宗派察觉。
  - 第五，井九最大的优势不是当前境界，而是他认识青山的每一套剑法、每一条旧路和许多已经被人遗忘的秘密。
  - 第六，井九最大的限制也来自这种熟悉。他越自然地使用这些知识，就越容易让故人意识到：这个年轻弟子知道了太多只有景阳真人才应该知道的事情。
