<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIRPG</title>
<style>
  :root {
    --bg: #f6f4ee;
    --panel: #fffdf8;
    --ink: #2b2721;
    --muted: #8a8378;
    --line: #e3ddd0;
    --accent: #7a5c3d;
    --error: #a4432f;
    --dev-bg: #eef2eb;
    --dev-line: #b7c2b2;
    --dev-ink: #40513e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
    line-height: 1.9;
    font-size: 16px;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .head-inner {
    max-width: 44rem; margin: 0 auto; padding: 0.6rem 1rem;
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
  }
  .title { font-weight: 700; letter-spacing: 0.05em; }
  .status {
    font-family: system-ui, sans-serif; font-size: 0.78rem;
    color: var(--muted); display: flex; gap: 0.9rem; flex-wrap: wrap;
  }
  .dev-mode {
    color: var(--dev-ink); border: 1px solid var(--dev-line);
    background: var(--dev-bg); border-radius: 99px;
    padding: 0 0.5rem;
  }
  main {
    max-width: 44rem; margin: 0 auto;
    padding: 1.2rem 1rem 9.5rem;
  }
  .block { white-space: pre-wrap; overflow-wrap: break-word; }
  .block + .block { margin-top: 1.1rem; }
  .intro { color: #48423a; }
  .player {
    font-family: system-ui, sans-serif; font-size: 0.92rem;
    color: var(--accent);
    border-left: 3px solid var(--accent);
    padding: 0.15rem 0 0.15rem 0.8rem;
  }
  .player::before { content: "你 · "; color: var(--muted); }
  .narrative.streaming::after {
    content: "▍"; color: var(--accent);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .withdrawn { opacity: 0.4; }
  .notice {
    font-family: system-ui, sans-serif; font-size: 0.82rem;
    color: var(--muted);
  }
  .notice.error { color: var(--error); }
  .tail {
    font-family: system-ui, sans-serif; font-size: 0.82rem;
    color: var(--muted);
  }
  .editor-comparison {
    width: min(68rem, calc(100vw - 2rem));
    margin: 1rem 0 1.4rem 50%; transform: translateX(-50%);
    border: 1px solid var(--dev-line); border-radius: 12px;
    background: var(--dev-bg); color: var(--dev-ink);
    overflow: hidden;
  }
  .editor-comparison-head {
    padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--dev-line);
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.7rem; flex-wrap: wrap;
    font-family: system-ui, sans-serif; font-size: 0.78rem;
  }
  .editor-comparison-title { font-weight: 650; letter-spacing: 0.03em; }
  .editor-comparison-badges { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .editor-chip {
    border: 1px solid var(--dev-line); border-radius: 99px;
    background: color-mix(in srgb, var(--panel) 70%, transparent);
    padding: 0.05rem 0.45rem;
  }
  .editor-grid {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1px; background: var(--dev-line);
  }
  .editor-pane { background: var(--panel); min-width: 0; }
  .editor-pane.selected { box-shadow: inset 0 0 0 2px var(--dev-ink); }
  .editor-pane-label {
    padding: 0.35rem 0.65rem; border-bottom: 1px solid var(--line);
    font-family: system-ui, sans-serif; font-size: 0.75rem;
    color: var(--muted); display: flex; justify-content: space-between;
  }
  .editor-pane-label .selected-mark { color: var(--dev-ink); font-weight: 650; }
  .editor-pane-text {
    min-height: 7rem; padding: 0.7rem 0.8rem;
    white-space: pre-wrap; overflow-wrap: break-word;
    color: var(--ink); line-height: 1.8;
  }
  .editor-comparison-meta {
    padding: 0.55rem 0.75rem; border-top: 1px solid var(--dev-line);
    font-family: system-ui, sans-serif; font-size: 0.75rem;
    line-height: 1.65; color: var(--dev-ink);
  }
  @media (max-width: 720px) {
    .editor-grid { grid-template-columns: 1fr; }
    .editor-pane-text { min-height: 0; }
  }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter: blur(6px);
    border-top: 1px solid var(--line);
  }
  .input-inner {
    max-width: 44rem; margin: 0 auto; padding: 0.7rem 1rem 0.9rem;
    display: flex; gap: 0.6rem; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none;
    font: inherit; font-size: 0.95rem; line-height: 1.6;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 0.55rem 0.8rem; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    font-family: system-ui, sans-serif; font-size: 0.9rem;
    border: 1px solid var(--accent); border-radius: 10px;
    background: var(--accent); color: #fff;
    padding: 0.5rem 1rem; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  /* ideas overlay */
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(43, 39, 33, 0.35);
    display: flex; align-items: flex-end; justify-content: center;
  }
  #overlay[hidden] { display: none; }
  #sheet {
    background: var(--panel);
    width: min(44rem, 100%);
    max-height: 72vh; overflow-y: auto;
    border-radius: 14px 14px 0 0;
    border: 1px solid var(--line); border-bottom: none;
    padding: 0.4rem 1rem 1rem;
  }
  .sheet-head {
    position: sticky; top: 0; background: var(--panel);
    display: flex; justify-content: space-between; align-items: center;
    font-family: system-ui, sans-serif; font-size: 0.85rem;
    color: var(--muted);
    padding: 0.6rem 0; border-bottom: 1px solid var(--line);
  }
  .sheet-head .sheet-actions { display: flex; gap: 0.5rem; }
  .sheet-head button { padding: 0.3rem 0.8rem; font-size: 0.82rem; }
  .card {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 0.7rem 0.9rem; margin-top: 0.7rem; cursor: pointer;
    background: #fff;
  }
  .card:hover { border-color: var(--accent); }
  .card .card-title {
    font-family: system-ui, sans-serif; font-weight: 600; font-size: 0.92rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .badge {
    font-size: 0.7rem; font-weight: 500; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 99px;
    padding: 0 0.5rem;
  }
  .card .card-action { margin-top: 0.3rem; font-size: 0.92rem; }
  .card .card-why {
    font-family: system-ui, sans-serif; font-size: 0.78rem;
    color: var(--muted); margin-top: 0.3rem;
  }
  .sheet-note {
    font-family: system-ui, sans-serif; font-size: 0.85rem;
    color: var(--muted); padding: 1rem 0;
  }
  .sheet-note.error { color: var(--error); }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <span class="title" id="storyTitle">AIRPG</span>
    <span class="status">
      <span id="sceneName"></span>
      <span id="inventory"></span>
      <span id="turnNo"></span>
      <span id="devMode" class="dev-mode" hidden></span>
    </span>
  </div>
</header>

<main id="transcript"></main>

<footer>
  <div class="input-inner">
    <textarea id="input" rows="2"
      placeholder="输入你的行动……（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="ideasBtn" class="ghost" title="生成行动提案">灵感</button>
    <button id="sendBtn">发送</button>
  </div>
</footer>

<div id="overlay" hidden>
  <div id="sheet">
    <div class="sheet-head">
      <span>行动提案 · 点击直接执行，可完全忽略</span>
      <span class="sheet-actions">
        <button id="refreshBtn" class="ghost">刷新</button>
        <button id="closeBtn" class="ghost">关闭</button>
      </span>
    </div>
    <div id="ideasList"></div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const transcript = $("transcript");
const input = $("input");
const sendBtn = $("sendBtn");
const ideasBtn = $("ideasBtn");
const overlay = $("overlay");
const ideasList = $("ideasList");

const NOTICES = {
  physical_conflict: "（上面这段与物理事实核对冲突，已撤回，正在重写……）",
  narration_fallback: "（上面这段未能完成，已撤回。）",
};
const DEFAULT_NOTICE = "（上面这段已撤回，正在重写……）";
const EDITOR_REASONS = {
  shadow_mode: "shadow 模式只观察，不采用候选",
  edited_candidate_accepted: "候选通过保护检查与物理事实复核",
  editor_unchanged: "编辑器逐字返回初稿",
  editor_error: "编辑器调用失败，回退初稿",
  editor_candidate_rejected: "候选未通过代码级保护",
  edited_fact_check_error: "候选事实复核调用失败",
  edited_fact_validation_failed: "候选未通过物理事实校验",
  physical_facts_changed: "编辑前后的物理状态变化不一致",
};
const GUARD_REASONS = {
  empty_candidate: "空输出",
  output_artifact: "包含编辑说明或 Markdown 围栏",
  over_compressed: "压缩幅度超过下限",
  scope_expanded: "扩写幅度超过上限",
  protected_term_removed: "删除了受保护名称",
  protected_term_added: "添加了原稿未出现的可见名称",
  number_removed: "删除或改写了数字",
  number_added: "添加或改写了数字",
};
let busy = false;

function scrollBottom() {
  window.scrollTo({ top: document.body.scrollHeight });
}

function block(cls, text) {
  const el = document.createElement("div");
  el.className = "block " + cls;
  el.textContent = text;
  transcript.appendChild(el);
  scrollBottom();
  return el;
}

function setStatus(s) {
  $("storyTitle").textContent = s.story_title;
  document.title = s.story_title;
  $("sceneName").textContent = "场景：" + s.scene_name;
  $("inventory").textContent =
    s.inventory.length ? "持有：" + s.inventory.join("、") : "";
  $("turnNo").textContent = "回合 " + s.turn_no;
}

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  ideasBtn.disabled = value;
  input.disabled = value;
  if (!value) input.focus();
}

function renderEditorComparison(data) {
  const panel = document.createElement("section");
  panel.className = "editor-comparison";

  const head = document.createElement("div");
  head.className = "editor-comparison-head";
  const title = document.createElement("span");
  title.className = "editor-comparison-title";
  title.textContent = `开发 · 行编辑对照 · 回合 ${data.turn}`;
  const badges = document.createElement("span");
  badges.className = "editor-comparison-badges";
  for (const value of [data.mode, data.status]) {
    const chip = document.createElement("span");
    chip.className = "editor-chip";
    chip.textContent = value;
    badges.appendChild(chip);
  }
  head.append(title, badges);

  const grid = document.createElement("div");
  grid.className = "editor-grid";
  const panes = [
    ["编辑前", data.draft, data.selected === "draft"],
    ["编辑后", data.candidate ?? "（编辑器没有返回候选）", data.selected === "edited"],
  ];
  for (const [labelText, prose, selected] of panes) {
    const pane = document.createElement("div");
    pane.className = "editor-pane" + (selected ? " selected" : "");
    const label = document.createElement("div");
    label.className = "editor-pane-label";
    const labelName = document.createElement("span");
    labelName.textContent = labelText;
    label.appendChild(labelName);
    if (selected) {
      const mark = document.createElement("span");
      mark.className = "selected-mark";
      mark.textContent = "最终采用";
      label.appendChild(mark);
    }
    const text = document.createElement("div");
    text.className = "editor-pane-text";
    text.textContent = prose;
    pane.append(label, text);
    grid.appendChild(pane);
  }

  const guard = data.guard || {};
  const guardReasons = (guard.reasons || []).map(
    (reason) => GUARD_REASONS[reason] || reason
  );
  const meta = document.createElement("div");
  meta.className = "editor-comparison-meta";
  const pieces = [
    `选择原因：${EDITOR_REASONS[data.reason] || data.reason}`,
    `字符比例：${guard.char_ratio ?? "—"}`,
    `粗粒度保护：${guard.accepted ? "通过" : "拒绝"}`,
  ];
  if (guardReasons.length) pieces.push("Guard：" + guardReasons.join("；"));
  if (data.error) pieces.push("错误：" + data.error);
  meta.textContent = pieces.join(" · ");

  panel.append(head, grid, meta);
  transcript.appendChild(panel);
  scrollBottom();
  return panel;
}

async function streamPost(url, body, onEvent) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const type = res.headers.get("Content-Type") || "";
  if (!type.includes("text/event-stream")) {
    const data = await res.json().catch(() => ({}));
    onEvent({ type: "error", message: data.error || `请求失败（${res.status}）` });
    return;
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const frame = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      for (const line of frame.split("\n")) {
        if (line.startsWith("data: ")) onEvent(JSON.parse(line.slice(6)));
      }
    }
  }
}

async function runTurn(url, body, playerText) {
  if (busy) return;
  setBusy(true);
  if (playerText !== null) block("player", playerText);
  let paragraph = block("narrative streaming", "");
  try {
    await streamPost(url, body, (ev) => {
      if (ev.type === "player_text") {
        const el = document.createElement("div");
        el.className = "block player";
        el.textContent = ev.text;
        transcript.insertBefore(el, paragraph);
      } else if (ev.type === "delta") {
        paragraph.textContent += ev.text;
        scrollBottom();
      } else if (ev.type === "restart") {
        // 屏幕上还没有字就保持沉默，与 CLI 的监听器语义一致。
        if (paragraph.textContent) {
          paragraph.classList.remove("streaming");
          paragraph.classList.add("withdrawn");
          block("notice", NOTICES[ev.reason] || DEFAULT_NOTICE);
          paragraph = block("narrative streaming", "");
        }
      } else if (ev.type === "editor_comparison") {
        renderEditorComparison(ev);
      } else if (ev.type === "committed") {
        paragraph.textContent = ev.narrative;
        paragraph.classList.remove("streaming");
        if (ev.tail) block("tail", ev.tail);
        setStatus(ev.snapshot);
      } else if (ev.type === "error") {
        if (paragraph.textContent) {
          paragraph.classList.remove("streaming");
          paragraph.classList.add("withdrawn");
        } else {
          paragraph.remove();
        }
        block("notice error", ev.message);
      }
    });
  } catch (err) {
    block("notice error", "（连接中断：" + err.message + "）");
  }
  paragraph.classList.remove("streaming");
  setBusy(false);
  scrollBottom();
}

function sendCurrentInput() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  runTurn("/api/turn", { text }, text);
}

function renderIdeas(actions) {
  ideasList.textContent = "";
  for (const action of actions) {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = action.title;
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = action.focus;
    title.appendChild(badge);
    const body = document.createElement("div");
    body.className = "card-action";
    body.textContent = action.action_text;
    const why = document.createElement("div");
    why.className = "card-why";
    why.textContent = "侧重点：" + action.rationale;
    card.append(title, body, why);
    card.addEventListener("click", () => {
      overlay.hidden = true;
      runTurn("/api/idea", { suggestion_id: action.suggestion_id }, null);
    });
    ideasList.appendChild(card);
  }
}

async function openIdeas(refresh) {
  if (busy) return;
  overlay.hidden = false;
  ideasList.innerHTML = '<div class="sheet-note">正在生成提案……</div>';
  $("refreshBtn").disabled = true;
  try {
    const res = await fetch("/api/ideas", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh }),
    });
    const data = await res.json();
    if (!res.ok) {
      ideasList.innerHTML = "";
      const note = document.createElement("div");
      note.className = "sheet-note error";
      note.textContent = data.error || `提案生成失败（${res.status}）`;
      ideasList.appendChild(note);
      return;
    }
    renderIdeas(data.actions);
  } catch (err) {
    ideasList.innerHTML = "";
    const note = document.createElement("div");
    note.className = "sheet-note error";
    note.textContent = "（连接中断：" + err.message + "）";
    ideasList.appendChild(note);
  } finally {
    $("refreshBtn").disabled = false;
  }
}

async function boot() {
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    setStatus(data.snapshot);
    if (data.developer?.editor_comparison) {
      const devMode = $("devMode");
      devMode.hidden = false;
      devMode.textContent = `编辑对照 · ${data.developer.prose_editor_mode}`;
    }
    const comparisons = new Map(
      (data.editor_comparisons || []).map((item) => [item.turn, item])
    );
    for (const text of data.intro) block("intro", text);
    for (const event of data.history) {
      block("player", event.player_text);
      block("narrative", event.narrative);
      if (comparisons.has(event.turn_no)) {
        renderEditorComparison(comparisons.get(event.turn_no));
      }
    }
    scrollBottom();
  } catch (err) {
    block("notice error", "（无法连接服务器：" + err.message + "）");
  }
  input.focus();
}

sendBtn.addEventListener("click", sendCurrentInput);
input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) {
    ev.preventDefault();
    sendCurrentInput();
  }
});
ideasBtn.addEventListener("click", () => openIdeas(false));
$("refreshBtn").addEventListener("click", () => openIdeas(true));
$("closeBtn").addEventListener("click", () => { overlay.hidden = true; });
overlay.addEventListener("click", (ev) => {
  if (ev.target === overlay) overlay.hidden = true;
});

boot();
</script>
</body>
</html>
