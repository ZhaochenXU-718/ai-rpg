id: open_neighbor_scene
title: "开放场景夹具：院子里的遮雨布"
version: 0.6.0
schema_version: 2
content_profile: narrative_first
language: zh-CN
genre: open_slice_of_life_fixture

premise: |
  院子里准备摆一张公共长桌。玩家可以自由观察、交谈或向修理铺店主询问
  是否有能遮住桌面的东西；普通行动完全交给叙事循环。

player_facing_summary: "帮院子借一块遮雨布，看似小事，却要照顾好邻里之间的分寸。"

emotional_contract: "让玩家持续体会日常互助里的分寸感：小心开口、体面收尾。"

opening_narration: |
  你挽着袖子跨进修理铺时，周师傅正把一摞洗净的旧物往架子上码。他抬头看了
  你一眼，手上的活没停："长桌的事？林姐下午提过一嘴。"卷帘门外，午后的光
  把院子晒得发白。话说到这儿，他没有再问，等着你开口。

ai_plot:
  player_role: "主动张罗公共长桌的住户，需要向邻居开口借东西。"
  main_goal: "在不伤邻里体面的前提下，为长桌找到合适的遮盖物。"
  opposition: "没有反派；阻力来自开口借物的分寸和各家自己的安排。"
  hidden_truth: "防雨布是周师傅亡妻缝补过的旧物；他嘴上爽快，心里在意它的去向。"

narrative_guidelines:
  - "对白短促、生活化，不使用戏剧腔。"
  - "冲突停留在分寸与体面层面，不升级为争吵。"

critical_reminders:
  - "不替玩家决定说什么或做什么。"
  - "周师傅不会主动说出防雨布的来历。"

openings:
  workshop_start:
    title: "从修理铺开始"
    positions:
      player: workshop
  courtyard_start:
    title: "从院子开始"
    intro: "你先在院子里打量那张长桌，再决定去哪儿找能遮住它的东西。"
    positions:
      player: courtyard

modules:
  canvas_request:
    category: main
    title: "开口借防雨布"
    purpose: "把玩家从观察推进到正面开口，推动主线。"
    hook: "周师傅整理架子时，那块叠好的防雨布正好露出来。"
    trigger: "玩家在修理铺与周师傅交谈、但尚未明确说明来意时。"
    involves: [keeper_zhou, rain_canvas]
    escalation: "玩家含糊其辞时，周师傅会直接问用途和归还时间。"
    resolution: "玩家说明用途并获得防雨布。"
    priority: high
  zhou_hesitation:
    category: character
    title: "周师傅的迟疑"
    purpose: "带出防雨布的来历，让周师傅立体起来。"
    hook: "周师傅的目光会在防雨布上多停一下，欲言又止。"
    trigger: "玩家借走防雨布之后，再次与周师傅独处时。"
    involves: [keeper_zhou, rain_canvas]
    escalation: "玩家追问时他先岔开话题；玩家表现出珍惜物件时才说出来历。"
    resolution: "玩家知晓来历并妥善归还。"
    fallback: "玩家始终不接话，他在归还时只说一句「放这儿就行」。"
    cooldown_turns: 4
  lin_aftermath:
    category: aftermath
    title: "林姐的疙瘩"
    purpose: "让绕过邻居的选择留下可感的余波。"
    hook: "林姐搭话时比平时淡了几分。"
    trigger: "玩家此前对周师傅的旧物之情毫无回应、事情却已办成之后。"
    involves: [neighbor_lin]
    requires:
      - module: zhou_hesitation
        status: dropped
    tags: [neighborly]

player_role:
  id: player
  name: "住户"
  public_identity: "帮忙整理公共院子的住户"
  private_goal: "找到一件能临时盖住长桌的东西"
  constraints:
    - "不能凭空获得物品，也不能强迫别人交出私人物品。"

style_bible:
  tone: "克制、日常"
  camera: "只写当前院子和修理铺里可见的事物"
  dialogue: "简短自然"
  avoid:
    - "不要制造新人物或突发灾难。"

global_rules:
  boundaries:
    - "核心人物和可进入场景都已经在内容中定义。"

items:
  rain_canvas:
    name: "旧防雨布"
    description: "洗净后叠在修理铺架子上，可以临时遮住长桌。"
    portable: true
    consumable: false
    visible_when_carried: true

initial_state:
  positions:
    player: workshop
    keeper_zhou: workshop
    neighbor_lin: courtyard
  item_locations:
    rain_canvas: { type: carried_by, id: keeper_zhou }

characters:
  player:
    name: "住户"
    role: player
    public_profile: "正在帮忙整理公共院子。"
  keeper_zhou:
    name: "周师傅"
    role: practical_keeper
    public_profile: "修理铺店主，愿意把闲置东西借给明确说明用途的邻居。"
    motivation: "不耽误营业地解决邻里的实际小问题。"
    voice: "说话直接，先问用途和归还时间；确认是公共事务后会给出明确答复。"
    initial_relationship: "认识玩家这个邻居；对说明用途、尊重物品归属的人一向爽快。"
    secret: "防雨布是亡妻缝补过的旧物；他愿意外借，但希望它被善待并按时回来。"
    pressure: "铺子里还压着没修完的活，他不想在寒暄上耗太久。"
    behavior: "被明确说明用途时痛快答应；察觉对方轻慢物品时会不动声色地多问一句。"
    mannerisms: "习惯边擦手边说话，答应借出前会先看一眼那件东西。"
    dialogue_examples:
      - "要遮多大的桌面？今晚就用？"
  neighbor_lin:
    name: "林姐"
    role: observant_neighbor
    public_profile: "住在院子另一侧，做事前习惯先看清大家需要什么。"
    motivation: "在确实需要时搭把手，不抢着替别人做决定。"
    voice: "先描述自己看到的情况，再提出建议；不会替别人许诺。"
    initial_relationship: "和玩家是普通邻居，愿意提供信息，但会把决定留给当事人。"

scenes:
  workshop:
    name: "修理铺"
    purpose: "验证普通对话不会隐式改变关键物品归属。"
    goal: "说明用途并取得能盖住长桌的东西"
    entry_text: "卷帘门开着一半，工具墙下叠着几件洗净的旧物。"
    exits:
      - to: courtyard
        label: "去公共院子"
    available_objects:
      environment:
        tool_wall: "挂满常用工具的墙"
        half_open_door: "半开的卷帘门"
  courtyard:
    name: "公共院子"
    purpose: "验证移动后感知只展示新场景中的人物与物品。"
    goal: "决定如何使用已经取得的遮盖物"
    entry_text: "长桌靠在墙边，树影在桌面上缓慢移动。"
    exits:
      - to: workshop
        label: "回修理铺"
    available_objects:
      environment:
        long_table: "靠墙的公共长桌"
        old_tree: "院角的老树"
